<!-- ================= 프로젝트 상세 ================= -->
<sc-if value="{{vProject}}">
  <div class="crumb"><button class="link" onClick="{{goProjects}}">프로젝트</button><span aria-hidden="true">/</span><span>{{w.name}}</span></div>
  <div class="ws-h">
    <div style="min-width: 0">
      <div class="row-f"><h1>{{w.name}}</h1><span class="{{w.pillCls}}"><i></i>{{w.stL}}</span></div>
      <p class="goal">{{w.objective}}</p>
      <sc-if value="{{criteriaPending}}"><button class="btn pri criteria-approve" onClick="{{approveCriteria}}">완료 조건 확인·승인</button></sc-if>
    </div>
    <div class="acts">
      <sc-if value="{{w.canStart}}"><button class="btn pri" onClick="{{w.start}}">{{w.startL}}</button></sc-if>
      <sc-if value="{{w.canStop}}"><button class="btn" onClick="{{w.stop}}">멈춤</button></sc-if>
      <sc-if value="{{w.canRunOnce}}"><button class="btn pri" onClick="{{w.runOnce}}">실행 1회</button></sc-if>
    </div>
  </div>

  <nav class="ptabs" aria-label="프로젝트 탭"><sc-for list="{{ptabs}}" as="tb"><button class="{{tb.cls}}" aria-current="{{tb.cur}}" onClick="{{tb.go}}">{{tb.l}}<sc-if value="{{tb.hasN}}"><span class="n">{{tb.n}}</span></sc-if></button></sc-for></nav>

  <!-- 개요 · 대화 스레드 (메타 뮤즈 방식: 대화·진행·승인이 한 흐름, 오른쪽에 계획과 할 일) -->
  <sc-if value="{{pt.over}}">
    <div class="ws-grid">
      <section class="thread-wrap" aria-label="프로젝트 대화">
        <div class="thread" role="log" aria-live="polite">
          <sc-for list="{{w.thread}}" as="x">
            <div class="{{x.cls}}">
              <sc-if value="{{x.hasMono}}"><span class="mono-tile" aria-hidden="true">{{x.mono}}</span></sc-if>
              <div class="meta"><b>{{x.who}}</b><span class="small muted sub" title="{{x.sub}}">{{x.sub}}</span><span class="small muted when">{{x.when}}</span></div>
              <div class="body">{{x.text}}</div>
              <sc-if value="{{x.hasAtt}}"><div class="att-list"><sc-for list="{{x.atts}}" as="a"><sc-if value="{{a.isImage}}"><button class="att-img" onClick="{{a.open}}" title="{{a.name}} · 새 창에서 크게 보기"><img src="{{a.src}}" alt="{{a.name}}" loading="lazy"></button></sc-if><sc-if value="{{a.isText}}"><button class="att" onClick="{{a.open}}" title="새 창에서 보기"><span class="small">{{a.name}}</span><span class="small muted">{{a.sizeL}}</span></button></sc-if><sc-if value="{{a.isPdf}}"><span class="att"><span class="small">{{a.name}}</span><span class="small muted">{{a.sizeL}}</span></span></sc-if><sc-if value="{{a.hasConv}}"><button class="att" onClick="{{a.openConv}}" title="엔진이 바꾼 Markdown · 팀은 이것을 읽습니다"><span class="small">변환본 보기</span></button></sc-if></sc-for></div></sc-if>
              <sc-if value="{{x.hasTools}}"><div class="tchecks"><div class="inspection-head"><span>검사 결과</span><sc-if value="{{x.allToolsPassed}}"><span class="inspection-all-pass">모두 통과</span></sc-if></div><sc-for list="{{x.tools}}" as="k"><div class="tcheck inspection"><span class="{{k.pillCls}}"><i></i>{{k.stL}}</span><div class="inspection-copy"><b>{{k.name}}</b><span>{{k.summary}}</span></div><sc-if value="{{k.hasDetails}}"><details><summary>자세히</summary><div class="answer">{{k.details}}</div></details></sc-if></div></sc-for></div></sc-if>
              <sc-if value="{{x.hasAnswer}}"><details><summary>팀 답변 전체</summary><div class="answer">{{x.answer}}</div></details></sc-if>
            </div>
          </sc-for>
          <sc-if value="{{w.working}}"><div class="msg sys working"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>{{w.workingL}}</div>
            <sc-if value="{{w.hasLive}}"><ol class="live-list" aria-label="지금 하는 일" aria-live="polite"><sc-for list="{{w.live}}" as="l"><li class="{{l.cls}}"><span class="when">{{l.when}}</span><span>{{l.text}}</span></li></sc-for></ol></sc-if></sc-if>
          <sc-if value="{{w.hasQuestion}}">
            <div class="{{w.questionCls}}">
              <div class="meta"><b>{{w.askedBy}}</b><span class="small muted">대장의 답이 필요합니다</span></div>
              <div class="body big">{{w.question}}</div>
              <sc-if value="{{w.hasJudge}}"><div class="judge"><sc-for list="{{w.judge}}" as="j"><div class="judge-row"><span>{{j.l}}</span><button class="btn pri sm" onClick="{{j.go}}">완료로 확인</button></div></sc-for></div></sc-if>
              <div class="hint">{{w.answerHint}}</div>
            </div>
          </sc-if>
          <sc-if value="{{criteriaPending}}">
            <div class="msg action attn">
              <div class="meta"><b>기획팀</b><span class="small muted">완료 조건 승인이 필요합니다</span></div>
              <div class="body">대화에서 이 조건들을 도출했습니다. 승인하면 이 조건으로 작업과 검증을 진행합니다.</div>
              <ol class="ul"><sc-for list="{{w.pendingCriteria}}" as="c"><li>{{c}}</li></sc-for></ol>
              <div class="row-f"><button class="btn pri sm" onClick="{{approveCriteria}}">이 조건으로 승인</button><span class="hint">고칠 점이 있으면 아래에 적어 보내세요. 조건을 다시 도출합니다.</span></div>
            </div>
          </sc-if>
          <sc-if value="{{w.hasProposal}}">
            <div class="msg action done">
              <div class="meta"><b>검증팀</b><span class="small muted">완료 · 다음 개선안</span></div>
              <ul class="ul"><sc-for list="{{w.proposal}}" as="p"><li>{{p}}</li></sc-for></ul>
              <div class="row-f"><button class="btn pri sm" onClick="{{w.accept}}">승인하고 계속</button><button class="btn sm" onClick="{{w.dismiss}}">보류</button></div>
            </div>
          </sc-if>
          <sc-if value="{{w.atDailyCap}}">
            <div class="msg action daily-cap">
              <div class="meta"><b>엔진</b><span class="small muted">단계 한도</span></div>
              <div class="body">{{w.capText}}</div>
              <div class="row-f cap-actions"><sc-for list="{{w.extendActs}}" as="x"><button class="{{x.cls}}" onClick="{{x.go}}">{{x.l}}</button></sc-for></div>
            </div>
          </sc-if>
          <sc-if value="{{w.hasIssue}}">
            <div class="{{w.issueMsgCls}}">
              <div class="meta"><b>엔진</b><span class="small muted">{{w.issueTitle}}</span></div>
              <div class="body">{{w.issueText}}</div>
              <div class="row-f"><sc-for list="{{w.issueActions}}" as="a"><button class="{{a.cls}}" onClick="{{a.go}}">{{a.l}}</button></sc-for></div>
            </div>
          </sc-if>
        </div>
        <div class="composer" onDragover="{{w.onDragOver}}" onDrop="{{w.onDrop}}">
          <label class="sr" for="ws-compose">{{w.composerLabel}}</label>
          <sc-if value="{{w.hasAttach}}"><div class="att-list" aria-label="보낼 첨부"><sc-for list="{{w.attach}}" as="a"><span class="att" title="{{a.warn}}"><sc-if value="{{a.isImage}}"><img src="{{a.src}}" alt="{{a.name}}"></sc-if><span class="small">{{a.name}}</span><span class="small muted">{{a.sizeL}}</span><button class="link small" onClick="{{a.remove}}" aria-label="{{a.name}} 첨부 빼기">빼기</button></span></sc-for></div></sc-if>
          <textarea class="ta" id="ws-compose" placeholder="{{w.composerPh}}" value="{{w.draft}}" onChange="{{w.onDraft}}" onPaste="{{w.onPaste}}"></textarea>
          <input id="ws-file" class="sr" type="file" multiple accept=".png,.jpg,.jpeg,.webp,.gif,.pdf,.txt,.md,.csv,.json,.log,.hwp,.hwpx,.docx,.xlsx,image/*" onChange="{{w.onFiles}}" tabindex="-1" aria-hidden="true">
          <div class="row-f composer-row"><button class="btn ghost sm" onClick="{{w.pickFiles}}" disabled="{{w.attachDisabled}}">{{w.attachL}}</button><span class="hint">{{w.composerHint}}</span><button class="btn pri sm" onClick="{{w.send}}" disabled="{{w.sendDisabled}}">{{w.sendL}}</button></div>
          <p class="hint" style="margin: 6px 0 0">{{w.attachHint}}</p>
        </div>
      </section>
      <aside class="stack side" aria-label="계획과 진행">
        <div class="card">
          <div class="lbl">계획 · 완료 조건 {{w.proven}}/{{w.total}}{{w.recheckL}}</div>
          <div class="bar"><i style="width: {{w.pct}}%"></i></div>
          <div class="crit" style="margin-top: 12px">
            <sc-for list="{{w.crit}}" as="c"><div class="cr"><span class="{{c.ckCls}}"><sc-if value="{{c.ok}}"><svg viewBox="0 0 12 12" fill="none" stroke="#fff" stroke-width="2"><path d="M2.5 6.2l2.2 2.2 4.8-5"></path></svg></sc-if></span><div style="min-width: 0"><div class="t small">{{c.t}}</div></div><span></span></div></sc-for>
          </div>
          <sc-if value="{{w.noCriteria}}"><p class="hint">기획팀이 대화에서 완료 조건을 정하면 여기에 보입니다.</p></sc-if>
          <button class="link small" style="margin-top: 8px" onClick="{{w.goVerify}}">근거 보기</button>
        </div>
        <div class="card">
          <div class="lbl">할 일</div>
          <ol class="next"><sc-for list="{{w.upcoming}}" as="u"><li class="{{u.cls}}"><div class="row-f"><b class="small">{{u.team}}</b><span class="kind">{{u.state}}</span></div><div class="small muted">{{u.what}}</div></li></sc-for></ol>
          <sc-if value="{{w.hasWaitNote}}"><p class="hint" style="margin-top: 8px">{{w.waitNote}}</p></sc-if>
          <sc-if value="{{w.atDailyCap}}"><div class="row-f cap-actions" style="margin-top: 8px"><sc-for list="{{w.extendActs}}" as="x"><button class="{{x.cls}}" onClick="{{x.go}}">{{x.l}}</button></sc-for></div></sc-if>
        </div>
        <sc-if value="{{w.hasLanes}}"><div class="card">
          <div class="lbl">병렬 작업</div>
          <sc-for list="{{w.lanes}}" as="l"><div class="{{l.cls}}"><div class="row-f" style="justify-content: space-between"><b class="small">{{l.team}}</b><span class="{{l.pillCls}}"><i></i>{{l.stL}}</span></div>
            <div class="small muted">{{l.folder}} · 조건 {{l.proven}}/{{l.total}}</div><div class="small">{{l.task}}</div>
            <sc-if value="{{l.held}}"><p class="hint" style="margin-top: 6px">{{l.held}}</p></sc-if>
            <sc-if value="{{l.hasQ}}"><div class="q small" style="margin-top: 8px; white-space: pre-wrap">{{l.question}}</div>
              <div class="judge"><sc-for list="{{l.judge}}" as="j"><div class="judge-row"><span>{{j.l}}</span><button class="btn pri sm" onClick="{{j.go}}">완료로 확인</button></div></sc-for></div>
              <label class="hint" for="{{l.inputId}}">답변</label>
              <textarea class="ta" id="{{l.inputId}}" placeholder="예: 메뉴 12종이 맞으니 그대로 진행해" value="{{l.draft}}" onChange="{{l.onDraft}}"></textarea>
              <div class="row-f" style="margin-top: 6px"><button class="btn pri sm" onClick="{{l.send}}">답변 보내고 계속</button></div></sc-if></div></sc-for>
          <p class="hint" style="margin-top: 8px">병렬 작업은 자기 폴더에만 쓰고, 원래 작업은 그 폴더에 쓰지 않습니다. 두 작업이 이 프로젝트의 하루 단계 한도를 함께 씁니다.</p>
        </div></sc-if>
        <div class="card">
          <div class="lbl">감시 에이전트</div>
          <p class="small">{{w.sentinelL}}</p>
          <sc-for list="{{w.sentinelBlocked}}" as="b"><div class="sentinel-row small"><span class="{{b.pillCls}}"><i></i>차단</span><span>{{b.text}}</span></div></sc-for>
        </div>
        <div class="card">
          <dl class="facts">
            <dt>진행 방식</dt><dd>{{w.kindL}}</dd>
            <dt>회차</dt><dd class="num">{{w.cycleL}}</dd>
            <dt>오늘</dt><dd class="num">{{w.today}} / {{limits.day}}단계</dd>
            <dt>작업 폴더</dt><dd class="small" style="overflow-wrap:anywhere">{{w.workspacePath}}</dd>
            <dt>만든 날</dt><dd class="num">{{w.created}}</dd>
          </dl>
        </div>
      </aside>
    </div>
  </sc-if>

  <!-- 활동 -->
  <sc-if value="{{pt.activity}}">
    <div class="list tl">
      <sc-for list="{{w.activity}}" as="a">
        <div class="ev">
          <div class="when">{{a.when}}</div>
          <div style="min-width: 0">
            <div class="who">{{a.who}}<span class="tool">{{a.tool}}</span><span class="{{a.pillCls}}"><i></i>{{a.resL}}</span></div>
            <div class="res">{{a.res}}</div>
            <sc-if value="{{a.hasTools}}"><div class="tchecks"><div class="inspection-head"><span>검사 결과</span><sc-if value="{{a.allToolsPassed}}"><span class="inspection-all-pass">모두 통과</span></sc-if></div><sc-for list="{{a.tools}}" as="k"><div class="tcheck inspection"><span class="{{k.pillCls}}"><i></i>{{k.stL}}</span><div class="inspection-copy"><b>{{k.name}}</b><span>{{k.summary}}</span></div><sc-if value="{{k.hasDetails}}"><details><summary>자세히</summary><div class="answer">{{k.details}}</div></details></sc-if></div></sc-for></div></sc-if>
            <sc-if value="{{a.hasAnswer}}"><details><summary>답변 보기</summary><div class="answer">{{a.answer}}</div></details></sc-if>
          </div>
        </div>
      </sc-for>
      <sc-if value="{{w.noRuns}}"><div class="empty sm">아직 활동이 없습니다.</div></sc-if>
    </div>
    <details class="panel" style="margin-top: 16px; padding: 4px 0">
      <summary style="padding: 12px 20px">엔진 기록 {{w.logCount}}건</summary>
      <div class="log"><sc-for list="{{w.log}}" as="l"><div><span class="ts">{{l.ts}}</span>{{l.tx}}</div></sc-for></div>
    </details>
  </sc-if>

  <!-- 검증 -->
  <sc-if value="{{pt.artifacts}}">
    <div class="card">
      <div class="row-f"><h2>결과물 미리보기</h2><button class="btn sm" onClick="{{showArtifacts}}">파일 새로고침</button></div>
      <p class="hint">HTML·이미지·텍스트를 격리된 화면에서 봅니다. 외부 통신과 HTML 스크립트는 차단됩니다.</p>
      <div class="row-f"><sc-for list="{{artifactItems}}" as="a"><button class="btn sm" onClick="{{a.open}}">{{a.path}}</button></sc-for></div>
      <p class="hint">{{artifactMessage}}</p>
      <sc-if value="{{hasPreview}}"><iframe title="선택한 결과물 미리보기" src="{{previewUrl}}" sandbox="" referrerpolicy="no-referrer" style="width:100%;height:65vh;border:1px solid var(--line);border-radius:10px;background:white"></iframe></sc-if>
    </div>
  </sc-if>
  <sc-if value="{{pt.verify}}">
    <div class="card" style="margin-bottom:20px"><h2>격리 테스트</h2><p class="hint">프로젝트 테스트 코드를 실행합니다. 프로젝트 안의 파일이 변경될 수 있으며 AI는 호출하지 않습니다. 아래 버튼을 누르면 실행에 동의합니다.</p><button class="btn sm" onClick="{{runSandboxTests}}" disabled="{{testBusy}}">승인하고 테스트 실행</button><p class="answer" role="status">{{testMessage}}</p></div>
    <div class="card">
      <div class="lbl">완료 조건 · {{w.proven}}/{{w.total}} 확인{{w.recheckL}}</div>
      <p class="hint" style="margin: 0 0 8px">엔진이 작업 폴더에서 직접 확인했거나 대장이 확인한 것만 통과로 칩니다. AI가 “했다”고 말한 것만으로는 통과가 아닙니다.</p>
      <div class="crit">
        <sc-for list="{{w.crit}}" as="c">
          <div class="cr">
            <span class="{{c.ckCls}}"><sc-if value="{{c.ok}}"><svg viewBox="0 0 12 12" fill="none" stroke="#fff" stroke-width="2"><path d="M2.5 6.2l2.2 2.2 4.8-5"></path></svg></sc-if></span>
            <div style="min-width: 0"><div class="t">{{c.t}}</div><div class="{{c.eCls}}">{{c.e}}</div></div>
            <sc-if value="{{c.canConfirm}}"><button class="btn sm" onClick="{{c.confirm}}">완료로 확인</button></sc-if>
            <sc-if value="{{c.confirmHint}}"><span class="hint small">{{c.confirmHint}}</span></sc-if>
          </div>
        </sc-for>
      </div>
    </div>
    <sc-if value="{{w.hasHistory}}">
      <div class="sec-h" style="margin-top: 28px"><h2>이전 목표</h2></div>
      <div class="list"><sc-for list="{{w.history}}" as="h"><div class="ev"><div class="when">{{h.when}}</div><div><div class="who">{{h.title}}<span class="{{h.pillCls}}"><i></i>{{h.stL}}</span></div><div class="res">{{h.sub}}</div></div></div></sc-for></div>
    </sc-if>
  </sc-if>

  <!-- 설정 -->
  <sc-if value="{{pt.settings}}">
    <div class="stack project-settings">
      <div class="card">
        <div class="lbl">팀별 모델 · 추론 수준</div>
        <p class="hint" style="margin: 0 0 12px">팀마다 쓸 모델과 추론 수준을 고릅니다. 고르지 않은 팀("자동")은 제어팀이 작업 난이도에 맞춰 고르고, 제어팀을 끄면 "기본" 표시된 모델로 실행됩니다. 목록은 Claude Code 공식 문서와 이 계정의 Codex 공식 목록에서 가져오며, 바꾼 내용은 다음 단계부터 적용됩니다.</p>
        <sc-if value="{{m.loading}}"><p class="hint">모델 목록을 불러오는 중…</p></sc-if>
        <sc-if value="{{m.hasCodexError}}"><p class="hint" style="color: var(--attn-text, #B45309)">Codex 모델 목록을 불러오지 못했습니다 · {{m.codexError}} · 목록이 돌아올 때까지 Codex 팀의 모델을 바꿀 수 없습니다.</p></sc-if>
        <div class="tm-list">
          <sc-for list="{{m.teams}}" as="t">
            <div class="tm-row">
              <div class="tm-head"><b>{{t.name}}</b><span class="kind">{{t.tool}}</span><span class="small muted">지금 · {{t.current}}</span></div>
              <div class="tm-picks">
                <div class="seg wrap" role="group" aria-label="{{t.name}} 모델"><sc-for list="{{t.models}}" as="o"><button class="{{o.cls}}" aria-pressed="{{o.on}}" onClick="{{o.pick}}">{{o.label}}</button></sc-for></div>
                <div class="seg wrap" role="group" aria-label="{{t.name}} 추론 수준"><sc-for list="{{t.efforts}}" as="o"><button class="{{o.cls}}" aria-pressed="{{o.on}}" onClick="{{o.pick}}">{{o.label}}</button></sc-for></div>
              </div>
            </div>
          </sc-for>
        </div>
        <div class="field" style="margin-top: 16px"><label>제어팀 · 작업 난이도에 따라 모델 자동 선택 · 모든 프로젝트 공통</label>
          <div class="seg" role="group" aria-label="모델 자동 선택"><sc-for list="{{autoLevelOpts}}" as="o"><button class="{{o.cls}}" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}">{{o.l}}</button></sc-for></div>
          <p class="hint">켜 두면 모델을 고르지 않은 팀은 간단한 일과 보통 일에 가벼운 모델(Claude Sonnet 5.5 · Codex GPT-6-Luna 중간~높음), 복잡하거나 위험한 일에 무거운 모델(Opus 5.5 · GPT-6.1-Sol 낮음~중간)을 씁니다. Codex Astra는 자동으로 쓰지 않습니다. 끄면 고르지 않은 팀은 목록의 기본 모델로 돕니다.</p></div>
        <dl class="facts" style="margin-top: 16px"><dt>최근 실제 모델</dt><dd class="mono small">{{m.actual}}</dd></dl>
      </div>
      <sc-if value="{{rt.show}}"><div class="card">
        <div class="lbl">템플릿</div>
        <p class="hint" style="margin: 0 0 12px">이 프로젝트의 목표·완료 조건·팀별 모델 선택을 저장해 두고, 새 프로젝트에서 새 내용으로 다시 씁니다. 파일과 대화는 옮기지 않습니다.</p>
        <button class="btn sm" onClick="{{rt.saveTemplate}}">템플릿으로 저장</button>
      </div></sc-if>
      <sc-if value="{{rt.show}}"><div class="card">
        <div class="lbl">반복 실행</div>
        <p class="hint" style="margin: 0 0 12px">정해진 때마다 이 프로젝트를 새 회차로 다시 돌립니다. 이전 회차가 끝나지 않았으면 건너뛰고, 회차마다 "결과 파일을 새로 갱신했다"를 엔진이 확인합니다. PC가 켜져 있어야 돌고, 꺼져 있던 동안 놓친 회차는 켠 뒤 한 번만 돕니다.</p>
        <div class="seg" role="group" aria-label="반복 주기"><sc-for list="{{rt.kinds}}" as="o"><button class="{{o.cls}}" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}">{{o.l}}</button></sc-for></div>
        <sc-if value="{{rt.weekly}}"><div class="seg wrap" role="group" aria-label="요일" style="margin-top: 8px"><sc-for list="{{rt.days}}" as="o"><button class="{{o.cls}}" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}">{{o.l}}</button></sc-for></div></sc-if>
        <sc-if value="{{rt.timed}}"><div class="row-f" style="margin-top: 8px"><label class="hint" for="rt-time">시각</label><input class="input" id="rt-time" type="time" style="max-width: 130px" value="{{rt.time}}" onChange="{{rt.onTime}}"></div></sc-if>
        <div class="row-f" style="margin-top: 10px"><button class="btn pri sm" onClick="{{rt.save}}">저장</button><button class="btn sm" onClick="{{rt.runNow}}">지금 한 번 실행</button></div>
        <dl class="facts" style="margin-top: 12px"><dt>지금</dt><dd>{{rt.status}}</dd><dt>다음 실행</dt><dd>{{rt.next}}</dd><dt>최근</dt><dd>{{rt.last}}</dd></dl>
      </div></sc-if>
      <div class="card">
        <div class="lbl">한도</div>
        <div class="field" style="margin-bottom: 12px"><label for="cap-in">하루 최대 단계 · 모든 프로젝트 공통 (기본 {{limits.dayDefault}})</label>
          <div class="row-f"><input class="input" id="cap-in" type="number" min="1" max="100" step="1" style="max-width: 110px" value="{{capDraft}}" onChange="{{onCap}}"><button class="btn sm" onClick="{{saveCap}}">저장</button><span class="hint">지금 {{limits.day}}단계 · 넘으면 다음 날 이어서. 사용량 기준(5시간 20%·주간 10%)은 따로 계속 적용됩니다.</span></div></div>
        <div class="field" style="margin-bottom: 12px"><label>권한 모드 · 이 프로젝트</label>
          <div class="seg" role="group" aria-label="이 프로젝트 권한 모드"><sc-for list="{{projModeOpts}}" as="o"><button class="{{o.cls}}" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}">{{o.l}}</button></sc-for></div>
          <p class="hint">알아서: 신뢰 쌓기 없이 진행하고 공개 사이트는 묻지 않고 엽니다. 꼼꼼히: 승인함의 웹 접근·신뢰 쌓기 설정대로 묻습니다. 완료 조건 승인, 대장 규칙, 삭제·게시·결제 성격의 동작은 어느 쪽이든 그대로입니다.</p></div>
        <div class="field" style="margin-bottom: 12px"><label>병렬 작업 · 모든 프로젝트 공통</label>
          <div class="seg" role="group" aria-label="병렬 작업"><sc-for list="{{parallelOpts}}" as="o"><button class="{{o.cls}}" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}">{{o.l}}</button></sc-for></div>
          <p class="hint">기획팀이 서로 상관없는 일을 찾으면, 한 가지를 다른 팀이 자기 폴더에서 동시에 진행합니다. 프로젝트마다 한 번에 하나만, 사용량은 그동안 두 배로 듭니다.</p></div>
        <div class="field" style="margin-bottom: 12px"><label>한도 자동 전환 · 모든 프로젝트 공통</label>
          <div class="seg" role="group" aria-label="한도 자동 전환"><sc-for list="{{switchOpts}}" as="o"><button class="{{o.cls}}" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}">{{o.l}}</button></sc-for></div>
          <p class="hint">한쪽 AI가 사용량 멈춤선(5시간 20% · 주간 10% 남음)에 닿으면 그 단계를 다른 AI로 돌립니다. 위험도가 높은 작업, 웹 검색이 필요한 작업은 옮기지 않고 기다립니다. 작업팀과 같은 AI가 검토하게 되면 기록에 “독립 검토 아님”으로 남습니다.</p></div>
        <dl class="facts"><dt>동시 실행</dt><dd>전체 {{limits.all}} · Claude Code {{limits.claude}} · Codex {{limits.codex}}</dd><dt>진전 없음</dt><dd>개발 단계 3번 연속이면 멈추고 알림</dd></dl>
      </div>
      <div class="card">
        <div class="lbl">자동 진행 · 기록</div>
        <p class="hint">프로젝트가 다음 작업을 이어갈지와 GitHub·Notion 기록 저장 상태를 관리합니다.</p>
        <div class="row-f"><button class="btn sm" onClick="{{w.toggleAutonomy}}">자율 후속 작업 · {{w.autonomyL}}</button><a class="btn sm" href="{{w.recordsUrl}}" target="_blank" rel="noopener noreferrer">GitHub·Notion 기록 초안</a><button class="btn sm" onClick="{{configureAutoSave}}">자동 저장 설정</button><button class="btn sm" onClick="{{inspectAutoSave}}">자동 저장 상태</button></div>
      </div>
      <div class="card danger-zone">
        <div class="lbl">프로젝트 삭제</div>
        <p class="hint" style="margin: 0 0 12px">목표·실행 기록·로그·모델 정책을 지웁니다. 작업 폴더 파일은 한 번 더 물어본 뒤에만 지웁니다. 실행 중에는 삭제할 수 없습니다.</p>
        <button class="btn danger" onClick="{{w.remove}}">프로젝트 삭제</button>
      </div>
    </div>
  </sc-if>
</sc-if>

<!-- ================= 승인함 (감시 에이전트 요청 · 결과 확인 · 기억 제안) ================= -->
<sc-if value="{{vInbox}}">
  <div class="page-h"><div><h1>승인함</h1><p class="lede">대장의 결정을 기다리는 일이 모두 여기에 모입니다 · {{ib.total}}건. 팀의 질문, 감시 에이전트가 멈춰 둔 동작, 처음 몇 번 확인하는 작업 결과, 팀이 제안한 기억.</p></div>
    <button class="btn sm" onClick="{{ib.reload}}">새로고침</button></div>
  <div class="stack">
    <sc-if value="{{ib.hasOthers}}">
      <section class="card">
        <div class="lbl">질문 · 개선안 · 멈춘 프로젝트 · {{ib.othersN}}건</div>
        <div class="list inbox">
          <sc-for list="{{ib.others}}" as="it">
            <div class="item">
              <span class="{{it.icoCls}}" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{it.icon}}"></path></svg></span>
              <div>
                <div class="t">{{it.title}} <span class="proj">· {{it.project}}</span></div>
                <div class="b">{{it.body}}</div>
                <sc-if value="{{it.isQuestion}}">
                  <div class="q">{{it.question}}</div>
                <sc-if value="{{it.hasJudge}}"><div class="judge"><sc-for list="{{it.judge}}" as="j"><div class="judge-row"><span>{{j.l}}</span><button class="btn pri sm" onClick="{{j.go}}">완료로 확인</button></div></sc-for></div></sc-if>
                  <div class="acts" style="flex-direction: column; align-items: stretch; max-width: 72ch">
                    <label class="hint" for="{{it.ibInputId}}">답변</label>
                    <textarea class="ta" id="{{it.ibInputId}}" placeholder="예: 주석을 더 쉽게 고쳐 줘 · 이 조건은 빼고 진행해" value="{{it.draft}}" onChange="{{it.onDraft}}"></textarea>
                    <div class="row-f"><button class="btn pri sm" onClick="{{it.send}}">답변 보내고 계속</button><button class="btn ghost sm" onClick="{{it.open}}">프로젝트 보기</button></div>
                  </div>
                </sc-if>
                <sc-if value="{{it.isProposal}}">
                  <ul class="ul"><sc-for list="{{it.items}}" as="x"><li>{{x}}</li></sc-for></ul>
                  <div class="acts"><button class="btn pri sm" onClick="{{it.accept}}">승인하고 계속</button><button class="btn sm" onClick="{{it.dismiss}}">보류</button><button class="btn ghost sm" onClick="{{it.open}}">프로젝트 보기</button></div>
                </sc-if>
                <sc-if value="{{it.isIssue}}">
                  <div class="acts"><sc-for list="{{it.actions}}" as="x"><button class="{{x.cls}}" onClick="{{x.go}}">{{x.l}}</button></sc-for></div>
                </sc-if>
              </div>
            </div>
          </sc-for>
        </div>
      </section>
    </sc-if>
    <section class="card">
      <div class="lbl">감시 에이전트 승인 요청 · {{ib.approvalsN}}건</div>
      <sc-for list="{{ib.approvals}}" as="a">
        <div class="ib-row col">
          <div style="min-width: 0"><div><b>{{a.sentence}}</b></div>
            <sc-if value="{{a.hasTask}}"><div class="small">하던 일 · {{a.task}}</div></sc-if>
            <sc-if value="{{a.hasExamples}}"><div class="small">열려던 주소 · <span class="mono">{{a.examples}}</span></div></sc-if>
            <div class="small muted">{{a.project}} · {{a.when}} · {{a.reason}}</div></div>
          <div class="row-f"><sc-for list="{{a.actions}}" as="x"><button class="{{x.cls}}" onClick="{{x.go}}">{{x.l}}</button></sc-for><button class="link small" onClick="{{a.open}}">프로젝트 열기</button></div>
          <details><summary class="small">다른 허용 범위</summary>
            <div class="row-f" style="margin-top: 8px"><sc-for list="{{a.more}}" as="x"><button class="{{x.cls}}" onClick="{{x.go}}">{{x.l}}</button></sc-for></div></details>
        </div>
      </sc-for>
      <sc-if value="{{ib.noApprovals}}"><p class="hint">기다리는 요청이 없습니다.</p></sc-if>
    </section>
    <section class="card">
      <div class="lbl">결과 확인 · 신뢰 쌓기 · {{ib.reviewsN}}건</div>
      <p class="hint" style="margin: 0 0 8px">새로운 종류의 작업은 처음 {{ib.trustRequired}}번 결과를 대장이 보고 나서야 자동으로 이어집니다. 지금: {{ib.trustLevels}}</p>
      <sc-for list="{{ib.reviews}}" as="r">
        <div class="ib-row col">
          <div class="row-f"><b>{{r.team}}</b><span class="kind">{{r.step}}</span><span class="small muted">{{r.project}}</span></div>
          <div class="small">{{r.files}} · 파일을 누르면 내용을 봅니다 (실행하지 않고 보여 주기만 합니다)</div>
          <div class="row-f"><sc-for list="{{r.fileBtns}}" as="f"><button class="{{f.cls}}" onClick="{{f.go}}">{{f.l}}</button></sc-for></div>
          <sc-if value="{{r.hasRemoved}}"><div class="small muted">{{r.removed}}</div></sc-if>
          <sc-if value="{{r.hasText}}"><pre class="answer" style="max-height: 50vh" aria-label="{{r.previewPath}} 내용">{{r.previewText}}</pre></sc-if>
          <sc-if value="{{r.hasFrame}}"><iframe title="바뀐 파일 내용" src="{{r.previewUrl}}" sandbox="" referrerpolicy="no-referrer" style="width:100%;height:50vh;border:1px solid var(--line);border-radius:10px;background:white"></iframe></sc-if>
          <sc-if value="{{r.hasTools}}"><div class="tchecks"><div class="inspection-head"><span>검사 결과</span><sc-if value="{{r.allToolsPassed}}"><span class="inspection-all-pass">모두 통과</span></sc-if></div><sc-for list="{{r.tools}}" as="k"><div class="tcheck inspection"><span class="{{k.pillCls}}"><i></i>{{k.stL}}</span><div class="inspection-copy"><b>{{k.name}}</b><span>{{k.summary}}</span></div></div></sc-for></div></sc-if>
          <sc-if value="{{r.hasAnswer}}"><details><summary>팀 답변 전체</summary><div class="answer">{{r.answer}}</div></details></sc-if>
          <div class="row-f"><button class="btn pri sm" onClick="{{r.accept}}">확인하고 계속</button><button class="btn sm" onClick="{{r.acceptAll}}">{{r.trustAllL}}</button><button class="btn sm" onClick="{{r.sendBack}}">되돌려 보내기</button><button class="link small" onClick="{{r.open}}">프로젝트 열기</button></div>
        </div>
      </sc-for>
      <sc-if value="{{ib.noReviews}}"><p class="hint">확인할 결과가 없습니다.</p></sc-if>
    </section>
    <section class="card">
      <div class="lbl">스킬 후보 · {{ib.skillsN}}건</div>
      <p class="hint" style="margin: 0 0 8px">팀이 필요하다고 한 스킬을 엔진이 찾아 검사했습니다 (신뢰 출처 우선). 켜기 전에는 어떤 작업에도 쓰이지 않습니다.</p>
      <sc-for list="{{ib.skills}}" as="k">
        <div class="ib-row"><div style="min-width: 0"><div class="row-f"><b>{{k.name}}</b><sc-if value="{{k.trusted}}"><span class="kind">신뢰 출처</span></sc-if><span class="small muted mono">{{k.source}}</span></div>
          <div class="small">{{k.description}}</div><div class="small muted">{{k.checksL}}</div></div>
          <div class="row-f ib-acts"><button class="btn pri sm" onClick="{{k.approve}}">켜기</button><button class="btn sm" onClick="{{k.drop}}">버리기</button><button class="link small" onClick="{{k.open}}">자세히</button></div></div>
      </sc-for>
      <sc-if value="{{ib.noSkills}}"><p class="hint">기다리는 스킬 후보가 없습니다.</p></sc-if>
      <sc-if value="{{ib.hasSkillsHeld}}"><p class="hint">자세한 검토가 필요한 후보 {{ib.skillsHeld}}건(라이선스 확인·위험 문구·외부 프로그램 필요)은 스킬 화면에 있습니다.</p></sc-if>
    </section>
    <section class="card">
      <div class="lbl">기억 제안 · {{ib.proposalsN}}건</div>
      <sc-for list="{{ib.proposals}}" as="p">
        <div class="ib-row"><div style="min-width: 0"><div>{{p.text}}</div><div class="small muted">{{p.scope}} · {{p.by}} 제안 · {{p.when}}</div></div>
          <div class="row-f ib-acts"><button class="btn pri sm" onClick="{{p.approve}}">기억하기</button><button class="btn sm" onClick="{{p.reject}}">버리기</button></div></div>
      </sc-for>
      <sc-if value="{{ib.noProposals}}"><p class="hint">팀이 제안한 기억이 없습니다.</p></sc-if>
    </section>
    <section class="card">
      <div class="lbl">허용해 둔 것</div>
      <sc-for list="{{ib.grants}}" as="g">
        <div class="ib-row"><div style="min-width: 0"><div class="row-f"><b>{{g.kindL}}</b><span class="mono small">{{g.target}}</span></div><div class="small muted">{{g.scope}} · {{g.project}} · {{g.when}}</div></div>
          <div class="ib-acts"><button class="btn sm" onClick="{{g.revoke}}">취소</button></div></div>
      </sc-for>
      <sc-if value="{{ib.noGrants}}"><p class="hint">허용해 둔 것이 없습니다.</p></sc-if>
    </section>
    <section class="card">
      <div class="lbl">대장 규칙</div>
      <p class="hint" style="margin: 0 0 12px">사이트·파일 경로·연결 도구마다 허용 / 승인 필요 / 금지를 정합니다. 기본 안전 규칙(작업 폴더 밖, 설정 파일, 비밀정보, 내부 주소)은 규칙과 상관없이 항상 막습니다. Claude 팀은 감시 에이전트가 동작마다 막고, Codex 팀은 단계가 끝난 뒤 바뀐 파일을 확인해 걸리면 멈춥니다.</p>
      <sc-for list="{{ru.items}}" as="r">
        <div class="ib-row"><div style="min-width: 0"><div class="row-f"><span class="{{r.pillCls}}"><i></i>{{r.actionL}}</span><b>{{r.kindL}}</b><span class="mono small">{{r.target}}</span></div><div class="small muted">{{r.scopeL}}{{r.noteL}}</div></div>
          <div class="ib-acts"><button class="btn sm" onClick="{{r.remove}}">삭제</button></div></div>
      </sc-for>
      <sc-if value="{{ru.none}}"><p class="hint">정한 규칙이 없습니다.</p></sc-if>
      <div class="field" style="margin-top: 12px"><label>새 규칙</label>
        <div class="seg" role="group" aria-label="규칙 대상 종류"><sc-for list="{{ru.kinds}}" as="o"><button class="{{o.cls}}" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}">{{o.l}}</button></sc-for></div>
        <input class="input" style="margin-top: 8px" placeholder="{{ru.placeholder}}" value="{{ru.target}}" onChange="{{ru.onTarget}}" aria-label="규칙 대상" autocomplete="off">
        <div class="seg" role="group" aria-label="규칙 동작" style="margin-top: 8px"><sc-for list="{{ru.actions}}" as="o"><button class="{{o.cls}}" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}">{{o.l}}</button></sc-for></div>
        <select class="input" style="margin-top: 8px" aria-label="적용 범위" onChange="{{ru.onScope}}"><sc-for list="{{ru.scopes}}" as="o"><option value="{{o.v}}" selected="{{o.sel}}">{{o.l}}</option></sc-for></select>
        <input class="input" style="margin-top: 8px" placeholder="메모 (선택) · 예: 회사 보안 정책" value="{{ru.note}}" onChange="{{ru.onNote}}" aria-label="규칙 메모" autocomplete="off">
        <div class="row-f" style="margin-top: 8px"><button class="btn pri sm" onClick="{{ru.add}}">규칙 추가</button></div></div>
    </section>
    <section class="card">
      <div class="lbl">설정</div>
      <div class="field"><label>권한 모드 · 모든 프로젝트 기본</label>
        <div class="seg" role="group" aria-label="권한 모드"><sc-for list="{{ib.modeOpts}}" as="o"><button class="{{o.cls}}" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}">{{o.l}}</button></sc-for></div>
        <p class="hint">{{ib.modeHint}} 어느 모드든 완료 조건 승인, 대장 규칙, 삭제·공유·게시·전송·결제 성격의 도구 동작, 내부 주소·비밀정보 차단은 그대로 대장에게 묻거나 막습니다.</p></div>
      <sc-if value="{{ib.careful}}">
      <div class="field"><label>웹 접근</label>
        <div class="seg" role="group" aria-label="웹 접근"><button class="{{ib.webAskCls}}" aria-pressed="{{ib.webAsk}}" onClick="{{ib.setWebAsk}}">처음 여는 사이트는 승인 받기</button><button class="{{ib.webOpenCls}}" aria-pressed="{{ib.webOpen}}" onClick="{{ib.setWebOpen}}">공개 사이트는 모두 허용</button></div>
        <p class="hint">어느 쪽이든 내부·로컬 주소, 비밀정보가 담긴 주소, 유출 의심 주소는 막습니다.</p></div>
      <div class="field"><label for="trust-in">신뢰 쌓기 · 작업 종류마다 대장이 먼저 확인할 결과 수 (0이면 끔)</label>
        <div class="row-f"><input class="input" id="trust-in" type="number" min="0" max="10" step="1" style="max-width: 90px" value="{{ib.trustDraft}}" onChange="{{ib.onTrust}}"><button class="btn sm" onClick="{{ib.saveTrust}}">저장</button></div></div>
      </sc-if>
    </section>
  </div>
</sc-if>

<!-- ================= 기억 ================= -->
<sc-if value="{{vMemory}}">
  <div class="page-h"><div><h1>기억</h1><p class="lede">대장의 선호와 규칙입니다. 승인한 기억만 팀 지시에 들어가며, 프로젝트가 바뀌어도 유지됩니다. 언제든 고치거나 잊게 할 수 있습니다.</p></div></div>
  <div class="stack">
    <section class="card">
      <div class="lbl">새 기억</div>
      <div class="seg wrap" role="group" aria-label="적용 범위"><sc-for list="{{mem.scopes}}" as="c"><button class="{{c.cls}}" aria-pressed="{{c.on}}" onClick="{{c.pick}}">{{c.l}}</button></sc-for></div>
      <div class="row-f" style="margin-top: 10px"><label class="sr" for="mem-in">기억할 내용</label><input class="input" id="mem-in" style="flex: 1; min-width: 220px" placeholder="예: 답은 한국어로 짧게 · 결제 기능은 만들지 않는다" value="{{mem.draft}}" onChange="{{mem.onDraft}}"><button class="btn pri sm" onClick="{{mem.add}}">기억하기</button></div>
    </section>
    <sc-for list="{{mem.groups}}" as="grp">
      <section class="card">
        <div class="lbl">{{grp.title}} · {{grp.n}}개</div>
        <sc-for list="{{grp.items}}" as="i">
          <div class="ib-row"><div style="min-width: 0"><div>{{i.text}}</div><div class="small muted">{{i.by}} · {{i.when}}</div></div>
            <div class="row-f ib-acts"><button class="btn sm" onClick="{{i.edit}}">고치기</button><button class="btn sm" onClick="{{i.forget}}">잊기</button></div></div>
        </sc-for>
      </section>
    </sc-for>
    <sc-if value="{{mem.empty}}"><div class="empty">아직 기억이 없습니다. 위에서 추가하거나, 팀이 제안한 기억을 승인함에서 승인하세요.</div></sc-if>
    <sc-if value="{{mem.hasPending}}"><p class="hint">팀이 제안한 기억 {{mem.pendingN}}건이 승인함에서 기다립니다.</p></sc-if>
    <div class="card danger-zone"><div class="lbl">전체 초기화</div><p class="hint" style="margin: 0 0 12px">기억과 기억 제안을 모두 지웁니다. 되돌릴 수 없습니다.</p><button class="btn danger" onClick="{{mem.reset}}">기억 모두 지우기</button></div>
  </div>
</sc-if>

<!-- ================= 팀 ================= -->
<sc-if value="{{vSkills}}">
  <div class="page-h"><div><h1>스킬 라이브러리</h1><p class="lede">용도와 적용 팀을 확인하세요. 검토 대기 스킬은 작업에 적용되지 않습니다.</p></div><button class="btn sm" onClick="{{refreshSkills}}">새로고침</button></div>
  <div class="card" style="margin-bottom:20px"><h2>등록된 스킬</h2><p>{{skillCounts}}</p><p class="hint">아래 목록은 실제 저장된 스킬입니다. ‘검토 대기’는 가져온 후보이며 아직 AI 작업에 사용되지 않습니다.</p></div>
  <p class="hint" role="status">{{skillsMessage}}</p>
  <details class="card" style="margin-bottom:20px"><summary>신뢰 출처 · 먼저 찾아볼 저장소 {{skillSources.n}}곳</summary>
    <p class="hint">팀이 스킬을 요청하면 엔진이 이 저장소들에서 먼저 찾고, 없을 때만 GitHub 전체를 검색합니다. 신뢰 출처라도 켜기 전에는 쓰이지 않습니다.</p>
    <sc-for list="{{skillSources.items}}" as="r"><div class="row-f small" style="margin-bottom:6px"><span class="mono" style="flex:1">{{r.name}}</span><button class="btn ghost sm" onClick="{{r.remove}}">빼기</button></div></sc-for>
    <div class="row-f" style="margin-top:8px"><label class="sr" for="src-in">추가할 저장소 (owner/저장소)</label><input class="input" id="src-in" style="max-width:280px" placeholder="owner/저장소" value="{{skillSources.draft}}" onChange="{{skillSources.onDraft}}"><button class="btn sm" onClick="{{skillSources.add}}">추가</button></div>
  </details>
  <details class="card" style="margin-bottom:20px"><summary>스킬 등록하기 · 만들기</summary>
    <p class="hint">GitHub 링크나 필요한 기능을 입력하고 ‘등록하기’를 누르세요. 새 스킬 초안이 필요하면 ‘만들기’를 누르세요. 등록 후 안전성 검토를 거쳐야 사용할 수 있습니다.</p>
    <div class="field"><label>필요한 용도 또는 GitHub 링크<input class="input" value="{{skillRequest}}" placeholder="예: 대시보드 디자인 / owner/저장소 / gh repo clone owner/저장소 / https://github.com/…" onChange="{{changeSkillRequest}}"></label></div>
    <div class="row-f" style="margin-top:8px"><button class="btn sm" onClick="{{importSkill}}" disabled="{{skillBusy}}">등록하기</button><button class="btn sm" onClick="{{draftSkill}}" disabled="{{skillBusy}}">만들기</button></div>
    <p class="hint" style="margin-top:4px;margin-bottom:0" role="status">{{skillFormMessage}}</p>
  </details>
  <div class="stack">
    <sc-for list="{{skillRows}}" as="k"><article class="card">
      <div class="sec-h"><h2>{{k.name}}</h2><span class="{{k.pillCls}}"><i></i>{{k.statusL}}</span></div>
      <p class="skill-description">{{k.description}}</p>
      <div class="row-f small muted"><span>{{k.teamL}}</span><span>출처: {{k.sourceL}}</span><span>{{k.usageL}}</span></div>
      <details class="skill-details">
        <summary>자세히 보기</summary>
        <p class="hint">라이선스: {{k.licenseL}} · {{k.intakeL}}</p>
        <div class="lbl" style="margin:12px 0 6px">적용 팀</div>
        <div class="seg wrap" role="group" aria-label="이 스킬을 적용할 팀"><sc-for list="{{k.teamOptions}}" as="o"><button class="{{o.cls}}" aria-pressed="{{o.pressed}}" disabled="{{o.disabled}}" onClick="{{o.toggle}}">{{o.label}}</button></sc-for></div>
        <p class="hint">팀을 바꾸면 호환성 검토를 다시 받아야 사용할 수 있습니다.</p>
        <div class="skill-checks"><div class="inspection-head"><span>자동 검사 결과 · 참고</span><sc-if value="{{k.allChecksPassed}}"><span class="inspection-all-pass">모두 통과</span></sc-if></div>
          <sc-for list="{{k.checkRows}}" as="c"><div class="tcheck inspection"><span class="{{c.pillCls}}"><i></i>{{c.stL}}</span><div class="inspection-copy"><b>{{c.name}}</b><span>{{c.text}}</span></div></div></sc-for></div>
        <div class="skill-review"><div class="lbl" style="margin:12px 0 6px">검토 상태 · {{k.gateL}}</div>
          <sc-for list="{{k.reviewRows}}" as="r"><div class="row-f small" style="margin-bottom:6px"><b style="min-width:84px">{{r.label}}</b><span class="muted" style="flex:1;min-width:160px">{{r.stateL}}</span><button class="btn sm" onClick="{{r.pass}}">통과</button><button class="btn ghost sm" onClick="{{r.hold}}">보류</button></div></sc-for>
          <div class="row-f" style="margin-top:10px"><sc-if value="{{k.canActivate}}"><button class="btn pri sm" onClick="{{k.activate}}">승인하고 켜기</button></sc-if><sc-if value="{{k.isActive}}"><button class="btn sm" onClick="{{k.disableIt}}">끄기</button></sc-if><button class="btn danger sm" onClick="{{k.removeIt}}">삭제</button></div></div>
        <dl class="facts" style="margin-top:12px"><dt>자동 선택 조건</dt><dd>{{k.triggerL}}</dd><dt>버전 지문</dt><dd class="mono small">{{k.id}}</dd><dt>출처 원문</dt><dd class="small">{{k.source}}</dd><dt>보안</dt><dd>{{k.security}}</dd><dt>정책·라이선스</dt><dd>{{k.policy}}</dd><dt>호환성</dt><dd>{{k.compatibility}}</dd></dl>
        <pre class="answer" style="max-height:480px;margin-top:16px">{{k.content}}</pre>
        <details><summary>라이선스 원문</summary><pre class="answer">{{k.licenseText}}</pre></details>
      </details>
    </article></sc-for>
    <sc-if value="{{skillsEmpty}}"><div class="empty">등록된 스킬이 없습니다. GitHub 후보와 자체 제작 초안을 등록하면 여기에 표시됩니다.</div></sc-if>
  </div>
  <details class="card" style="margin-top:20px"><summary>팀의 스킬 요청 · 검색 진행 상황</summary><p class="muted">요청은 등록된 스킬과 별개입니다. 후보를 수집하면 위 목록에 표시됩니다.</p><pre style="white-space:pre-wrap">{{skillNeedsText}}</pre></details>
</sc-if>
<sc-if value="{{vTeams}}">
  <div class="page-h"><div><h1>팀</h1><p class="lede">팀마다 맡은 일과 쓰는 AI, 할 수 있는 일입니다. 조사·개발·디자인팀이 만든 결과는 보안·정책팀이 검토하고 검증팀이 확인합니다. 모델은 각 프로젝트의 설정 탭에서 바꿉니다.</p></div></div>
  <div class="card" style="margin-bottom: 16px"><div class="sec-h"><h2>제어팀 · AI 없이 엔진이 직접</h2><span class="{{control.pillCls}}"><i></i>{{control.stL}}</span></div>
    <p class="hint">기획팀이 매 계획에 적는 난이도·위험도를 보고, 모델을 따로 고르지 않은 팀의 모델과 추론 수준을 정합니다. 간단한 일에 무거운 모델을 쓰지 않아 사용량을 아낍니다. 프로젝트 설정에서 팀 모델을 직접 고르면 그 선택이 우선입니다.</p>
    <dl class="facts"><sc-for list="{{control.rows}}" as="c"><dt>{{c.l}}</dt><dd>{{c.d}}</dd></sc-for></dl></div>
  <div class="card" style="margin-bottom: 16px"><h2>기록팀 · AI 없이 엔진이 직접</h2><p class="hint">실행·검증 기록을 GitHub·Notion에 붙여 넣을 초안으로 정리합니다. 대화 원문과 파일은 넣지 않고, 자동으로 보내지 않습니다.</p></div>
  <div class="stack">
    <sc-for list="{{teams}}" as="t">
      <div class="{{t.cardCls}}">
        <div class="row-f" style="justify-content: space-between"><div class="team-title"><span class="mono-tile lg" aria-hidden="true">{{t.mono}}</span><h2>{{t.name}}</h2><span class="kind">{{t.kind}}</span></div><span class="{{t.pillCls}}"><i></i>{{t.stL}}</span></div>
        <p class="hint" style="margin: 4px 0 14px">{{t.role}}</p>
        <dl class="facts"><dt>AI</dt><dd>{{t.ai}}</dd><dt>할 수 있는 일</dt><dd>{{t.access}}</dd><dt>최근 실제 실행</dt><dd>{{t.model}}</dd><dt>오늘</dt><dd class="num">{{t.today}}회</dd><dt>지금</dt><dd>{{t.now}}</dd></dl>
        <details style="margin-top: 16px"><summary>{{t.progsL}}</summary>
        <div class="progs" style="margin-top: 8px"><sc-for list="{{t.tools}}" as="p"><div class="prog">
          <div style="min-width: 0"><div class="row-f"><b class="small">{{p.name}}</b><span class="kind">{{p.howL}}</span></div>
            <div class="small muted">{{p.what}}</div>
            <sc-if value="{{p.hasDocs}}"><div class="small muted">{{p.extra}}<a href="{{p.docs}}" target="_blank" rel="noopener noreferrer">공식 문서</a></div></sc-if></div>
          <span class="{{p.pillCls}}"><i></i>{{p.statusL}}</span></div></sc-for>
          <sc-if value="{{t.noTools}}"><div class="small muted">프로그램 상태를 불러오는 중입니다.</div></sc-if></div></details>
        <sc-if value="{{t.hasRecent}}">
          <details class="team-recent">
            <summary>최근 작업 {{t.recentCount}}건</summary>
            <div class="crit"><sc-for list="{{t.recent}}" as="r"><div class="cr" style="grid-template-columns: 84px minmax(0,1fr) auto"><span class="small muted num">{{r.when}}</span><span class="small">{{r.project}} · {{r.res}}</span><span></span></div></sc-for></div>
          </details>
        </sc-if>
      </div>
    </sc-for>
  </div>
</sc-if>

<!-- ================= 연결 ================= -->
<sc-if value="{{vConnect}}">
  <div class="card" style="margin-bottom: 16px">
    <h2>모델 연결 · 계정 확인</h2>
    <p class="hint">모델·추론 수준은 프로젝트의 설정 탭에서 선택합니다. 아래는 등록된 모델의 확인 상태이며, 수동 확인 기록은 자동 접속 검증이 아닙니다.</p>
    <sc-for list="{{modelProfiles}}" as="profile"><div class="row-f" style="margin-top: 12px"><span>{{profile.label}} · {{profile.executor}} · {{profile.status}}</span><button class="btn sm" onClick="{{profile.attest}}">공식 계정 수동 확인</button></div></sc-for>
  </div>
  <div class="page-h">
    <div><h1>연결</h1><p class="lede">팀이 쓰는 AI 도구와 서비스입니다. 공식 연결 방법만 쓰며, 상태는 각 도구의 공식 명령으로 확인합니다.</p></div>

// Minimal renderer for the template syntax: {{path}}, <sc-if value>, <sc-for list as>, on* handlers.
class DCLogic {
  constructor(props) { this.props = props; this.state = {}; }
  setState(patch) {
    Object.assign(this.state, typeof patch === 'function' ? patch(this.state, this.props) : patch);
    scheduleRender();
  }
}
const HOLE = /\{\{\s*([\w.$]+)\s*\}\}/g;
const BOOL_ATTRS = ['disabled', 'hidden', 'checked', 'required', 'open', 'selected'];
function lookup(path, vals, scope) {
  const [head, ...rest] = path.split('.');
  let v = Object.hasOwn(scope, head) ? scope[head] : vals[head];
  for (const k of rest) v = v == null ? undefined : v[k];
  return v;
}
const interp = (s, vals, scope) => s.replace(HOLE, (_, p) => { const v = lookup(p, vals, scope); return v == null ? '' : String(v); });
const exact = (s, vals, scope) => { const m = /^\s*\{\{\s*([\w.$]+)\s*\}\}\s*$/.exec(s || ''); return m ? lookup(m[1], vals, scope) : undefined; };
function build(nodes, parent, vals, scope) {
  for (const node of nodes) {
    if (node.nodeType === 3) { parent.appendChild(document.createTextNode(interp(node.data, vals, scope))); continue; }
    if (node.nodeType !== 1) continue;
    if (node.localName === 'sc-if') { if (exact(node.getAttribute('value'), vals, scope)) build(node.childNodes, parent, vals, scope); continue; }
    if (node.localName === 'sc-for') {
      const as = node.getAttribute('as');
      for (const item of exact(node.getAttribute('list'), vals, scope) || []) build(node.childNodes, parent, vals, { ...scope, [as]: item });
      continue;
    }
    const el = node.cloneNode(false);
    for (const { name, value } of [...node.attributes]) {
      if (name.startsWith('on')) {
        el.removeAttribute(name);
        const fn = exact(value, vals, scope), type = name.slice(2);
        if (typeof fn !== 'function') continue;
        if (type === 'change') {
          // Re-rendering mid-composition would break Hangul input, so wait for compositionend.
          el.addEventListener('input', e => { if (!e.isComposing) fn(e); });
          el.addEventListener('compositionend', fn);
        } else el.addEventListener(type, fn);
        continue;
      }
      // Boolean attributes (disabled, hidden, …) are present or absent, never "empty".
      if (BOOL_ATTRS.includes(name) && value.includes('{{')) {
        const on = exact(value, vals, scope);
        if (on == null || on === false || on === '') el.removeAttribute(name); else el.setAttribute(name, '');
        continue;
      }
      if (value.includes('{{')) {
        const v = interp(value, vals, scope);
        el.setAttribute(name, v);
        if (name === 'value') el.value = v;
      }
    }
    build(node.childNodes, el, vals, scope);
    parent.appendChild(el);
  }
}

    const flowOf = (p) => (p.isTeam ? cyclePath(p) : ['plan', 'dev', 'qa']).map((k, i) => ({ l: TEAM_NAME[k].replace('팀', ''), sep: i > 0,

    const isDone = (p) => p.goal.status === 'verified';

    const ibd = Object.assign({ approvals: [], reviews: [], memoryProposals: [], skillCandidates: [], skillsHeld: 0, grants: [], decided: [], trust: { required: 3, teams: [] }, scopes: {}, webMode: 'ask', permissionMode: 'auto' }, s.inbox || {});

const root = document.getElementById('app');
// ── 페이지 안 대화상자 (브라우저 확인·입력 창 대신) ──
// First line of the message is the title when it ends with "?" or is short; the rest is the body.
function openDialog({ message = '', title = '', input = false, value = '', okL = '확인', cancelL = '취소', danger = false }) {
  return new Promise((resolve) => {
    const prev = document.activeElement;
    let head = title, body = String(message);
    if (!head) {
      const lines = body.split('\n');
      if (lines.length > 1 || body.length <= 60) { head = lines[0]; body = lines.slice(1).join('\n').replace(/^\n+/, ''); }
      else { const m = /^(.{8,90}?[?？.])\s+([\s\S]+)$/.exec(body); if (m) { head = m[1]; body = m[2]; } } // first sentence as the title
    }
    const scrim = document.createElement('div'); scrim.className = 'dlg-scrim';
    const box = document.createElement('div'); box.className = 'dlg'; box.setAttribute('role', input ? 'dialog' : 'alertdialog'); box.setAttribute('aria-modal', 'true');
    const b = document.createElement('div'); b.className = 'dlg-b';
    const h = document.createElement('h2'); h.className = 'dlg-t'; h.id = 'dlg-t-' + Date.now(); h.textContent = head || '확인';
    box.setAttribute('aria-labelledby', h.id); b.appendChild(h);
    if (body) { const p = document.createElement('p'); p.className = 'dlg-m'; p.textContent = body; b.appendChild(p); }
    let field = null;
    if (input) { field = document.createElement('textarea'); field.className = 'dlg-in'; field.value = value || ''; field.setAttribute('aria-label', head || '입력'); b.appendChild(field); }
    const foot = document.createElement('div'); foot.className = 'dlg-f';
    if (input) { const hint = document.createElement('span'); hint.className = 'hint'; hint.textContent = 'Enter로 확인 · Shift+Enter 줄바꿈'; foot.appendChild(hint); }
    const done = (v) => { document.removeEventListener('keydown', onKey, true); scrim.remove(); if (prev && prev.focus && document.contains(prev)) prev.focus({ preventScroll: true }); resolve(v); };
    const ok = document.createElement('button'); ok.className = 'btn sm ' + (danger ? 'danger' : 'pri'); ok.textContent = okL;
    ok.onclick = () => done(input ? field.value : true);
    if (cancelL) { const no = document.createElement('button'); no.className = 'btn sm'; no.textContent = cancelL; no.onclick = () => done(input ? null : false); foot.appendChild(no); }
    foot.appendChild(ok);
    box.append(b, foot); scrim.appendChild(box);
    scrim.addEventListener('mousedown', (e) => { if (e.target === scrim && cancelL) done(input ? null : false); });
    const onKey = (e) => {
      if (e.key === 'Escape' && cancelL) { e.preventDefault(); done(input ? null : false); }
      // Enter confirms (Shift+Enter breaks the line in a text box); Enter on a focused 취소 stays 취소.
      else if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229
        && !(document.activeElement && document.activeElement.tagName === 'BUTTON' && document.activeElement !== ok)) { e.preventDefault(); ok.click(); }
      else if (e.key === 'Tab') { const f = [...box.querySelectorAll('button,textarea')]; const i = f.indexOf(document.activeElement);
        e.preventDefault(); f[(i + (e.shiftKey ? -1 : 1) + f.length) % f.length].focus(); }
    };
    document.addEventListener('keydown', onKey, true);
    document.body.appendChild(scrim);
    (field || ok).focus();
  });
}
const ask = (message, opts = {}) => openDialog({ message, ...opts }).then((v) => v === true);
const askText = (message, value = '', opts = {}) => openDialog({ message, input: true, value, ...opts });
const tell = (message, opts = {}) => openDialog({ message, cancelL: null, ...opts }).then(() => undefined);
const tpl = document.getElementById('tpl').content;
const comp = new Component({});
let queued = false;
// Every render replaces the whole page. If that happens while 대장 is typing — above all in the middle of a
// Hangul syllable (IME composition) — the box is swapped out and the syllable breaks or vanishes. Background
// updates (a running project refreshes every few seconds) therefore wait until typing pauses.
let composing = false, lastTyping = 0;
document.addEventListener('compositionstart', () => { composing = true; }, true);
document.addEventListener('compositionend', () => { composing = false; lastTyping = Date.now(); }, true);

document.addEventListener('keydown', () => { lastTyping = Date.now(); }, true);
// 대장 (2026-10-01): in a message box Enter sends and Shift+Enter breaks the line. The send button is the primary
// button in the row right after the box. The new project form keeps Enter as a line break (long goal and criteria).
// A Hangul syllable still being composed is committed by its own Enter first (isComposing), so it is never lost.
document.addEventListener('keydown', (e) => {
  const t = e.target;
  if (e.key !== 'Enter' || e.shiftKey || e.isComposing || e.keyCode === 229 || !t || t.tagName !== 'TEXTAREA' || !root.contains(t) || /^np-/.test(t.id)) return;
  let row = t.nextElementSibling;
  while (row && !row.classList.contains('row-f')) row = row.nextElementSibling;
  const send = row && row.querySelector('.btn.pri');
  if (!send) return;
  e.preventDefault();
  if (!t.value.trim() || send.disabled) return;

function typingNow() {
  const a = document.activeElement;

// 맨 위로: outside #app, so re-renders leave it alone.
(() => {
  const b = document.getElementById('to-top');
  if (!b) return;
  const sync = () => { const on = window.scrollY > 600; b.classList.toggle('show', on); b.tabIndex = on ? 0 : -1; b.setAttribute('aria-hidden', on ? 'false' : 'true'); };
  window.addEventListener('scroll', sync, { passive: true });
  sync();
  let frame = null, previousBehavior = '';
  const stop = () => {
    if (frame === null) return;
    cancelAnimationFrame(frame);
    frame = null;
    document.documentElement.style.scrollBehavior = previousBehavior;
  };
  // User scrolling takes over immediately; do not keep pulling them toward the top.

  window.addEventListener('keydown', event => {
