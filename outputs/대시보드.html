<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AGENT HQ</title>
<meta name="description" content="AI 팀이 프로젝트를 기획·개발·검증하며 진행하는 로컬 작업 공간">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111'/%3E%3Cpath d='M9 22V10h3v4.8h8V10h3v12h-3v-4.6h-8V22z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#FAFAFA;--surface:#FFFFFF;--subtle:#F4F4F5;--line:#E7E7EA;--line-strong:#D4D4D8;
  --text:#0A0A0B;--text-2:#52525B;--text-3:#71717A;--text-4:#A1A1AA;
  --accent:#2E5BFF;--accent-soft:#EEF2FF;--accent-ink:#1E3FCC;
  --run:#2E5BFF;--done:#15803D;--done-soft:#EDFAF1;--attn:#B45309;--attn-soft:#FFF7E8;--stop:#C2410C;--stop-soft:#FFF1EB;--idle:#A1A1AA;
  --r-sm:6px;--r:10px;--r-lg:14px;
  --shadow:0 1px 2px rgba(17,17,26,.04),0 4px 16px rgba(17,17,26,.04);
  --font:"Geist","Pretendard Variable",Pretendard,-apple-system,"Malgun Gothic",sans-serif;
  --mono:"Geist Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.skip{position:absolute;left:-999px;top:8px;background:var(--text);color:#fff;padding:8px 12px;border-radius:var(--r-sm);z-index:100}
.skip:focus{left:8px}

/* 상단 바 */
.top{position:sticky;top:0;z-index:20;background:rgba(250,250,250,.86);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1840px;margin:0 auto;padding:12px 32px;min-height:72px;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:-.01em;font-size:14.5px;flex:none;border:0;background:none;padding:0}
.mark{width:24px;height:24px;border-radius:7px;background:var(--text);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700;font-family:var(--mono)}
.tabs-top{display:flex;align-items:center;justify-content:center;gap:10px;min-width:0;overflow:visible}
.top-more{position:relative;flex:none}
.top-more-label{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:var(--r-sm);color:var(--text-3);font-weight:500;white-space:nowrap;cursor:default}
.top-more:hover .top-more-label,.top-more:focus-within .top-more-label{color:var(--text);background:var(--subtle)}
.top-more-menu{position:absolute;left:100%;top:0;min-width:160px;padding:6px;border:1px solid var(--line);border-radius:10px;background:var(--surface);box-shadow:0 12px 32px rgba(0,0,0,.14);display:grid;gap:2px;z-index:30;opacity:0;visibility:hidden;pointer-events:none;transform:translateX(-6px);transition:opacity .18s ease,transform .18s ease,visibility .18s}
.top-more:hover .top-more-menu,.top-more:focus-within .top-more-menu{opacity:1;visibility:visible;pointer-events:auto;transform:translateX(0)}
.top-more-menu button{border:0;background:none;text-align:left;padding:9px 10px;border-radius:6px;color:var(--text-2)}
.top-more-menu button:hover,.top-more-menu button.on{background:var(--subtle);color:var(--text)}
.tt{border:0;background:none;padding:6px 10px;border-radius:var(--r-sm);color:var(--text-3);font-weight:500;white-space:nowrap;transition:color .15s,background .15s}
.tt:hover{color:var(--text);background:var(--subtle)}
.tt.on{color:var(--text);background:var(--subtle)}
.tt .n{margin-left:6px;font-family:var(--mono);font-size:11.5px;color:var(--attn);font-weight:600}
.top-r{justify-self:end;display:flex;align-items:center;gap:10px;min-width:0;white-space:nowrap}
.top-r>*,.top-r .btn{flex-shrink:0;white-space:nowrap}
.notification-status{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border-radius:999px;background:var(--subtle);font-size:12px;color:var(--text-3);white-space:nowrap}
.notification-status::before{content:'';width:6px;height:6px;border-radius:50%;background:#32936f;flex-shrink:0}
.att-list{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.att{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:var(--surface);max-width:100%}
.att img{width:36px;height:36px;object-fit:cover;border-radius:4px}
.att-img{border:0;padding:0;background:none;display:block}.att-img img{max-width:240px;max-height:180px;border-radius:8px;border:1px solid var(--line);display:block}
.meter{display:flex;gap:8px;border:1px solid var(--line);background:none;border-radius:999px;padding:4px 10px;font-size:12px;color:var(--text-3);white-space:nowrap}
.meter:hover{background:var(--subtle)}.meter b{color:var(--text);font-weight:600}.meter .mi.old b{color:var(--text-3)}.meter .mi.warn b{color:#b54708}.meter .mi.stop b{color:#b42318}
.meter .mi{display:inline-flex;align-items:center;gap:4px}
.meter .provider-label{font-weight:600}
.meter .mi.claude .provider-label{color:#a94f34}
.meter .mi.claude .provider-label::before{content:'';display:inline-block;width:6px;height:6px;margin-right:4px;border-radius:50%;background:#d97757}
.meter .mi.codex .provider-label{color:#171717}
.meter .mi.codex .provider-label::before{content:'';display:inline-block;width:6px;height:6px;margin-right:4px;border-radius:50%;background:#171717}
@media(max-width:480px){.meter{display:none}}
.brand{justify-self:start}
.brand-group{display:flex;align-items:center;gap:12px;justify-self:start;white-space:nowrap}
.brand-group .mode{font-size:12px;padding:6px 9px;gap:6px;line-height:normal}
.brand-group .mode i{width:6px;height:6px}
@media(max-width:1100px){.top-in{grid-template-columns:auto minmax(0,1fr);gap:12px 24px}.top-r{grid-column:2;grid-row:1}.tabs-top{grid-column:1 / -1;grid-row:2;justify-content:center;max-width:100%;padding-top:8px;border-top:1px solid var(--line)}}
@media(max-width:760px){.top-in{padding:12px 16px!important;gap:12px}.top-r{flex-wrap:wrap;justify-content:flex-end}.tabs-top{justify-content:flex-start;flex-wrap:wrap;gap:4px}.notification-status,.brand-group .mode{font-size:11px;padding:4px 6px}}
@media(max-width:760px){.top-more-menu{left:auto;right:0;top:100%;transform:translateY(-6px)}.top-more:hover .top-more-menu,.top-more:focus-within .top-more-menu{transform:translateY(0)}}
.mode{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;color:var(--text-2);padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);white-space:nowrap}
.mode i{width:7px;height:7px;border-radius:50%;background:var(--idle)}
.mode.real{color:var(--stop);border-color:#F5C9B5;background:var(--stop-soft)}
.mode.real i{background:var(--stop);box-shadow:0 0 0 3px rgba(194,65,12,.15)}
.mode.off{color:var(--text-3)}

/* 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:36px;padding:8px 14px 6px;border-radius:9px;border:1px solid var(--line-strong);background:var(--surface);color:var(--text-2);font-weight:500;font-size:13px;line-height:1.3;white-space:nowrap;transition:background .15s,border-color .15s,transform .08s,box-shadow .15s}
.btn:hover{background:var(--subtle);border-color:var(--text-3);color:var(--text)}
.btn:focus-visible,.link:focus-visible,.seg button:focus-visible,.tt:focus-visible,.pt:focus-visible,summary:focus-visible{outline:2px solid var(--text);outline-offset:3px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--text);border-color:var(--text);color:#fff}
.btn.pri:hover{background:#27272A;color:#fff}
.btn.danger{color:var(--stop);border-color:#F2C6B4}
.btn.danger:hover{background:var(--stop-soft)}
.btn.ghost{border-color:var(--line);background:var(--surface);color:var(--text-2)}
.btn.ghost:hover{background:var(--subtle);color:var(--text)}
.btn.sm{min-height:32px;padding:7px 11px 5px;font-size:12px}
/* Hangul sits about 1px high on the Latin font's baseline (Geist first in the stack): the padding is 1px lower on top to center it. */
.link{border:1px solid var(--line);border-radius:7px;background:var(--surface);padding:4px 8px;color:var(--accent-ink);font-weight:500;line-height:1.4}
.link:hover{background:var(--subtle);border-color:var(--line-strong)}
.link.create{background:#18181B;border-color:#18181B;color:#fff}
.link.create:hover{background:#303036;border-color:#303036;color:#fff}

/* 레이아웃 */
main{max-width:1520px;margin:0 auto;padding:36px 32px 96px}
.home-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:32px;align-items:start}
.home-primary{min-width:0}
.home-side{position:sticky;top:108px;min-width:0}
.home-side-title{display:block;font-size:15px;font-weight:600;color:var(--text);letter-spacing:-.01em;line-height:1.55;margin:0 0 12px}
.home-side-toggle{display:inline-flex;align-items:center;gap:8px;padding:7px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text-2);font-size:12.5px;font-weight:500;line-height:1.4}
.home-side-toggle::before{content:"";width:0;height:0;border-left:4px solid currentColor;border-top:4px solid transparent;border-bottom:4px solid transparent;transition:transform .15s}
.home-side-toggle[aria-expanded="true"]::before{transform:rotate(90deg)}
.home-side-toggle:hover,.home-side-toggle[aria-expanded="true"]{background:var(--subtle);border-color:var(--line-strong);color:var(--text)}
.home-side-content{padding:16px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--shadow)}
.side-block{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.home-side-content>.side-block:first-child{margin-top:0;border-top:0;padding-top:0}
.home-side-content>.side-block:nth-child(2){border-top:0;padding-top:0}
.side-block h2{font-size:13px;margin-bottom:10px}
.side-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.side-stat{border:1px solid var(--line);border-radius:8px;padding:9px 10px}
.side-stat span{display:block;font-size:11px;color:var(--text-3)}
.side-stat b{display:block;font-size:18px;margin-top:2px}
.side-meter{display:grid;gap:7px}
.side-meter .mi{display:flex;justify-content:space-between;gap:8px;font-size:12px}
.side-meter .provider-label{font-weight:700}
.side-meter .mi.claude .provider-label,.side-meter .mi.claude b{color:#A94F34}
.side-meter .mi.codex .provider-label,.side-meter .mi.codex b{color:#171717}
.side-meter .mi b{white-space:nowrap}
.side-meter .mi.old b{opacity:.7}
.side-meter .mi.stop b::after{content:'중단';display:inline-block;margin-left:6px;padding:1px 4px;border-radius:4px;background:var(--stop-soft);color:var(--stop);font-size:10px;line-height:1.4}
.side-list{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.side-list li{font-size:12px;line-height:1.45;color:var(--text-2)}
.side-list .muted{display:block}
.side-manage{display:grid;gap:10px;margin-top:10px}
.side-manage .row-f{flex-wrap:wrap}
.side-manage .input{max-width:130px}
.side-manage .field{margin:10px 0}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:28px}
h1{margin:0;font-size:26px;line-height:1.25;letter-spacing:-.025em;font-weight:600;text-wrap:balance}
.lede{margin:6px 0 0;color:var(--text-3);max-width:62ch;text-wrap:pretty}
h2{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em}
.sec{margin-top:40px}
.sec:first-of-type{margin-top:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.sec-h .meta{font-size:12.5px;color:var(--text-3)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.muted{color:var(--text-3)}
.small{font-size:12.5px}
.hint{font-size:12.5px;color:var(--text-3);line-height:1.6}

/* 통계 */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.stat{padding:16px 20px;border-left:1px solid var(--line)}
.stat:first-child{border-left:0}
.stat .k{font-size:12.5px;color:var(--text-3)}
.stat .v{font-size:24px;font-weight:600;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.stat .v small{font-size:13px;color:var(--text-4);font-weight:500;margin-left:3px}
.stat.attn .v{color:var(--attn)}

/* 상태 표시 */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--text-2);white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--idle);flex:none}
.pill.run i{background:var(--run);box-shadow:0 0 0 3px rgba(46,91,255,.14);animation:pulse 1.8s ease-in-out infinite}
.pill.run{color:var(--accent-ink)}
.pill.wait i{background:var(--attn)}
.pill.attn{color:var(--attn)} .pill.attn i{background:var(--attn)}
.pill.stop{color:var(--stop)} .pill.stop i{background:var(--stop)}
.pill.done{color:var(--done)} .pill.done i{background:var(--done)}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(46,91,255,.06)}}
@media (prefers-reduced-motion:reduce){.pill.run i{animation:none}*{transition:none!important}}

/* 팀 흐름 */
.flow{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-4)}
.flow .s{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.flow .s b{width:6px;height:6px;border-radius:2px;background:color-mix(in srgb,var(--team-accent,#A1A1AA) 40%,#fff)}
.flow .s.on{color:var(--team-accent,var(--text));font-weight:600}
.flow .s.on b{background:var(--team-accent,var(--accent))}
.flow .sep{width:10px;height:1px;background:var(--line-strong)}
.flow-lg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.fstep{padding:14px 18px;border-left:1px solid var(--line);position:relative}
.fstep:first-child{border-left:0}
.fstep .t{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:600;font-size:13.5px}
.fstep .d{font-size:12.5px;color:var(--text-3);margin-top:3px}
.fstep.on{background:linear-gradient(180deg,var(--accent-soft),var(--surface) 70%)}
.fstep.on::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--accent)}
.fstep .tool{font-family:var(--mono);font-size:11.5px;color:var(--text-3);font-weight:400}

/* 목록 행 */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 200px 150px 88px 76px;gap:20px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:14px 20px;transition:background .12s}
.prow:first-child{border-top:0}
.prow:hover{background:#FCFCFD}
.prow .name{font-weight:600;font-size:14px;letter-spacing:-.005em;display:flex;align-items:center;gap:8px}
.prow .sub{display:block;font-size:13px;color:var(--text-3);margin-top:6px;white-space:normal;line-height:1.6}
.prow{grid-template-columns:minmax(0,1fr) auto auto auto!important;gap:24px!important;padding:20px!important}
.prow>.flow{display:none}
.prow .c{font-size:12.5px;color:var(--text-2);font-variant-numeric:tabular-nums}
.prow .c small{color:var(--text-4)}
.prow .when{font-size:12px;color:var(--text-4);text-align:right}
.kind{font-size:11px;font-weight:500;color:var(--text-3);border:1px solid var(--line);border-radius:4px;padding:0 5px;line-height:18px}

/* 확인함 */
.inbox{display:flex;flex-direction:column}
.item{padding:16px 20px;border-top:1px solid var(--line);display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px}
.item:first-child{border-top:0}
.ico{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--attn-soft);color:var(--attn)}
.ico.stop{background:var(--stop-soft);color:var(--stop)}
.ico.done{background:var(--done-soft);color:var(--done)}
.ico svg{width:15px;height:15px}
.item .t{font-weight:600;font-size:14px}
.item .t .proj{color:var(--text-3);font-weight:500}
.item .b{color:var(--text-2);margin-top:3px;max-width:72ch}
.item .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:flex-start}
.q{margin-top:8px;padding:10px 12px;border-radius:var(--r);background:var(--subtle);color:var(--text);max-width:72ch}
.ta{width:100%;min-height:68px;resize:vertical;border:1px solid var(--line-strong);border-radius:var(--r);padding:9px 11px;background:var(--surface);line-height:1.55;transition:border-color .15s,box-shadow .15s}
.ta:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(46,91,255,.12)}
.input{width:100%;height:36px;border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:0 11px;background:var(--surface);transition:border-color .15s,box-shadow .15s}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(46,91,255,.12)}
.ul{margin:8px 0 0;padding-left:18px;color:var(--text-2)}
.ul li{margin:2px 0}

/* 빈 화면 */
.empty{padding:48px 24px;text-align:center;color:var(--text-3)}
.empty .h{color:var(--text);font-weight:600;font-size:15px}
.empty p{margin:6px auto 16px;max-width:46ch}
.empty.sm{padding:22px 20px}
.offline{padding:12px 16px;border:1px solid #F2C6B4;background:var(--stop-soft);color:var(--stop);border-radius:var(--r);margin-bottom:20px;font-weight:500}

/* 팀 */
.teams{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding:14px}
.teams .team{border:1px solid var(--line)!important;border-radius:var(--r);background:var(--surface)}
.project-teams{margin:20px 0;overflow:hidden}
.project-team{display:grid;grid-template-columns:100px 90px minmax(0,1fr) minmax(160px,240px);gap:16px;align-items:start;padding:15px 20px;border-top:1px solid var(--line)}
.project-team:first-child{border-top:0}
.project-team details{grid-column:3 / -1;font-size:12px;color:var(--text-3)}
@media(max-width:760px){.prow{grid-template-columns:minmax(0,1fr) auto!important;gap:12px!important}.prow .when,.prow .c{display:none}.project-team{grid-template-columns:1fr auto}.project-team details{grid-column:1 / -1}main{padding-left:16px;padding-right:16px}}
.team{padding:18px 20px;border-left:1px solid var(--line)}
.team:nth-child(3n+1){border-left:0}
.team:nth-child(n+4){border-top:1px solid var(--line)}
.team .h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.team .nm{font-weight:600}
.team .role{font-size:12.5px;color:var(--text-3);margin-top:4px;min-height:40px}
.team dl{display:grid;grid-template-columns:64px minmax(0,1fr);gap:4px 10px;margin:12px 0 0;font-size:12.5px}
.team dt{color:var(--text-4)}
.team dd{margin:0;color:var(--text-2)}

/* 프로젝트 상세 */
.crumb{font-size:12.5px;color:var(--text-3);display:flex;gap:6px;align-items:center;margin-bottom:10px}
.ws-h{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap}
.ws-h .goal{margin:8px 0 0;color:var(--text-2);max-width:70ch}
.ws-h .acts{display:flex;gap:8px;flex:none}
.ptabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:28px 0 24px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.ptabs::-webkit-scrollbar{display:none}
.pt{border:0;background:none;padding:8px 4px;margin-right:14px;color:var(--text-3);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:color .15s}
.pt:hover{color:var(--text)}
.pt.on{color:var(--text);border-bottom-color:var(--text)}
.pt .n{font-family:var(--mono);font-size:11.5px;color:var(--text-4);margin-left:5px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:24px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:18px 20px}
.card.attn{border-color:#F3D9A8;background:linear-gradient(180deg,var(--attn-soft),var(--surface) 60%)}
.card.done{border-color:#BFE6CB;background:linear-gradient(180deg,var(--done-soft),var(--surface) 60%)}
.card.stop{border-color:#F2C6B4;background:linear-gradient(180deg,var(--stop-soft),var(--surface) 60%)}
.card .lbl{font-size:12px;font-weight:500;color:var(--text-3);margin-bottom:6px}
.card .big{font-size:15px;font-weight:500;line-height:1.6}
.answer{white-space:pre-wrap;color:var(--text-2);line-height:1.7;max-height:320px;overflow:auto}
.facts{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px 12px;margin:0;font-size:13px}
.facts dt{color:var(--text-3)}
.facts dd{margin:0;color:var(--text);min-width:0}
.bar{height:4px;border-radius:2px;background:var(--subtle);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--text)}
.crit{display:flex;flex-direction:column}
.cr{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:10px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
.cr:first-child{border-top:0;padding-top:2px}
.ck{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--line-strong);margin-top:2px;display:grid;place-items:center}
.ck.ok{background:var(--done);border-color:var(--done)}
.ck.no{border-color:var(--stop)}
.ck.was{border-color:var(--done);border-style:dashed}
.ck svg{width:10px;height:10px}
.cr .t{font-weight:500}
.cr .e{font-size:12.5px;color:var(--text-3);margin-top:2px}
.cr .e.ok{color:var(--done)}

/* 활동 */
.tl{display:flex;flex-direction:column}
.ev{display:grid;grid-template-columns:84px minmax(0,1fr);gap:16px;padding:16px 20px;border-top:1px solid var(--line)}
.ev:first-child{border-top:0}
.ev .when{font-size:12px;color:var(--text-4);padding-top:2px}
.ev .who{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:600}
.ev .who .tool{font-family:var(--mono);font-size:11.5px;color:var(--text-3);font-weight:400}
.ev .res{margin-top:3px;color:var(--text-2)}
details{margin-top:8px}
summary{cursor:pointer;color:var(--text-2);font-weight:500;font-size:12.5px;list-style:none;display:inline-flex;align-items:center;gap:8px;padding:7px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);line-height:1.4}
summary:hover{background:var(--subtle);border-color:var(--line-strong);color:var(--text)}
summary::-webkit-details-marker{display:none}
summary::before{content:"";width:0;height:0;border-left:4px solid currentColor;border-top:4px solid transparent;border-bottom:4px solid transparent;transition:transform .15s}
details[open]>summary::before{transform:rotate(90deg)}
.progs{display:grid;gap:0;margin-top:6px;border-top:1px solid var(--line)}
.prog{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.prog .kind{margin-left:6px}
.tchecks{display:grid;gap:6px;margin-top:8px}
.tcheck{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:baseline}
.tcheck details{grid-column:2}
.tcheck.inspection{grid-template-columns:20px minmax(0,1fr);align-items:start;gap:6px 8px;padding:10px 0}
.tcheck.inspection:has(>.pill:not(.done)){grid-template-columns:64px minmax(0,1fr)}
.tcheck.inspection+.tcheck.inspection{border-top:1px solid var(--line)}
.inspection>.pill{justify-self:start;margin-top:1px}
.inspection>.pill.done{min-width:20px;padding:0;background:transparent;color:var(--done);font-size:0}
.inspection>.pill.done i{display:none}
.inspection>.pill.done::before{content:'✓';font-size:16px;font-weight:600;line-height:1.4}
.inspection>.pill.skipped{padding:0;background:transparent;color:var(--attn);gap:5px;white-space:nowrap}
.inspection>.pill.skipped i{display:none}
.inspection>.pill.skipped::before{content:'↷';font-size:16px;font-weight:600;line-height:1.4}
.inspection-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:2px;font-size:12px;font-weight:600;color:var(--text-2)}
.inspection-head .inspection-all-pass{color:var(--done);font-weight:500}
.inspection-copy{min-width:0;display:grid;gap:3px;font-size:13px;line-height:1.5;overflow-wrap:anywhere}
.inspection-copy b{font-weight:600;color:var(--text)}
.inspection-copy>span{color:var(--text-3);font-size:12.5px}
.tcheck.inspection details{margin-top:8px;margin-bottom:4px}
@media (max-width:560px){.prog{grid-template-columns:minmax(0,1fr)}}
details .answer{margin-top:8px;padding:12px 14px;background:var(--subtle);border-radius:var(--r);font-size:13px}
.log{font-family:var(--mono);font-size:12px;color:var(--text-2);padding:14px 20px;line-height:1.9;max-height:360px;overflow:auto}
.log .ts{color:var(--text-4);margin-right:12px}

/* 표 형태 목록 (table 안에는 반복 태그를 넣을 수 없어 grid로 만든다) */
.urow{display:grid;grid-template-columns:minmax(0,1fr) 110px 150px 180px;gap:16px;align-items:center;padding:12px 20px;border-top:1px solid var(--line);font-size:13px;font-variant-numeric:tabular-nums}
.urow.head{border-top:0;font-size:12px;font-weight:500;color:var(--text-3);background:#FCFCFD;padding:10px 20px}
.urow.head + .urow{border-top:1px solid var(--line)}
@media (max-width:900px){.urow{grid-template-columns:minmax(0,1fr) auto}.urow.head{display:none}}

/* 연결 */
.erow{display:grid;grid-template-columns:minmax(0,1.4fr) 170px minmax(0,1fr) 150px;gap:18px;align-items:center;padding:16px 20px;border-top:1px solid var(--line)}
.erow:first-child{border-top:0}
.erow .nm{font-weight:600}
.erow .sub{font-size:12.5px;color:var(--text-3);margin-top:2px}
.erow .bill{font-size:12.5px;color:var(--text-2)}
.erow .act{display:flex;justify-content:flex-end;gap:8px;align-items:center}
.switch{position:relative;width:38px;height:22px;border-radius:999px;border:0;background:var(--line-strong);padding:0;transition:background .15s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .15s}
.switch.on{background:var(--done)}
.switch.on::after{transform:translateX(16px)}
.switch:disabled{opacity:.4;cursor:not-allowed}
.group-h{font-size:12px;font-weight:600;color:var(--text-3);margin:28px 0 10px;letter-spacing:.01em}
@media (max-width:900px){.erow{grid-template-columns:minmax(0,1fr) auto}.erow .bill{grid-column:1 / -1}}

/* 설정 */
.seg{display:inline-flex;gap:4px;padding:4px;border-radius:10px;background:var(--subtle);border:1px solid var(--line)}
.seg button{border:0;background:none;height:28px;padding:1px 12px 0;border-radius:6px;color:var(--text-3);font-weight:500;font-size:13px;transition:background .15s,color .15s}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.row-f{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.side .cap-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.side .cap-actions .btn:last-child{grid-column:1 / -1}
.seg.wrap{display:flex;flex-wrap:wrap;gap:4px}
/* 승인함·기억 */
.ib-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.ib-row:last-of-type{border-bottom:0}
.ib-row.col{grid-template-columns:minmax(0,1fr);gap:8px}
.ib-acts{justify-content:flex-end}
@media (max-width:760px){.ib-row{grid-template-columns:minmax(0,1fr)}.ib-acts{justify-content:flex-start}}
/* 프로젝트 대화 스레드 */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ws-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start;margin-top:4px}
.ws-grid .side{position:sticky;top:72px}
@media (max-width:960px){.ws-grid{grid-template-columns:minmax(0,1fr)}.ws-grid .side{position:static}}
.thread-wrap{background:var(--surface);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-height:420px}
.thread{display:flex;flex-direction:column;gap:12px;padding:20px;flex:1}
.msg{max-width:88%;border-radius:12px;padding:10px 14px;background:var(--subtle);border:1px solid transparent}
.msg .meta{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:4px}
.msg .meta .when{margin-left:auto}
.msg .body{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55}
.msg .tchecks{margin-top:8px}
.msg details{margin-top:14px}
.msg .tcheck.inspection details{margin-top:8px;margin-bottom:4px}
.msg details>summary,.tcheck.inspection details>summary{min-height:36px;padding:8px 14px;gap:9px}
.msg details[open]>summary,.tcheck.inspection details[open]>summary{margin-bottom:10px}
.msg.me{align-self:flex-end;background:#EEF2FF;border-color:#DCE3FF}
.msg.me .meta b{color:#2E5BFF}
.msg.team{align-self:flex-start;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.035)}
.msg.team .meta{align-items:center;gap:6px 8px;margin-bottom:8px}
.msg.team .meta b,.msg.action[class*="team-"] .meta b{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border-radius:6px;background:var(--team-tint,var(--subtle));color:var(--team-accent,var(--text));font-size:12px;font-weight:600;white-space:nowrap}
.msg.team .meta b::before,.msg.action[class*="team-"] .meta b::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--team-accent,var(--text));flex:none}
.msg.team .meta .when{color:var(--text-4)}
/* 팀 답변은 고유색을 옅게 입힌 말풍선으로 구분합니다. */
.msg.team{display:grid;grid-template-columns:30px minmax(0,1fr);column-gap:12px;border:1px solid color-mix(in srgb,var(--team-accent,#71717A) 12%,var(--surface));border-radius:16px;background:var(--team-tint,var(--subtle));box-shadow:none;padding:18px 20px;color:var(--text)}
.mono-tile{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;line-height:1;
  color:var(--team-accent,var(--text-2));background:color-mix(in srgb,var(--team-accent,#71717A) 10%,var(--surface));border:0}
.mono-tile.lg{width:38px;height:38px;border-radius:50%;font-size:14px}
.msg.team>.mono-tile{grid-row:1 / span 20}
/* 팀 화면도 동일한 원형 마크와 중립적인 카드로 표시합니다. */
.card.team-card{border:1px solid var(--line);transition:border-color .18s,box-shadow .18s}
.card.team-card:hover{border-color:var(--line-strong);box-shadow:0 4px 14px rgba(17,17,26,.04)}
.team-card .team-title{display:flex;align-items:center;gap:12px;min-width:0}
.team-card .team-title h2{color:var(--text)}
.team .nm{display:inline-flex;align-items:center;gap:10px;color:var(--text)}
.team .nm .mono-tile{width:28px;height:28px;border-radius:50%;font-size:11px}
.msg.team>:not(.mono-tile){grid-column:2}
.msg.team .meta b,.msg.team .meta b::before{background:none;padding:0}
.msg.team .meta b{font-size:14px;font-weight:700;color:var(--team-accent,var(--text))}
.msg.team .meta b::before{display:none}
.msg.team .meta .sub{order:3;flex-basis:100%;color:var(--text-3);font-size:12px;line-height:1.45;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg.team .meta .when{order:2}
.msg.team.cont{margin-top:0}
.msg.team.cont>.mono-tile{visibility:hidden;height:0}
.msg.action[class*="team-"]{border:1px solid var(--line-strong)}
.msg.action[class*="team-"] .meta b{border-radius:999px;padding:4px 9px;background:var(--team-tint,var(--subtle))}
.msg.action[class*="team-"] .meta b::before{display:none}
.msg.me.ctl{background:none;border:0;padding:0 2px;max-width:70%;color:var(--text-3);font-size:12px;display:flex;gap:6px;align-items:baseline;justify-content:flex-end}
.msg.me.ctl .meta{margin:0;gap:6px}
.msg.me.ctl .meta b{color:var(--text-3);font-weight:500}
.msg.me.ctl .meta .when{margin-left:0}
.msg.me.ctl .body{font-size:12px;color:var(--text-2)}
.msg.team .body{font-size:14px;font-weight:500;line-height:1.7;color:var(--text)}
.msg.team .body strong,.msg.team .body b{font-weight:700}
.msg.team .inspection-head{font-size:12.5px;font-weight:700;color:var(--text)}
.msg.team .inspection-copy b{font-size:13.5px;font-weight:700;color:var(--text)}
.msg.team .inspection-copy>span{font-size:13px;color:var(--text-2);line-height:1.6}
.msg.team details>summary{background:var(--surface);color:var(--text);border-color:var(--line-strong);font-weight:600}
.msg.team details>summary:hover{background:var(--subtle)}
.msg.team details .answer{background:var(--surface);color:var(--text);border:1px solid var(--line);line-height:1.75}
.msg.team .tchecks{padding-top:9px;margin-top:11px;border-top:1px solid var(--line)}
.msg.team.err{background:var(--stop-soft);border:0;border-radius:10px;padding:16px}
.team-plan{--team-accent:#5947A8;--team-tint:#F6F4FC}
.team-research{--team-accent:#0B746B;--team-tint:#F1FAF8}
.team-dev{--team-accent:#245EB5;--team-tint:#F2F7FF}
.team-design{--team-accent:#A33C80;--team-tint:#FFF3F9}
.team-security{--team-accent:#A73E3A;--team-tint:#FFF5F3}
.team-policy{--team-accent:#865A10;--team-tint:#FFF9EA}
.team-qa{--team-accent:#25764B;--team-tint:#F1FAF4}
.msg.sys{align-self:center;max-width:94%;background:none;border:1px dashed var(--line-strong);font-size:13px}
.msg.sys.stop{border-color:#F2B8A0;color:#9A3412;background:#FFF7F4}
.msg.action{align-self:stretch;max-width:none;background:var(--surface);border:1px solid var(--line-strong);box-shadow:0 1px 2px rgba(0,0,0,.04)}
.msg.action.attn{border-color:#F5C77E;background:#FFFBF0}
.msg.action.daily-cap{border-color:#D8D8D3;background:#F4F4F2;color:var(--text)}
.msg.action.done{border-color:#A7D8B8;background:#F3FBF6}
.msg.action.stop{border-color:#F2B8A0;background:#FFF7F4}
.msg.action .row-f{margin-top:10px}
.msg.action .ul{margin:8px 0 0}
.msg.working{display:flex;gap:10px;align-items:center;color:var(--text-3)}
.dots{display:inline-flex;gap:3px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--text-3);animation:hq-dot 1.2s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes hq-dot{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none}}
.composer{border-top:1px solid var(--line);padding:14px 20px;display:grid;gap:8px;background:var(--surface);border-radius:0 0 14px 14px}
.composer .ta{min-height:64px}
.composer-row{justify-content:space-between}
.next{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:10px}
.next li{padding-left:14px;border-left:2px solid var(--line)}
.next li.now{border-left-color:#2E5BFF}
.next li.done{border-left-color:#16A34A}
.sentinel-row{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:baseline;margin-top:6px}
.tm-list{display:grid;border-top:1px solid var(--line)}
.tm-row{display:grid;grid-template-columns:180px minmax(0,1fr);gap:12px;padding:14px 0;border-bottom:1px solid var(--line);align-items:start}
.tm-head{display:grid;gap:4px;align-content:start}
.tm-head .kind{justify-self:start}
.tm-picks{display:grid;gap:8px;justify-items:start}
.project-settings{width:100%;max-width:none}
@media(min-width:1100px){.tm-row{grid-template-columns:220px minmax(0,1fr);gap:24px;padding:20px 0}.tm-picks{width:100%;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:20px;align-items:start}.tm-picks .seg{width:100%}.tm-picks .seg button{flex:1;height:34px}}
@media (max-width:640px){.tm-row{grid-template-columns:minmax(0,1fr)}}
.danger-zone{border-color:#F2C6B4}
.danger-zone .lbl{color:var(--stop)}

/* 슬라이드 패널 */
.scrim{position:fixed;inset:0;background:rgba(10,10,11,.28);z-index:40;border:0;padding:0;width:100%;cursor:default;animation:fade .15s ease-out}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--surface);z-index:41;display:flex;flex-direction:column;box-shadow:-24px 0 60px rgba(10,10,11,.12);animation:slide .22s cubic-bezier(.2,.8,.2,1)}
.sheet-h{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.sheet-b{padding:22px 24px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:18px}
.sheet-f{padding:16px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;background:#FCFCFD}
.field label{display:block;font-weight:500;font-size:13px;margin-bottom:6px}
.field .opt{color:var(--text-4);font-weight:400}
.field .hint{margin-top:6px}
.digest-settings .field{margin-top:16px}
.digest-settings .field label{margin-bottom:8px}
.digest-settings>.btn{margin-top:16px}
.lane-row{padding:8px 0 8px 10px;border-left:3px solid var(--team-accent,var(--line-strong));margin-top:8px}
.lane-row b{color:var(--team-accent,var(--text))}
.live-list{list-style:none;margin:-4px 0 0;padding:8px 12px;align-self:center;max-width:94%;width:560px;border-left:2px solid var(--line-strong);display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--text-3)}
.live-list li{display:flex;gap:10px;min-width:0}
.live-list li>span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.live-list .when{font-variant-numeric:tabular-nums;color:var(--text-4);flex:none}
.live-list li.now{color:var(--text);font-weight:500}
.judge{display:flex;flex-direction:column;gap:6px;margin:10px 0 4px;max-width:72ch}
.judge-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.judge-row>span{flex:1;min-width:0;font-size:13px}
.proj-group{margin:18px 0 8px;font-size:13px;font-weight:600;color:var(--text-2)}
.proj-done{margin-top:0}
.proj-done>summary.proj-group{display:inline-flex;align-items:center;gap:8px;padding:0;border:0;border-radius:0;background:none;font-size:13px;font-weight:600;color:var(--text-2)}
.proj-done>summary.proj-group:hover{background:none;color:var(--text)}
.proj-done>summary.proj-group::before{display:none}
.proj-done>summary.proj-group::after{content:"";width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:translateY(-2px) rotate(45deg);transition:transform .15s}
.proj-done[open]>summary.proj-group::after{transform:translateY(1px) rotate(-135deg)}
.proj-done>summary.proj-group:focus-visible{outline:2px solid var(--text);outline-offset:3px}
.team-recent{margin-top:16px}
.team-recent[open]>summary{margin-bottom:10px}
.skill-description{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;margin:8px 0;color:var(--text-2);font-size:13px;line-height:1.55}
.skill-details{margin-top:14px}
.skill-details>summary{font-size:12px}
.skill-details[open]>summary{margin-bottom:12px}
.digest-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.digest-actions .btn{flex:1;min-width:150px;height:auto;min-height:64px;padding:12px;justify-content:flex-start;gap:10px;text-align:left;background:var(--surface);color:var(--text);border-color:var(--line);border-radius:12px;white-space:normal}
.digest-actions .btn:hover{background:var(--subtle);border-color:var(--line-strong);transform:translateY(-1px)}
.digest-actions .btn:focus-visible{outline:2px solid var(--text);outline-offset:3px}
.digest-actions .digest-icon{display:grid;place-items:center;flex-shrink:0;width:32px;height:32px;border-radius:9px;background:var(--subtle);color:var(--text-2);font-size:17px}
.digest-actions .digest-copy{display:flex;flex-direction:column;gap:3px}
.digest-actions .digest-copy b{font-size:13px;font-weight:600;line-height:1.3}
.digest-actions .digest-copy small{font-size:11px;color:var(--text-3);font-weight:400;line-height:1.3}
.note{padding:12px 14px;border-radius:var(--r);background:var(--subtle);font-size:12.5px;color:var(--text-2);line-height:1.65}
.note b{color:var(--text)}
@keyframes fade{from{opacity:0}}
@keyframes slide{from{transform:translateX(24px);opacity:0}}
.dlg-scrim{position:fixed;inset:0;background:rgba(10,10,11,.38);display:grid;place-items:center;z-index:80;padding:16px;animation:fade .12s}
.dlg{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.22);width:min(520px,100%);max-height:min(80vh,720px);display:flex;flex-direction:column}
.dlg-b{padding:20px 22px 8px;overflow:auto}
.dlg-t{font-size:16px;font-weight:600;margin:0 0 8px;letter-spacing:-.01em}
.dlg-m{font-size:13.5px;line-height:1.6;color:var(--text-2);white-space:pre-line;margin:0}
.dlg-in{width:100%;margin-top:12px;min-height:84px;resize:vertical;font:inherit;font-size:13.5px;padding:10px 12px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);color:var(--text)}
.dlg-in:focus{outline:2px solid var(--run);outline-offset:1px}
.dlg-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 22px 18px}
.dlg-f .hint{margin:0 auto 0 0;align-self:center;font-size:12px;color:var(--text-3)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 16px;border-radius:var(--r);font-size:13px;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.2);max-width:calc(100% - 32px);animation:fade .15s}

/* 반응형 */
@media (max-width:900px){
  .home-layout{grid-template-columns:minmax(0,1fr)}
  .home-side{position:static;grid-row:1}
  .top-in{padding:0 16px;gap:12px}
  main{padding:24px 16px 80px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat:nth-child(3){border-left:0}
  .stat:nth-child(n+3){border-top:1px solid var(--line)}
  .prow{grid-template-columns:minmax(0,1fr) auto;gap:6px 12px}
  .prow .flow,.prow .when,.prow .c{grid-column:1 / -1}
  .prow .when{text-align:left}
  .teams,.flow-lg{grid-template-columns:minmax(0,1fr)}
  .team,.fstep{border-left:0;border-top:1px solid var(--line)}
  .team:first-child,.fstep:first-child{border-top:0}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .ev{grid-template-columns:minmax(0,1fr);gap:4px}
  .mode span{display:none}
  .brand .word{display:none}
}
/* 공통 디자인 기준: 글자 위계, 버튼 역할, 카드와 반응형 배치 */
:root{--text-3:#63636E;--text-4:#797982;--line:#E4E4E8;--shadow:0 1px 3px rgba(17,17,26,.025);--r-lg:12px}
main{padding-top:32px}
.top-in{max-width:1520px;min-height:68px}
.top{background:rgba(250,250,250,.96)}
.tabs-top{gap:6px}
.tt{min-height:34px;padding:7px 12px;font-size:13px}
.tt.on{background:#EBEBEF;font-weight:600}
.brand-group .mode{font-size:11px;padding:4px 7px}
.top-more{margin-top:0}
.top-more-label{border:0;background:none;border-radius:6px;font-size:13px;padding:7px 12px;min-height:34px}
.page-h{margin-bottom:28px}
h1{font-size:28px;line-height:1.3;font-weight:600}
h2,.side-block h2{font-size:15px;font-weight:600;line-height:1.55;letter-spacing:-.01em}
.sec-h{align-items:center;margin-bottom:12px;min-height:32px}
.sec-h h2{margin:0}
.home-side-title{min-height:32px;display:flex;align-items:center}
.sec{margin-top:32px}
.lede{font-size:14px;line-height:1.65}
.hint,.small,.team .role,.side-list li{font-size:13px}
.btn,.btn.sm,.link{min-height:34px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:7px 12px;font-size:13px;line-height:1.4;border-radius:7px;font-weight:500}
.btn{min-height:36px}
.link{color:var(--text-2);background:transparent;border-color:transparent}
.link:hover{background:var(--subtle);border-color:transparent;color:var(--text)}
.link.create{background:#18181B;border-color:#18181B;color:#fff}
.btn.pri{font-weight:600}
.btn.criteria-approve{margin-top:14px;min-height:42px;padding:10px 18px}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{border-color:var(--line)}
summary,.home-side-toggle{min-height:32px;padding:6px 10px;font-size:12px;line-height:1.5;background:transparent;border-color:var(--line);border-radius:6px}
summary:hover,.home-side-toggle:hover{background:var(--subtle)}
.panel,.list,.card,.home-side-content,.stats,.flow-lg{box-shadow:none}
.home-layout{gap:28px;grid-template-columns:minmax(0,1fr) 300px}
.home-side-content{padding:18px}
.side-stats{gap:10px}
.side-stat{border:0;border-radius:8px;background:var(--subtle);padding:12px}
.side-stat span{font-size:12px;color:var(--text-2)}
.side-stat b{font-size:23px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.3;margin-top:5px}
.side-block{margin-top:18px;padding-top:18px}
.home-side-content>.side-block:nth-child(2){margin-top:22px}
.side-block h2{margin-bottom:12px}
.side-meter{gap:12px}
.side-meter .mi{font-size:13px;align-items:center}
.side-meter .mi b{font-weight:600;font-variant-numeric:tabular-nums}
.side-block>.hint{margin:8px 0}
#home-side-extra>.side-block:first-child{border-top:0;padding-top:0;margin-top:18px}
.side-list{gap:10px}
.teams{padding:0;gap:16px;background:transparent;border:0}
.teams .team{padding:20px;border:1px solid var(--line)!important}
.team .h{margin-bottom:8px}
.team .nm{font-size:14px}
.team .role{line-height:1.6}
.team dl{font-size:13px;gap:8px 12px}
.team dt{color:var(--text-3)}
.team dd{overflow-wrap:anywhere;line-height:1.55}
.team-recent{border-top:1px solid var(--line);padding-top:14px}
.skill-description{font-size:14px;line-height:1.65;margin:10px 0}
.skill-details{border-top:1px solid var(--line);padding-top:14px}
.prow .sub{font-size:13px;line-height:1.6;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.prow .when{font-size:12px;color:var(--text-3)}
.item{padding:20px;gap:14px}
.item .t{font-size:14px;line-height:1.55}
.item .b{font-size:14px;line-height:1.65;margin-top:6px}
.item:has(.ico.stop){background:var(--stop-soft)}
.item:has(.ico:not(.stop):not(.done)){background:#FFFCF6}
.pill{font-size:12px;padding:3px 7px;border-radius:5px;line-height:1.5}
.pill.run{background:var(--accent-soft)}
.pill.attn,.pill.wait{background:var(--attn-soft)}
.pill.stop{background:var(--stop-soft)}
.pill.done{background:var(--done-soft)}
.card{padding:20px}
.facts{gap:10px 14px;font-size:13px}
.card .lbl{font-size:13px;color:var(--text-2)}
.project-team{gap:16px;padding:18px 20px}
.ptabs{margin-top:24px;gap:12px}
.pt{font-size:13px;min-height:40px;padding:10px 4px;margin-right:0}
.input{height:38px;border-radius:7px}
.ta{padding:12px;line-height:1.65}
.field{margin-bottom:18px}
.empty{line-height:1.7}
.empty.sm{padding:28px 20px}
@media(max-width:1100px){.top-in{min-height:68px}.home-layout{gap:20px;grid-template-columns:minmax(0,1fr) 280px}.top-more-menu{min-width:150px}}
@media(max-width:900px){.home-layout{grid-template-columns:minmax(0,1fr)}.home-side{grid-row:auto}.home-side-content{padding:16px}.side-stats{grid-template-columns:repeat(4,minmax(0,1fr))}.home-side-title{margin-bottom:8px}.teams{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){main{padding:24px 16px 64px}.top-in{padding:12px 16px}.brand-group{gap:8px}.tabs-top{gap:4px}.tt{padding:6px 10px}.home-side{position:static}.teams{grid-template-columns:minmax(0,1fr)}.prow{padding:16px!important}.btn,.btn.sm,.link{min-height:36px}.side-stat b{font-size:21px}}
@media(max-width:480px){.side-stats{grid-template-columns:repeat(2,minmax(0,1fr))}.notification-status{font-size:11px}.top-r{gap:6px}h1{font-size:24px}}
/* 연결: 상태는 내용 너비로, 보조 설정은 펼쳤을 때만 표시 */
.connection-list .erow{grid-template-columns:minmax(0,1fr) auto;gap:12px 20px;padding:16px 20px;align-items:start}
.connection-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.connection-title .pill{flex:none;justify-self:start;width:fit-content}
.connection-list .sub{margin-top:6px;line-height:1.6}
.connection-list .connection-manage{display:contents}
.connection-manage>summary{grid-column:2;grid-row:1;justify-self:end;align-self:start;white-space:nowrap}
.connection-settings{grid-column:1/-1;padding-top:10px;max-width:640px}
.connection-manage:not([open])>.connection-settings{display:none}
.connection-settings .act{margin-top:10px;flex-wrap:wrap;gap:12px;justify-content:flex-start}
@media(max-width:600px){.connection-list .erow{padding:14px;gap:12px}.connection-title{gap:8px}.connection-settings{max-width:none}}
/* 맨 위로: 우측 하단에 고정하고 화면 가장자리·안전 영역과 간격을 둔다. */
.to-top{position:fixed;right:calc(24px + env(safe-area-inset-right,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:35;display:inline-flex;align-items:center;justify-content:center;gap:6px;width:96px;height:44px;padding:0;border:1px solid var(--text);border-radius:999px;background:var(--text);color:var(--surface);font-size:13px;font-weight:500;line-height:1.3;box-shadow:0 6px 20px rgba(17,17,26,.12);cursor:pointer;opacity:0;visibility:hidden;transform:translateY(8px);transition:opacity .18s ease,transform .18s ease,visibility .18s,border-color .15s,color .15s}
.to-top.show{opacity:1;visibility:visible;transform:none}
.to-top{transition:opacity .18s ease,transform .2s ease,visibility .18s,background .2s ease,border-color .2s ease,box-shadow .2s ease}
.to-top{gap:7px;font-weight:600;line-height:20px}
.to-top span{display:inline-flex;align-items:center;justify-content:center;height:20px;line-height:20px;white-space:nowrap;position:relative;top:-1px}
@media (hover:hover){.to-top.show:hover{transform:translateY(-3px);background:var(--text-2);border-color:var(--text-2);box-shadow:0 9px 24px rgba(17,17,26,.2)}}
.to-top.show:active{transform:translateY(0) scale(.96);box-shadow:0 3px 10px rgba(17,17,26,.14)}
.to-top:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.to-top svg{display:block;width:16px;height:16px;flex:none;margin:0;transition:transform .2s ease}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.to-top.show:hover,.to-top.show:active,.to-top.show:hover svg{transform:none}}
@media (max-width:760px){.to-top{right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:44px;height:44px;padding:0;justify-content:center}.to-top span{display:none}}
</style>
</head>
<body>
<a class="skip" href="#main">본문으로 건너뛰기</a>
<div id="app"></div>
<button type="button" class="to-top" id="to-top" aria-label="맨 위로" aria-hidden="true" tabindex="-1"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 13V3M3.5 7.5 8 3 12.5 7.5"/></svg><span>맨 위로</span></button>
<template id="tpl">
<div style="--accent: {{accent}}">
<header class="top">
  <div class="top-in">
    <div class="brand-group"><button class="brand" onClick="{{goHome}}" aria-label="홈으로"><span class="mark">HQ</span><span class="word">AGENT HQ</span></button><span class="{{modeCls}}" title="{{modeTitle}}"><i></i><span>{{modeL}}</span></span></div>
    <nav class="tabs-top" aria-label="주 메뉴">
      <sc-for list="{{nav}}" as="n"><button class="{{n.cls}}" aria-current="{{n.cur}}" onClick="{{n.go}}">{{n.l}}<sc-if value="{{n.hasN}}"><span class="n">{{n.n}}</span></sc-if></button></sc-for>
      <div class="top-more"><span class="top-more-label" tabindex="0" aria-haspopup="true">더 보기</span><div class="top-more-menu"><sc-for list="{{navMore}}" as="n"><button class="{{n.cls}}" aria-current="{{n.cur}}" onClick="{{n.go}}">{{n.l}}</button></sc-for></div></div>
    </nav>
    <div class="top-r">
      <sc-if value="{{notif.canAsk}}"><button class="btn ghost sm" onClick="{{notif.enable}}" title="질문·승인·완료·멈춤이 생기면 이 창을 보고 있지 않아도 알려 줍니다">알림 켜기</button></sc-if>
      <sc-if value="{{notif.on}}"><span class="notification-status" role="status" title="이 브라우저 창이 열려 있는 동안 알려 줍니다">알림 켜짐</span></sc-if>
    </div>
  </div>
</header>

<main id="main">
  <sc-if value="{{offline}}"><div class="offline" role="alert">엔진 서버에 연결할 수 없습니다. 서버가 켜져 있는지 확인해 주세요.</div></sc-if>

<!-- ================= 홈 ================= -->
<sc-if value="{{vHome}}">
  <div class="page-h">
    <div><h1>{{greeting}}</h1><p class="lede">{{homeLede}}</p></div>
  </div>

  <sc-if value="{{hasProjects}}">
    <div class="home-layout"><div class="home-primary">

    <section class="sec" aria-labelledby="inbox-h">
      <div class="sec-h"><h2 id="inbox-h">확인 필요</h2><span class="meta">팀이 대장의 결정을 기다리는 일</span></div>
      <div class="list inbox">
        <sc-for list="{{inbox}}" as="it">
          <div class="item">
            <span class="{{it.icoCls}}" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{it.icon}}"></path></svg></span>
            <div>
              <div class="t">{{it.title}} <span class="proj">· {{it.project}}</span></div>
              <div class="b">{{it.body}}</div>
              <sc-if value="{{it.isQuestion}}">
                <div class="q">{{it.question}}</div>
                <sc-if value="{{it.hasJudge}}"><div class="judge"><sc-for list="{{it.judge}}" as="j"><div class="judge-row"><span>{{j.l}}</span><button class="btn pri sm" onClick="{{j.go}}">완료로 확인</button></div></sc-for></div></sc-if>
                <div class="acts" style="flex-direction: column; align-items: stretch; max-width: 72ch">
                  <label class="hint" for="{{it.inputId}}">답변</label>
                  <textarea class="ta" id="{{it.inputId}}" placeholder="예: 주석을 더 쉽게 고쳐 줘 · 이 조건은 빼고 진행해" value="{{it.draft}}" onChange="{{it.onDraft}}"></textarea>
                  <div class="row-f"><button class="btn pri sm" onClick="{{it.send}}">답변 보내고 계속</button><button class="btn ghost sm" onClick="{{it.open}}">프로젝트 보기</button></div>
                </div>
              </sc-if>
              <sc-if value="{{it.isProposal}}">
                <ul class="ul"><sc-for list="{{it.items}}" as="x"><li>{{x}}</li></sc-for></ul>
                <div class="acts"><button class="btn pri sm" onClick="{{it.accept}}">승인하고 계속</button><button class="btn sm" onClick="{{it.dismiss}}">보류</button><button class="btn ghost sm" onClick="{{it.open}}">프로젝트 보기</button></div>
              </sc-if>
              <sc-if value="{{it.isIssue}}">
                <div class="acts"><sc-for list="{{it.actions}}" as="a"><button class="{{a.cls}}" onClick="{{a.go}}">{{a.l}}</button></sc-for></div>
              </sc-if>
            </div>
          </div>
        </sc-for>
        <sc-if value="{{inboxEmpty}}"><div class="empty sm">확인할 일이 없습니다. 팀이 결정을 기다리면 여기에 나타납니다.</div></sc-if>
      </div>
    </section>

    <section class="sec" aria-labelledby="proj-h">
      <div class="sec-h"><h2 id="proj-h">프로젝트</h2><div class="row-f"><button class="link small" onClick="{{goProjects}}">모두 보기</button><button class="link create small" onClick="{{openNew}}">새 프로젝트</button></div></div>
      <div class="list">
        <sc-if value="{{homeNoActive}}"><div class="empty sm">진행 중인 프로젝트가 없습니다. 완료된 프로젝트는 ‘모두 보기’에서 볼 수 있습니다.</div></sc-if>
        <sc-for list="{{homeProjects}}" as="p">
          <button class="prow" onClick="{{p.open}}">
            <span style="min-width: 0"><span class="name">{{p.name}}<sc-if value="{{p.single}}"><span class="kind">단일 실행</span></sc-if></span><span class="sub">{{p.sub}}</span></span>
            <span class="flow" aria-label="팀 흐름"><sc-for list="{{p.flow}}" as="f"><sc-if value="{{f.sep}}"><span class="sep"></span></sc-if><span class="{{f.cls}}"><b></b>{{f.l}}</span></sc-for></span>
            <span class="{{p.pillCls}}"><i></i>{{p.stL}}</span>
            <span class="c">{{p.proven}}<small>/{{p.total}} 조건</small></span>
            <span class="when">{{p.ago}}</span>
          </button>
        </sc-for>
      </div>
    </section>
    </div><aside class="home-side" aria-label="상태와 요약"><h2 class="home-side-title">작업 현황</h2><div class="home-side-content">
  <section class="side-block" aria-label="작업 현황"><div class="side-stats"><div class="side-stat"><span>진행 중</span><b>{{st.active}}개</b></div><div class="side-stat"><span>오늘 실행</span><b>{{st.today}}회</b></div><div class="side-stat"><span>완료</span><b>{{st.done}}개</b></div><div class="side-stat"><span>확인 필요</span><b>{{st.inbox}}건</b></div></div></section>
      <section class="side-block"><div class="sec-h"><h2>구독 사용량</h2><button class="link small" onClick="{{meter.go}}">상세</button></div><sc-if value="{{meter.has}}"><div class="side-meter"><sc-for list="{{meter.items}}" as="m"><div class="{{m.cls}}" title="{{m.t}}"><span class="provider-label">{{m.l}}</span><b>{{m.v}}</b></div></sc-for></div></sc-if><sc-if value="{{meter.none}}"><p class="hint">확인된 사용량이 없습니다.</p></sc-if></section>
      <div class="side-block"><button class="home-side-toggle" aria-expanded="{{sideExpanded}}" aria-controls="home-side-extra" onClick="{{toggleSide}}">요약 · 활동 보기</button></div><sc-if value="{{sideOpen}}"><div id="home-side-extra">

ue="{{dg.has}}"><button class="btn ghost sm" onClick="{{dg.removeLatest}}">최근 요약 삭제</button><button class="btn danger sm" onClick="{{dg.clear}}">요약 모두 지우기</button></sc-if></div></details></section>
      <section class="side-block"><h2>최근 활동</h2><ul class="side-list"><sc-for list="{{recentActivity}}" as="r"><li><b>{{r.project}}</b> · {{r.team}}<span class="muted">{{r.when}} · {{r.result}}</span></li></sc-for></ul><sc-if value="{{noRecentActivity}}"><p class="hint">아직 실행 기록이 없습니다.</p></sc-if></section>
    </div></sc-if></div></aside></div>

    <section class="sec" aria-labelledby="team-h" hidden>
      <div class="sec-h"><h2 id="team-h">팀</h2><button class="link small" onClick="{{goTeams}}">자세히</button></div>
      <div class="panel teams">
        <sc-for list="{{teams}}" as="t">
          <div class="{{t.miniCls}}">
            <div class="h"><span class="nm"><span class="mono-tile" aria-hidden="true">{{t.mono}}</span>{{t.name}}</span><span class="{{t.pillCls}}"><i></i>{{t.stL}}</span></div>
            <div class="role">{{t.now}}</div>
            <dl><dt>AI 모델 계열</dt><dd>{{t.family}}</dd><dt>실행 도구</dt><dd class="mono small">{{t.tool}}</dd><dt>확인된 모델</dt><dd class="mono small">{{t.model}}</dd><dt>오늘</dt><dd class="num">{{t.today}}회</dd></dl>
          </div>
        </sc-for>
      </div>
    </section>
  </sc-if>

  <sc-if value="{{noProjects}}">

    </div>
  </sc-if>
</sc-if>

      <div class="list">
        <sc-for list="{{doneProjects}}" as="p">
          <button class="prow" onClick="{{p.open}}">
            <span style="min-width: 0"><span class="name">{{p.name}}<sc-if value="{{p.single}}"><span class="kind">단일 실행</span></sc-if></span><span class="sub">{{p.sub}}</span></span>
            <span class="flow" aria-label="팀 흐름"><sc-for list="{{p.flow}}" as="f"><sc-if value="{{f.sep}}"><span class="sep"></span></sc-if><span class="{{f.cls}}"><b></b>{{f.l}}</span></sc-for></span>
            <span class="{{p.pillCls}}"><i></i>{{p.stL}}</span>
            <span class="c">{{p.proven}}<small>/{{p.total}} 조건</small></span>
            <span class="when">{{p.ago}}</span>
          </button>
        </sc-for>

  </div>
