<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AGENT HQ 대시보드</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style>
:root{--bg:#F3F2EE;--sf:#FFFFFF;--sf2:#F8F7F3;--ln:#E3E1D9;--ln2:#D2CFC5;--ink:#16161A;--ink2:#44444C;--ink3:#62626A;--side:#141519;--side2:#1F2126;--side-ink:#EDECE7;--side-mut:#A7A6A0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;word-break:keep-all}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.hq{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh}
.hq.is-narrow{grid-template-columns:minmax(0,1fr)}

/* 사이드바 */
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--side);color:var(--side-ink);padding:20px 14px;display:flex;flex-direction:column;gap:22px}
.is-narrow .side{display:none}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px}
.logo{width:32px;height:32px;border-radius:9px;background:#F3F2EE;color:#141519;display:grid;place-items:center;font-weight:600;font-size:12px;font-family:"IBM Plex Mono",monospace;flex:none}
.brand b{font-size:15px;letter-spacing:.04em;display:block}
.brand small{display:block;font-size:12px;color:var(--side-mut);margin-top:1px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-b{display:flex;align-items:center;gap:11px;min-height:42px;padding:0 10px;border:0;background:transparent;border-radius:9px;color:var(--side-mut);font-size:14px;font-weight:500;text-align:left;width:100%}
.nav-b:hover{background:var(--side2);color:var(--side-ink)}
.nav-b.on{background:#2B2D34;color:#fff}
.nav-b svg{width:18px;height:18px;flex:none}
.cnt{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;background:#F3A06A;color:#26140A;border-radius:6px;padding:1px 7px}
.plist{display:flex;flex-direction:column;gap:1px}
.side h4{margin:0 0 6px;padding:0 10px;font-size:11.5px;letter-spacing:.1em;color:var(--side-mut);font-weight:600}
.sp{display:flex;align-items:center;gap:10px;min-height:36px;padding:0 10px;border:0;background:transparent;border-radius:8px;color:var(--side-mut);font-size:13px;text-align:left;width:100%}
.sp:hover{background:var(--side2);color:var(--side-ink)}
.sp.on{background:#2B2D34;color:#fff}
.sp span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sd{width:8px;height:8px;border-radius:50%;flex:none;background:#8A8A92}
.sd-run{background:#5B73F2}.sd-queue{background:#8A93A6}.sd-limit{background:#D19A2A}.sd-approve{background:#E0803A}.sd-review{background:#8E5BD6}.sd-stall{background:#E0503F}.sd-done{background:#2BA864}.sd-paused{background:#6E6E76}.sd-plan{background:#B9B6AC}
.ops{border-top:1px solid #2B2D34;padding:16px 8px 0;display:flex;flex-direction:column;gap:12px}
.ops h4{padding:0}
.op{display:flex;flex-direction:column;gap:3px}
.op .k{font-size:12.5px;color:var(--side-mut)}
.op .v{font-size:15px;font-weight:600;color:var(--side-ink)}
.op .v em{font-style:normal;font-size:12px;color:var(--side-mut);font-weight:400;margin-left:6px}
.slots{display:flex;gap:4px;margin-top:4px}
.slots i{height:6px;flex:1;border-radius:3px;background:#8FA2FF}
.slots i.off{background:#34363E}
.side-note{margin-top:auto;font-size:12px;color:var(--side-mut);border:1px dashed #3B3D45;border-radius:10px;padding:11px 12px;line-height:1.55}
.side-note b{color:#F6CF84;font-weight:600}

/* 상단 */
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px 32px;background:rgba(243,242,238,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--ln)}
.is-narrow .top{padding:10px 14px;flex-wrap:wrap}
.m-brand{display:none;align-items:center;gap:8px;font-weight:700;font-size:15px;letter-spacing:.04em}
.m-brand .logo{background:var(--ink);color:#fff;width:28px;height:28px}
.is-narrow .m-brand{display:flex}
.search{position:relative;flex:1;max-width:540px}
.is-narrow .search{order:3;flex-basis:100%;max-width:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.search input{width:100%;height:42px;border:1px solid var(--ln2);border-radius:10px;background:var(--sf);padding:0 12px 0 38px;font-size:14px}
.search input::placeholder{color:#76767D}
.search svg{position:absolute;left:12px;top:12px;width:18px;height:18px;color:var(--ink3)}
.results{position:absolute;top:48px;left:0;right:0;background:var(--sf);border:1px solid var(--ln2);border-radius:12px;box-shadow:0 14px 36px rgba(20,20,25,.14);padding:6px;max-height:380px;overflow:auto;z-index:30}
.res{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;border:0;background:none;text-align:left;padding:10px;border-radius:8px;min-height:48px}
.res:hover{background:var(--sf2)}
.res b{font-weight:600;font-size:14px;display:block}
.res small{display:block;color:var(--ink3);font-size:12.5px;margin-top:2px}
.res-empty{padding:14px;font-size:13.5px;color:var(--ink3)}
.kind{font-size:11.5px;color:var(--ink2);border:1px solid var(--ln2);border-radius:6px;padding:2px 7px;white-space:nowrap;flex:none}
.sample{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:#6E4300;background:#FBEFD2;border:1px solid #ECD49A;padding:6px 11px;border-radius:999px;white-space:nowrap}
.sample i{width:6px;height:6px;border-radius:50%;background:#B7791F}
.me{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600}
.av{width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:600}
.mnav{display:none;gap:6px;overflow-x:auto;padding:10px 14px;border-bottom:1px solid var(--ln);background:var(--bg)}
.is-narrow .mnav{display:flex}
.chip{flex:none;border:1px solid var(--ln2);background:var(--sf);border-radius:999px;padding:0 14px;min-height:40px;font-size:13.5px;font-weight:500}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* 공통 */
.wrap{width:100%;max-width:1320px;margin:0 auto;padding:28px 32px 72px;display:flex;flex-direction:column;gap:26px}
.is-narrow .wrap{padding:18px 14px 56px;gap:22px}
.ph h1{margin:0;font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.3}
.is-narrow .ph h1{font-size:23px}
.ph h1 em{font-style:normal;color:#B4410E}
.ph p{margin:8px 0 0;color:var(--ink2);font-size:14.5px;line-height:1.55}
.ph-row{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.sec-h h2{margin:0;font-size:18px;font-weight:700}
.sec-h .aside{font-size:13px;color:var(--ink3)}
.ex{display:inline-block;font-size:11px;font-weight:600;color:#6E4300;background:#FBEFD2;border-radius:4px;padding:2px 6px;margin-left:8px;vertical-align:3px}
.panel{background:var(--sf);border:1px solid var(--ln);border-radius:14px;min-width:0}
.pad{padding:16px 20px}
.pn-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 20px;border-bottom:1px solid var(--ln);flex-wrap:wrap}
.pn-h h2{margin:0;font-size:16.5px;font-weight:700;display:flex;align-items:center;gap:10px}
.pn-h .aside{font-size:12.5px;color:var(--ink3)}
.big{font-family:"IBM Plex Mono",monospace;font-size:15px;font-weight:600;background:#B4410E;color:#fff;border-radius:7px;padding:1px 8px}
.big.zero{background:#17803D}
.h3{margin:0 0 10px;font-size:13px;font-weight:700;color:var(--ink2)}
.h3row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.btn{min-height:38px;padding:0 13px;border-radius:8px;border:1px solid var(--ln2);background:var(--sf);font-size:13px;font-weight:600;white-space:nowrap}
.is-narrow .btn{min-height:44px}
.btn:hover{background:var(--sf2)}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.pri:hover{background:#2C2C33}
.lnk{border:0;background:none;padding:0;color:var(--acc);font-weight:600;font-size:13px;min-height:32px}
.lnk:hover{text-decoration:underline;text-underline-offset:3px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.cl{display:none;font-size:11.5px;color:var(--ink3);margin-bottom:2px}
.is-narrow .cl,.is-mid .cl{display:block}
.s{font-size:12.5px;color:var(--ink3);line-height:1.5}
.warn-t{color:#8E2A1D;font-weight:500}
.none-t{color:var(--ink3)}
.goal{font-size:15.5px;line-height:1.65;font-weight:500;margin:0}
.callout{border-radius:11px;padding:12px 14px;font-size:13.5px;line-height:1.55;background:#FBE9E6;color:#7D2016;font-weight:500}
.callout.info{background:#EEF0FB;color:#26307E}
.callout.warn{background:#FBF1D6;color:#5E3E00}
.empty{border:1px dashed var(--ln2);border-radius:12px;padding:22px;text-align:center;font-size:13.5px;color:var(--ink3);line-height:1.6}
.tool{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-family:"IBM Plex Mono",monospace;color:var(--ink2);border:1px solid var(--ln2);border-radius:6px;padding:2px 7px;background:var(--sf2);white-space:nowrap}
.tool i{width:6px;height:6px;border-radius:50%;background:var(--ink2)}
.asg{font-size:12.5px;color:var(--ink2);font-family:"IBM Plex Mono",monospace}
.unk{color:#744C00;font-weight:600}
.lchip{border:1px solid var(--ln2);background:var(--sf);border-radius:8px;min-height:38px;padding:0 12px;font-size:13px;font-weight:600;text-align:left}
.lchip:hover{background:var(--sf2)}
.linkchips{display:flex;gap:6px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--ln2);border-radius:9px;padding:2px;background:var(--sf2);flex-wrap:wrap}
.seg button{border:0;background:none;min-height:36px;padding:0 13px;border-radius:7px;font-size:13px;font-weight:500;color:var(--ink2)}
.seg button.on{background:var(--sf);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.kv{display:grid;grid-template-columns:70px minmax(0,1fr);gap:6px 10px;font-size:13px;margin:0;line-height:1.5}
.kv dt{color:var(--ink3)}
.kv dd{margin:0;color:var(--ink2)}

/* 상태 */
.st{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;padding:4px 10px 4px 9px;border-radius:999px;white-space:nowrap;justify-self:start}
.st::before{content:"";width:8px;height:8px;flex:none;box-sizing:border-box}
.st-run{color:#1D43C9;background:#E6EBFC}
.st-run::before{border-radius:50%;background:currentColor;box-shadow:0 0 0 3px rgba(29,67,201,.2)}
.st-queue{color:#394358;background:#E6E9F0}
.st-queue::before{border:2px solid currentColor;border-radius:2px}
.st-limit{color:#744C00;background:#F9EDCB}
.st-limit::before{background:currentColor;height:3px;width:10px;border-radius:2px}
.st-review{color:#5F23B0;background:#F0E9FB}
.st-review::before{border-radius:50%;border:2px solid currentColor}
.st-approve{color:#A33A0B;background:#FCE9D9}
.st-approve::before{background:currentColor;transform:rotate(45deg);width:7px;height:7px}
.st-stall{color:#A51F14;background:#FBE1DD}
.st-stall::before{background:currentColor;border-radius:1px}
.st-paused{color:#44444C;background:#ECEAE4}
.st-paused::before{width:7px;height:9px;border-left:2.5px solid currentColor;border-right:2.5px solid currentColor}
.st-plan{color:#55555D;background:#F1F0EC}
.st-plan::before{border-radius:50%;border:1.5px dashed currentColor}
.st-done{color:#166B34;background:#DDF1E3}
.st-done::before{width:5px;height:9px;border:solid currentColor;border-width:0 2px 2px 0;transform:rotate(45deg) translateY(-1px)}
.legend{display:flex;gap:6px;flex-wrap:wrap}
.legend .st{font-size:11.5px;padding:2px 8px 2px 7px}
.rv{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:3px 8px;white-space:nowrap}
.rv-pass{background:#DDF1E3;color:#166B34}
.rv-cond{background:#F9EDCB;color:#744C00}
.rv-prog{background:#F0E9FB;color:#5F23B0}
.rv-wait{background:#EDEBE5;color:#4A4A52}
.rv-rej{background:#FBE1DD;color:#A51F14}

/* 상황실 */
.strip{display:flex;gap:8px;flex-wrap:wrap}
.strip span{font-size:13px;background:var(--sf);border:1px solid var(--ln);border-radius:9px;padding:7px 12px;color:var(--ink2)}
.strip b{color:var(--ink);font-weight:600;margin-left:4px}
.inb{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;padding:15px 20px;border-bottom:1px solid var(--ln)}
.is-narrow .inb{padding:14px 16px}
.ty{font-size:12px;font-weight:700;border-radius:6px;padding:4px 0;text-align:center;align-self:start;margin-top:1px}
.ty-ap{background:#E8EAFB;color:#2531A8}
.ty-ch{background:#F0E9FB;color:#5F23B0}
.ty-inc{background:#FBE3E0;color:#A51F14}
.inb .t{font-weight:600;font-size:14.5px;line-height:1.45;background:none;border:0;padding:0;text-align:left}
.inb .t:hover{text-decoration:underline;text-underline-offset:3px}
.inb .d{font-size:13px;color:var(--ink2);margin-top:3px;line-height:1.5}
.resolved{font-size:13px;color:#166B34;font-weight:600;margin-top:8px;display:flex;align-items:center;gap:6px}
.more{width:100%;border:0;background:none;min-height:46px;font-size:13.5px;font-weight:600;color:var(--acc);border-radius:0 0 14px 14px}
.more:hover{background:var(--sf2)}
.orow{display:grid;grid-template-columns:minmax(0,1fr) 96px 104px;gap:18px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--ln);padding:14px 20px}
.orow:last-child{border-bottom:0}
.orow:hover{background:var(--sf2)}
.is-narrow .orow{grid-template-columns:minmax(0,1fr) auto;gap:10px}
.is-narrow .orow .crit{display:none}
.p-name{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.o-next{font-size:13px;color:var(--ink2);margin-top:3px;line-height:1.5}
.crit .n{font-family:"IBM Plex Mono",monospace;font-size:16px;font-weight:600}
.crit .n small{color:var(--ink3);font-size:13px}
.crit .s{margin-top:1px}
.ugrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.is-narrow .ugrid{grid-template-columns:minmax(0,1fr)}
.ucard{padding:15px 18px;display:flex;flex-direction:column;gap:12px}
.acct-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.acct-h b{font-size:15px;font-weight:700}
.minis{display:grid;grid-template-columns:repeat(auto-fit,minmax(124px,1fr));gap:10px}
.mini{border:1px solid var(--ln);border-radius:10px;padding:10px 11px;min-width:0}
.mini.hit{border-color:#E4ADA5;background:#FDF3F1}
.mini.sub{border-style:dashed;background:var(--sf2)}
.mini .k{font-size:12px;color:var(--ink2);font-weight:600}
.mini .m-v{font-size:20px}
.mini .m-meta{font-size:11.5px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.tcard{display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:15px;width:100%;min-width:0}
.tcard:hover{border-color:var(--ln2);box-shadow:0 6px 18px rgba(20,20,25,.07)}
.tcard.alert{border-color:#E6B3AB}
.t-h{display:flex;justify-content:space-between;gap:8px;align-items:center}
.t-name{font-size:15.5px;font-weight:700}

/* 사용량 미터 */
.m-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.m-top .k{font-size:12.5px;color:var(--ink2);font-weight:600}
.m-v{font-family:"IBM Plex Mono",monospace;font-size:26px;font-weight:600;letter-spacing:-.02em}
.m-v.na{font-family:"IBM Plex Sans KR",sans-serif;font-size:15px;color:var(--ink3)}
.bar{position:relative;height:8px;background:#ECEAE3;border-radius:99px;margin:8px 0 7px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--ink)}
.hit .bar i{background:#B42318}
.bar .th{position:absolute;top:-4px;bottom:-4px;width:2px;background:#B42318;border-radius:1px}
.bar.unknown{background:repeating-linear-gradient(135deg,#E3E1D9 0 6px,#F8F7F3 6px 12px)}
.bar.unknown i,.bar.unknown .th{display:none}
.m-meta{font-size:12px;color:var(--ink3);line-height:1.6}
.m-meta b{color:var(--ink2);font-weight:600}
.m-flag{display:inline-block;font-size:12px;font-weight:700;color:#fff;background:#B42318;border-radius:5px;padding:1px 7px;margin-bottom:4px}
.m-ok{display:inline-block;font-size:12px;font-weight:600;color:#166B34;margin-bottom:4px}
.m-unk{display:inline-block;font-size:12px;font-weight:600;color:#4A4A52;margin-bottom:4px}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start}
.is-narrow .duo,.is-mid .duo{grid-template-columns:minmax(0,1fr)}
.usage{padding:16px 20px 18px;display:flex;flex-direction:column;gap:14px}
.meters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.is-narrow .meters{grid-template-columns:minmax(0,1fr)}
.meter{border:1px solid var(--ln);border-radius:11px;padding:12px 13px;min-width:0}
.meter.hit{border-color:#E4ADA5;background:#FDF3F1}
.submeter{border:1px dashed var(--ln2);border-radius:11px;padding:12px 13px;background:var(--sf2)}
.subhead{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.subhead b{font-size:13px}
.subtag{font-size:11.5px;font-weight:600;color:var(--ink2);border:1px solid var(--ln2);border-radius:5px;padding:1px 6px;background:var(--sf)}
.swap{font-size:12.5px;color:var(--ink2);line-height:1.5}
.u-note{font-size:12px;color:var(--ink3);border-top:1px dashed var(--ln2);padding-top:12px;line-height:1.6}
.rules{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.is-narrow .rules,.is-mid .rules{grid-template-columns:minmax(0,1fr)}
.rule{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:14px 16px;font-size:13.5px;line-height:1.6;color:var(--ink2)}
.rule b{display:block;color:var(--ink);font-size:14px;margin-bottom:4px}

/* 표 공통 */
.tbl{background:var(--sf);border:1px solid var(--ln);border-radius:14px;overflow:hidden}
.row{display:grid;gap:14px;align-items:center;padding:12px 18px;border:0;border-bottom:1px solid var(--ln);width:100%;text-align:left;background:none;font-size:13.5px;line-height:1.5}
.row:last-child{border-bottom:0}
button.row:hover{background:var(--sf2)}
.row.head{font-size:12px;font-weight:600;color:var(--ink3);background:var(--sf2)}
.is-narrow .row.head,.is-mid .row.head{display:none}
.is-narrow .row,.is-mid .row{grid-template-columns:minmax(0,1fr) minmax(0,1fr) !important;gap:8px 14px}
.is-narrow .row > .wide,.is-mid .row > .wide{grid-column:1 / -1}
.plrow{grid-template-columns:minmax(0,2fr) 104px minmax(0,1fr) 84px minmax(0,1.4fr) minmax(0,1.4fr);align-items:start;padding:15px 18px}
.plrow .p-goal{display:block;font-size:13px;color:var(--ink2);margin-top:4px}
.urow{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) minmax(0,1.6fr) 70px}
.ubar{height:6px;background:#ECEAE3;border-radius:3px}
.ubar i{display:block;height:100%;border-radius:3px;background:#6E6E76}
.rawrow{grid-template-columns:80px 100px minmax(0,1.2fr) 100px minmax(0,1.3fr) 110px}
.regrow{grid-template-columns:minmax(0,1.3fr) 76px minmax(0,1.2fr) 70px minmax(0,1.5fr) 92px 92px}
.r-name{font-weight:700;font-family:"IBM Plex Mono",monospace;font-size:14px}
.r-sub{font-size:12px;color:var(--ink3);font-family:"IBM Plex Sans KR",sans-serif;font-weight:400;margin-top:2px}

/* 프로젝트 목록 */
.pbar{display:flex;flex-direction:column;gap:12px}
.pinput{width:100%;max-width:460px;height:42px;border:1px solid var(--ln2);border-radius:10px;background:var(--sf);padding:0 12px;font-size:14px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.fchip{border:1px solid var(--ln2);background:var(--sf);border-radius:999px;min-height:36px;padding:0 12px;font-size:13px;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.fchip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.fchip .mono{font-size:12px;opacity:.75}

/* 프로젝트 작업실 */
.crumb{font-size:13px;color:var(--ink3);display:flex;gap:6px;align-items:center}
.ws-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
.ws-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ws-title h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.3}
.is-narrow .ws-title h1{font-size:22px}
.cyc{font-size:11.5px;color:var(--ink3);font-weight:500;border:1px solid var(--ln2);border-radius:5px;padding:1px 6px}
.ws-goal{margin:8px 0 0;font-size:15px;color:var(--ink2);line-height:1.6;max-width:780px}
.ws-switch{display:flex;gap:6px;align-items:center;overflow-x:auto;padding-bottom:2px}
.ws-switch .k{font-size:12px;color:var(--ink3);font-weight:600;flex:none;margin-right:4px}
.swc{flex:none;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--ln2);background:var(--sf);border-radius:999px;min-height:36px;padding:0 12px;font-size:13px;font-weight:500}
.swc.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);font-weight:700}
.wtabs{display:flex;gap:2px;border-bottom:1px solid var(--ln2);overflow-x:auto;margin-top:-6px}
.wtab{border:0;background:none;padding:0 14px;min-height:46px;font-size:14.5px;font-weight:500;color:var(--ink3);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.wtab.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:700}
.tn{font-family:"IBM Plex Mono",monospace;font-size:11.5px;background:var(--sf2);border:1px solid var(--ln);border-radius:5px;padding:0 5px;color:var(--ink2);font-weight:500}
.wgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
.is-narrow .wgrid,.is-mid .wgrid{grid-template-columns:minmax(0,1fr)}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.stp{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--ink3)}
.stp i{height:5px;border-radius:3px;background:#E3E1D9}
.stp.done{color:var(--ink2)}
.stp.done i{background:#5B5B63}
.stp.now{color:var(--acc);font-weight:700}
.stp.now i{background:var(--acc)}
.vsum{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;color:var(--ink2);align-items:baseline}
.vsum b{font-family:"IBM Plex Mono",monospace;font-size:22px;color:var(--ink);margin-right:4px}
.trow{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;border:0;background:none;padding:10px 0;border-bottom:1px solid var(--ln);text-align:left}
.trow:last-child{border-bottom:0}
.trow:hover .asg{text-decoration:underline}
.path{font-size:13.5px;background:var(--sf2);border:1px solid var(--ln);border-radius:8px;padding:8px 10px;margin-bottom:6px;overflow-wrap:anywhere}
.tkrow{grid-template-columns:minmax(0,1.6fr) minmax(0,1.5fr) 104px minmax(0,1.3fr)}
.tk-t{font-weight:600}
.chat{display:flex;flex-direction:column;gap:10px;padding:16px 20px;max-height:360px;overflow:auto}
.msg{max-width:86%;border-radius:12px;padding:10px 12px;background:var(--sf2);border:1px solid var(--ln)}
.msg.me{align-self:flex-end;background:#EEF0FB;border-color:#D6DBF6}
.m-by{font-size:12px;color:var(--ink3);margin-bottom:3px}
.m-t{font-size:14px;line-height:1.55}
.form{display:flex;flex-direction:column;gap:8px}
.form label{font-size:13px;font-weight:600;color:var(--ink2)}
.form textarea{width:100%;min-height:84px;border:1px solid var(--ln2);border-radius:10px;padding:10px 12px;font-size:14px;resize:vertical;background:var(--sf);line-height:1.5}
.form .pinput{max-width:none}
.form-row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.form-row small{font-size:12px;color:var(--ink3)}
.chat-form{padding:14px 20px 18px;border-top:1px solid var(--ln)}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.acard{display:flex;flex-direction:column;background:var(--sf);border:1px solid var(--ln);border-radius:14px;overflow:hidden;min-width:0}
.acard.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.thumb{height:132px;background:#EDEBE5;display:flex;align-items:center;justify-content:center;padding:16px;border-bottom:1px solid var(--ln)}
.a-body{padding:13px 15px 15px;display:flex;flex-direction:column;gap:6px}
.a-name{font-size:15px;font-weight:700}
.a-meta{font-size:12.5px;color:var(--ink3);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.vtag{font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;color:var(--ink);background:var(--sf2);border:1px solid var(--ln2);border-radius:5px;padding:1px 6px}
.doc{width:62%;height:100%;background:#fff;border-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:12px;display:flex;flex-direction:column;gap:6px}
.doc i{height:5px;border-radius:3px;background:#E3E1DA}
.doc i.h{height:8px;width:70%;background:#3A3A42}
.doc i.s{width:55%}
.slide{width:88%;aspect-ratio:16/9;background:#18191E;border-radius:4px;padding:10px;display:flex;flex-direction:column;justify-content:space-between;color:#fff}
.slide b{font-size:11px}
.slide .bars,.slidepv .bars{display:flex;align-items:flex-end;gap:5px;height:40%}
.slide .bars i,.slidepv .bars i{flex:1;background:#8FA2FF;border-radius:2px 2px 0 0}
.dsn{width:88%;height:100%;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dsn div{background:#fff;border-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:8px;display:flex;flex-direction:column;gap:5px}
.dsn i{height:5px;border-radius:3px;background:#E3E1DA}
.dsn i.blk{height:34%;background:#2B2C32}
.wthumb{width:88%;height:100%;background:#fff;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.08);overflow:hidden;display:flex;flex-direction:column}
.wthumb .u{height:14px;background:var(--sf2);border-bottom:1px solid var(--ln)}
.wthumb .b{flex:1;padding:8px;display:grid;grid-template-columns:1fr 1fr;gap:5px}
.wthumb .b i{background:#E9E7E1;border-radius:3px}
.vb{padding:18px 20px 22px;display:flex;flex-direction:column;gap:20px}
.is-narrow .vb{padding:14px 16px 18px}
.pv-bar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap}
.pv-stage{background:#E7E5DE;border-radius:12px;padding:16px;display:flex;justify-content:center;overflow:hidden}
.pv-frame{background:#fff;border-radius:8px;border:1px solid var(--ln2);overflow:hidden;width:100%;transition:width .25s ease}
.pv-frame.app{width:290px;border-radius:24px;border-width:6px;border-color:#2A2B30}
.pv-url{height:28px;background:var(--sf2);border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:6px;padding:0 10px;font-size:11px;color:var(--ink3);font-family:"IBM Plex Mono",monospace}
.pv-url i{width:7px;height:7px;border-radius:50%;background:#D4D1C7}
.mk{padding:14px;display:flex;flex-direction:column;gap:10px}
.mk-h{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:13px}
.mk-s{height:28px;border-radius:7px;background:#F1F0EC;font-size:11px;color:#6A6A71;display:flex;align-items:center;padding:0 10px}
.mk-g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pv-frame.app .mk-g{grid-template-columns:minmax(0,1fr)}
.mk-c{border:1px solid #E6E4DD;border-radius:8px;padding:9px;display:flex;flex-direction:column;gap:5px}
.mk-c b{font-size:11.5px}
.mk-c span{height:5px;border-radius:3px;background:#E9E7E1}
.mk-c span.s{width:60%}
.mk-tag{font-size:10px;color:#2531A8;background:#E8EAFB;border-radius:4px;padding:1px 5px;align-self:flex-start}
.mk-hero{border-radius:8px;background:#1B1C21;color:#fff;padding:18px 14px;font-size:15px;font-weight:700;line-height:1.35}
.mk-hero small{display:block;font-size:10.5px;font-weight:400;color:#B9B8B2;margin-top:6px}
.big-pv{background:#EDEBE5;border-radius:12px;padding:20px;display:flex;justify-content:center}
.docpv{background:#fff;border-radius:6px;box-shadow:0 2px 10px rgba(0,0,0,.08);padding:22px;width:100%;max-width:460px;display:flex;flex-direction:column;gap:10px}
.docpv h4{margin:0;font-size:17px}
.docpv p{margin:0;font-size:13.5px;line-height:1.6;color:var(--ink2)}
.pvmeta{font-size:12px;color:var(--ink3);font-family:"IBM Plex Mono",monospace}
.slidepv{background:#18191E;color:#fff;border-radius:6px;width:100%;max-width:460px;aspect-ratio:16/9;padding:18px;display:flex;flex-direction:column;justify-content:space-between}
.slidepv h4{margin:0;font-size:16px}
.slidepv p{margin:0;font-size:12px;color:#C9C8C2;line-height:1.5}
.dsnpv{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:460px}
.dsnpv figure{margin:0;display:flex;flex-direction:column;gap:6px}
.dsnpv figcaption{font-size:12.5px;font-weight:600;color:var(--ink2)}
.dsnpv .fr{background:#fff;border-radius:6px;box-shadow:0 2px 10px rgba(0,0,0,.08);aspect-ratio:3/4;padding:10px;display:flex;flex-direction:column;gap:6px}
.dsnpv .fr i{height:6px;border-radius:3px;background:#E3E1DA}
.dsnpv .fr i.blk{height:40%;background:#2B2C32}
.dsnpv .fr .gr{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:5px}
.dsnpv .fr .gr i{height:auto;background:#D9D6CD}
.vlist{border:1px solid var(--ln);border-radius:11px}
.vi{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--ln)}
.vi:last-child{border-bottom:0}
.vi.cur{background:#F4F5FD}
.vi .vn{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:14px}
.vi .vt{font-size:13.5px;font-weight:500;line-height:1.45}
.vi .vs{font-size:12px;color:var(--ink3);margin-top:2px}
.curb{font-size:12px;font-weight:700;color:var(--acc)}
.reqs{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.req{display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-size:13.5px;border:1px solid var(--ln);border-radius:9px;padding:10px 12px}
.req small{font-size:12px;color:var(--ink3);white-space:nowrap}
.flrow{grid-template-columns:minmax(0,1.6fr) 90px 110px 110px 84px}
.term-h{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink3);margin-bottom:8px;gap:8px;flex-wrap:wrap}
.term{background:#111215;color:#D8D7D1;border-radius:11px;padding:14px 16px;font-family:"IBM Plex Mono",monospace;font-size:12.5px;line-height:1.75;overflow-x:auto}
.term .ln{display:flex;gap:14px;white-space:pre}
.term .ts{color:#86857F;flex:none}
.term .cmd{color:#A7BCFF}
.term .ok{color:#83D8A0}
.term .warn{color:#F2C86F}
.term .err{color:#FF978A}
.rnrow{grid-template-columns:56px 48px 100px minmax(0,1.3fr) minmax(0,1.3fr)}
.cprow{padding:12px 20px;border-bottom:1px solid var(--ln)}
.cprow:last-child{border-bottom:0}
.cprow .t{font-size:14px;font-weight:500;line-height:1.5}
.horow{padding:13px 20px;border-bottom:1px solid var(--ln);display:flex;flex-direction:column;gap:4px}
.horow:last-child{border-bottom:0}
.ho-m{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13.5px;flex-wrap:wrap}
.pnote{padding:14px 20px}
.vrow{grid-template-columns:36px minmax(0,1.4fr) minmax(0,1.6fr) 84px 120px;scroll-margin-top:90px}
.vrow.hl{background:#FFF6DB;outline:2px solid #E0B454;outline-offset:-2px}
.vrow .ev{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--ink2);overflow-wrap:anywhere}
.vrow .ev.none-t{color:var(--ink3)}
.setgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.is-narrow .setgrid,.is-mid .setgrid{grid-template-columns:minmax(0,1fr)}
.stack{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.stack > .callout,.stack > .kv,.stack > .tbl{align-self:stretch}
.olist{margin:0 0 4px;padding-left:20px;font-size:14px;line-height:1.7}
.tprow{grid-template-columns:minmax(0,1.3fr) minmax(0,1.2fr) minmax(0,1.5fr)}

/* 반복 목표·도구 */
.rlist{display:flex;flex-direction:column;gap:12px}
.rcard{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.6fr) minmax(0,1fr) minmax(0,1.4fr);gap:20px;align-items:start;text-align:left;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:18px 20px;width:100%}
.rcard:hover{border-color:var(--ln2);box-shadow:0 6px 18px rgba(20,20,25,.07)}
.is-narrow .rcard,.is-mid .rcard{grid-template-columns:minmax(0,1fr);gap:12px}
.rc-k{font-size:12px;color:var(--ink3);font-weight:600;margin-bottom:4px}
.rc-v{font-size:14px;line-height:1.5}
.rc-next{font-family:"IBM Plex Mono",monospace;font-size:18px;font-weight:600}
.rc-name{font-size:16px;font-weight:700;margin-bottom:6px}

/* 상세 패널 */
.scrim{position:fixed;inset:0;background:rgba(20,20,26,.3);z-index:40;border:0;padding:0;cursor:default;width:100%}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--sf);z-index:41;display:flex;flex-direction:column;box-shadow:-14px 0 44px rgba(20,20,25,.18)}
.d-h{padding:16px 22px 14px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--ln)}
.is-narrow .d-h{padding:12px 16px}
.d-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.d-kind{font-size:12.5px;color:var(--ink3);font-weight:600;display:flex;align-items:center;gap:6px}
.x{width:42px;height:42px;border-radius:9px;border:1px solid var(--ln2);background:var(--sf);display:grid;place-items:center;flex:none}
.x:hover{background:var(--sf2)}
.d-title{margin:0;font-size:21px;font-weight:700;letter-spacing:-.01em;line-height:1.35}
.d-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.d-b{flex:1;overflow:auto;padding:20px 22px 40px;display:flex;flex-direction:column;gap:22px}
.is-narrow .d-b{padding:16px 16px 40px}
.blk h3{margin:0 0 10px;font-size:13px;font-weight:700;color:var(--ink2)}
.evs{display:flex;flex-wrap:wrap;gap:6px}
.evc{font-size:12px;font-family:"IBM Plex Mono",monospace;color:var(--ink2);background:var(--sf2);border:1px solid var(--ln);border-radius:6px;padding:3px 7px}
.evc.ok{color:#166B34;border-color:#BCE0C7;background:#F0F9F2}
.evc.wait{color:#744C00;border-color:#ECD49A;background:#FDF7E7}
.clist{display:flex;flex-direction:column;border:1px solid var(--ln);border-radius:11px}
.ci{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--ln);font-size:14px}
.ci:last-child{border-bottom:0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:11px;font-size:13.5px;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100% - 32px);line-height:1.5}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div class="{{rootCls}}" style="--acc: {{accent}}">

<aside class="side" aria-label="주 메뉴">
  <div class="brand"><span class="logo">HQ</span><span><b>AGENT HQ</b><small>대장 전용 작업 공간</small></span></div>
  <nav class="nav">
    <sc-for list="{{navItems}}" as="n">
      <button class="{{n.cls}}" onClick="{{n.go}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{n.icon}}"></path></svg><span>{{n.l}}</span><sc-if value="{{n.hasCnt}}"><span class="cnt">{{n.cnt}}</span></sc-if></button>
    </sc-for>
  </nav>
  <div class="plist">
    <h4>프로젝트 작업실</h4>
    <sc-for list="{{sideProjects}}" as="sp"><button class="{{sp.cls}}" onClick="{{sp.go}}"><i class="{{sp.dot}}"></i><span>{{sp.name}}</span></button></sc-for>
  </div>
  <div class="ops">
    <h4>운영 규칙</h4>
    <div class="op"><span class="k">동시 실행 (전체 최대 2)</span><span class="v mono">{{running}} / 2<em>Claude Code {{runClaude}}/2 · Codex {{runCodex}}/1</em></span><div class="slots"><sc-for list="{{slots}}" as="sl"><i class="{{sl}}"></i></sc-for></div></div>
    <div class="op"><span class="k">조사 주기</span><span class="v">6시간마다<em>다음 18:00</em></span></div>
    <div class="op"><span class="k">개선 점검</span><span class="v">하루 1회<em>다음 09-29 03:00</em></span></div>
  </div>
  <div class="side-note"><b>시안용 예시 데이터</b><br>진행률·사용량·활동·모델 설정은 모두 가상입니다. 실제 계정이나 에이전트와 연결되어 있지 않습니다.</div>
</aside>

<div class="main">
  <header class="top">
    <div class="m-brand"><span class="logo">HQ</span>AGENT HQ</div>
    <div class="search">
      <label class="sr" for="hq-search">프로젝트·팀·결과물·도구 검색</label>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <input id="hq-search" type="search" placeholder="프로젝트, 팀, 결과물, 스킬·MCP 검색" value="{{q}}" onChange="{{onQ}}" autocomplete="off">
      <sc-if value="{{hasQ}}">
        <div class="results">
          <sc-for list="{{results}}" as="r"><button class="res" onClick="{{r.open}}"><span><b>{{r.label}}</b><small>{{r.sub}}</small></span><span class="kind">{{r.kind}}</span></button></sc-for>
          <sc-if value="{{noResults}}"><div class="res-empty">‘{{q}}’와 일치하는 항목이 없습니다.</div></sc-if>
        </div>
      </sc-if>
    </div>
    <span class="sample"><i></i>시안용 예시 데이터</span>
    <div class="me"><span class="av">대</span><span>대장</span></div>
  </header>
  <nav class="mnav" aria-label="보기 전환">

<!-- ============ 상황실 ============ -->
<sc-if value="{{vOverview}}">
    <div class="ph">
      <h1>대장, 확인할 항목이 <em>{{openCount}}건</em> 있습니다</h1>
      <p>상황실 · 9월 28일 (월) 14:32 기준 예시 시나리오. 프로젝트 상세는 프로젝트를 골랐을 때 작업실에서 보여줍니다.</p>
    </div>
    <div class="strip"><sc-for list="{{strip}}" as="sx"><span>{{sx.k}}<b class="mono">{{sx.v}}</b></span></sc-for></div>

    <section class="panel" aria-labelledby="inbox-h">
      <div class="pn-h"><h2 id="inbox-h">대장 확인함 <span class="{{openCls}}">{{openCount}}</span></h2><span class="aside">급한 순서 · 처리 버튼은 시안 동작만 합니다</span></div>
      <sc-for list="{{inboxShown}}" as="a">
        <div class="inb">
          <span class="{{a.tyCls}}">{{a.ty}}</span>
          <div>
            <button class="t" onClick="{{a.open}}">{{a.title}}</button>
            <div class="d">{{a.brief}}</div>
            <sc-if value="{{a.isOpen}}"><div class="acts"><sc-for list="{{a.acts}}" as="x"><button class="{{x.cls}}" onClick="{{x.go}}">{{x.l}}</button></sc-for><button class="btn" onClick="{{a.open}}">자세히</button></div></sc-if>
            <sc-if value="{{a.isDone}}"><div class="resolved"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M3.5 8.5l3 3 6-7"></path></svg>{{a.resText}} · 시안 처리</div></sc-if>
          </div>
        </div>
      </sc-for>
      <sc-if value="{{hasMoreInbox}}"><button class="more" aria-expanded="{{inboxAll}}" onClick="{{toggleInbox}}">{{inboxMoreL}}</button></sc-if>
    </section>

    <section>
      <div class="sec-h"><h2>진행 중 프로젝트<span class="ex">예시</span></h2><button class="lnk" onClick="{{goProjects}}">전체 프로젝트 보기 →</button></div>
      <div class="panel">
        <sc-for list="{{activeProjects}}" as="p">
          <button class="orow" onClick="{{p.open}}">
            <div><div class="p-name">{{p.name}}</div><div class="o-next">다음 · {{p.next}}</div></div>
            <div class="crit"><div class="n">{{p.ok}}<small> / {{p.all}}</small></div><div class="s">검증 통과</div></div>
            <span class="{{p.stCls}}">{{p.stL}}</span>
          </button>
        </sc-for>
      </div>
    </section>

    <section>
      <div class="sec-h"><h2>사용량 · 잔여율<span class="ex">예시</span></h2><button class="lnk" onClick="{{goUsage}}">공급자 원래 표시·상세 →</button></div>
      <div class="ugrid">
        <sc-for list="{{accounts}}" as="ac">
          <div class="panel ucard">
            <div class="acct-h"><b>{{ac.name}}</b><span class="{{ac.stCls}}">{{ac.stL}}</span></div>
            <div class="minis">
              <sc-for list="{{ac.all}}" as="m">
                <div class="{{m.miniCls}}">
                  <div class="m-top"><span class="k">{{m.k}}</span><span class="{{m.vCls}}">{{m.vTxt}}</span></div>
                  <div class="{{m.barCls}}"><i style="width: {{m.pct}}%"></i><span class="th" style="left: {{m.th}}%"></span></div>
                  <div class="m-meta">{{m.short}}</div>
                </div>
              </sc-for>
            </div>
          </div>
        </sc-for>
      </div>
    </section>

    <section>
      <div class="sec-h"><h2>팀 요약<span class="ex">예시</span></h2><div class="legend"><sc-for list="{{legend}}" as="lg"><span class="{{lg.c}}">{{lg.l}}</span></sc-for></div></div>
      <div class="tgrid">
        <sc-for list="{{teams}}" as="t">
          <button class="{{t.cls}}" onClick="{{t.open}}">
            <div class="t-h"><span class="t-name">{{t.name}}</span><span class="{{t.stCls}}">{{t.stL}}</span></div>
            <dl class="kv">
              <dt>프로젝트</dt><dd>{{t.projName}}</dd>
              <dt>현재 작업</dt><dd>{{t.task}}</dd>
              <dt>막힌 이유</dt><dd class="{{t.blockCls}}">{{t.blockTxt}}</dd>
              <dt>다음 행동</dt><dd>{{t.next}}</dd>
            </dl>
          </button>
        </sc-for>
      </div>
    </section>
</sc-if>

<!-- ============ 프로젝트 목록 ============ -->
<sc-if value="{{vProjects}}">
    <div class="ph-row">
      <div class="ph"><h1>프로젝트</h1><p>목표·상태·담당 팀·검증된 완료 조건·막힌 이유·다음 행동. 행을 누르면 프로젝트 작업실로 이동합니다.</p></div>
      <button class="btn pri" onClick="{{openNew}}">＋ 새 프로젝트</button>
    </div>
    <div class="pbar">
      <label class="sr" for="p-search">프로젝트 검색</label>
      <input class="pinput" id="p-search" type="search" placeholder="프로젝트 이름·목표·팀 검색" value="{{pq}}" onChange="{{onPq}}" autocomplete="off">
      <div class="filters" role="group" aria-label="상태 필터"><sc-for list="{{filters}}" as="f"><button class="{{f.cls}}" aria-pressed="{{f.on}}" onClick="{{f.go}}">{{f.l}} <span class="mono">{{f.n}}</span></button></sc-for></div>
    </div>
    <div class="tbl">
      <div class="row plrow head"><span>프로젝트 · 목표</span><span>상태</span><span>담당 팀</span><span>검증 통과</span><span>막힌 이유</span><span>다음 행동</span></div>
      <sc-for list="{{plist}}" as="p">
        <button class="row plrow" onClick="{{p.open}}">
          <span class="wide"><span class="p-name">{{p.name}}</span><span class="p-goal">{{p.goal}}</span></span>
          <span><span class="cl">상태</span><span class="{{p.stCls}}">{{p.stL}}</span></span>
          <span><span class="cl">담당 팀</span>{{p.teamNames}}</span>
          <span class="crit"><span class="cl">검증 통과</span><span class="n">{{p.ok}}<small> / {{p.all}}</small></span></span>
          <span class="{{p.blockCls}}"><span class="cl">막힌 이유</span>{{p.blockTxt}}</span>
          <span><span class="cl">다음 행동</span>{{p.next}}</span>
        </button>
      </sc-for>
      <sc-if value="{{plistEmpty}}"><div class="res-empty">조건에 맞는 프로젝트가 없습니다.</div></sc-if>
    </div>
</sc-if>

<!-- ============ 프로젝트 작업실 ============ -->
<sc-if value="{{vProject}}">
    <div class="crumb"><button class="lnk" onClick="{{goProjects}}">프로젝트</button><span>/</span><span>{{w.name}}</span></div>
    <div class="ws-head">
      <div>
        <div class="ws-title"><h1>{{w.name}}</h1><span class="{{w.stCls}}">{{w.stL}}</span><span class="cyc">{{w.cycle}}</span></div>
        <p class="ws-goal">{{w.goal}}</p>
      </div>
      <sc-if value="{{w.canPause}}"><button class="{{w.pauseCls}}" onClick="{{w.togglePause}}">{{w.pauseL}}</button></sc-if>
    </div>
    <div class="ws-switch" role="group" aria-label="프로젝트 전환"><span class="k">프로젝트 전환</span><sc-for list="{{switcher}}" as="sw"><button class="{{sw.cls}}" aria-pressed="{{sw.on}}" onClick="{{sw.go}}"><i class="{{sw.dot}}"></i>{{sw.name}}</button></sc-for></div>
    <div class="wtabs" role="tablist" aria-label="작업실 탭"><sc-for list="{{wtabs}}" as="tb"><button class="{{tb.cls}}" role="tab" aria-selected="{{tb.on}}" onClick="{{tb.go}}">{{tb.l}}<sc-if value="{{tb.hasN}}"><span class="tn">{{tb.n}}</span></sc-if></button></sc-for></div>

    <!-- 개요 -->
    <sc-if value="{{wt.over}}">
      <div class="wgrid">
        <div class="col">
          <sc-if value="{{w.isPaused}}"><div class="callout info">일시정지됨 · 새 회차를 시작하지 않습니다 (시안)</div></sc-if>
          <sc-if value="{{w.hasBlock}}"><div class="callout warn">막힌 이유 · {{w.block}}</div></sc-if>
          <section class="panel pad"><h3 class="h3">다음 행동</h3><p class="goal">{{w.next}}</p></section>
          <section class="panel pad"><h3 class="h3">진행 단계 · {{w.cycle}}</h3><div class="steps"><sc-for list="{{w.stages}}" as="sg"><div class="{{sg.cls}}"><i></i>{{sg.l}}</div></sc-for></div></section>
          <section class="panel pad">
            <div class="h3row"><h3 class="h3">검증 요약</h3><button class="lnk" onClick="{{goVerify}}">검증 근거 보기 →</button></div>
            <div class="vsum"><span><b>{{w.pass}}</b>통과</span><span><b>{{w.fail}}</b>미통과</span><span><b>{{w.none}}</b>미검증</span><span class="s">완료 조건 {{w.all}}개 중</span></div>
          </section>
        </div>
        <div class="col">
          <section class="panel pad"><h3 class="h3">참여 팀 · 실행 도구 · 모델</h3>
            <sc-for list="{{w.teams}}" as="tm"><button class="trow" onClick="{{tm.open}}"><span class="asg">{{tm.assign}}</span><span class="{{tm.stCls}}">{{tm.stL}}</span></button></sc-for>
            <sc-if value="{{w.noTeams}}"><div class="s">아직 배정된 팀이 없습니다.</div></sc-if>
          </section>
          <section class="panel pad"><h3 class="h3">작업 폴더</h3><div class="mono path">projects/{{w.slug}}</div><div class="s">이 작업실의 작업·대화·파일·터미널·로그는 이 폴더와 프로젝트 기준으로만 표시됩니다 (예시).</div></section>
        </div>
      </div>
    </sc-if>

    <!-- 작업·팀 -->
    <sc-if value="{{wt.tasks}}">
      <section class="tbl">
        <div class="pn-h"><h2>작업</h2><span class="aside">{{w.name}} · 예시</span></div>
        <div class="row tkrow head"><span>작업</span><span>팀 · 실행 도구 · 모델</span><span>상태</span><span>막힌 이유</span></div>
        <sc-for list="{{w.tasks}}" as="tk">
          <div class="row tkrow"><span class="tk-t wide">{{tk.t}}</span><span class="asg"><span class="cl">담당</span>{{tk.assign}}</span><span><span class="{{tk.stCls}}">{{tk.stL}}</span></span><span class="{{tk.blockCls}}"><span class="cl">막힌 이유</span>{{tk.blockTxt}}</span></div>
        </sc-for>
        <sc-if value="{{w.noTasks}}"><div class="pnote s">진행 중인 작업이 없습니다.</div></sc-if>
      </section>
      <section class="panel">
        <div class="pn-h"><h2>프로젝트 대화</h2><span class="aside">{{w.name}} 전용 · 예시</span></div>
        <div class="chat">
          <sc-for list="{{w.chat}}" as="mg"><div class="{{mg.cls}}"><div class="m-by">{{mg.by}} · <span class="mono">{{mg.at}}</span></div><div class="m-t">{{mg.t}}</div></div></sc-for>
          <sc-if value="{{w.noChat}}"><div class="s">아직 대화가 없습니다.</div></sc-if>
        </div>
        <div class="form chat-form">
          <label for="chat-in">{{w.name}}에 보낼 메시지</label>
          <textarea id="chat-in" placeholder="예: 모바일 수정이 끝나면 알려줘" value="{{chatDraft}}" onChange="{{onChat}}"></textarea>
          <div class="form-row"><small>이 프로젝트 대화에만 기록됩니다. 실제 에이전트에는 전달되지 않습니다 (시안)</small><button class="btn pri" onClick="{{sendChat}}">보내기</button></div>
        </div>
      </section>
    </sc-if>

    <!-- 결과물 -->
    <sc-if value="{{wt.arts}}">
      <div class="agrid">
        <sc-for list="{{w.arts}}" as="ar">
          <div class="{{ar.cls}}">
            <div class="thumb">
              <sc-if value="{{ar.isWeb}}"><div class="wthumb"><div class="u"></div><div class="b"><i></i><i></i><i></i><i></i></div></div></sc-if>
              <sc-if value="{{ar.isDoc}}"><div class="doc"><i class="h"></i><i></i><i></i><i class="s"></i><i></i><i class="s"></i></div></sc-if>
              <sc-if value="{{ar.isSlide}}"><div class="slide"><b>{{ar.name}}</b><div class="bars"><i style="height:40%"></i><i style="height:70%"></i><i style="height:55%"></i><i style="height:90%"></i></div></div></sc-if>
              <sc-if value="{{ar.isDesign}}"><div class="dsn"><div><i class="blk"></i><i></i><i></i></div><div><i></i><i class="blk"></i><i></i></div></div></sc-if>
            </div>
            <div class="a-body">
              <span class="a-name">{{ar.name}}</span>
              <span class="a-meta"><span class="vtag">{{ar.cur}}</span>{{ar.kindL}} · {{ar.team}}</span>
              <div class="acts"><button class="btn pri" onClick="{{ar.view}}">{{ar.viewL}}</button><button class="btn" onClick="{{ar.edit}}">수정 요청</button></div>
            </div>
          </div>
        </sc-for>
      </div>
      <sc-if value="{{w.noArts}}"><div class="empty">아직 결과물이 없습니다.</div></sc-if>

      <sc-if value="{{hasArt}}">
        <section class="panel" id="viewer" aria-label="결과물 보기">
          <div class="pn-h"><h2>{{av.name}} <span class="vtag">{{av.cur}}</span></h2><span class="aside">{{av.kindL}} · {{av.team}} · 예시 화면</span></div>
          <div class="vb">
            <sc-if value="{{av.isWeb}}">
              <div>
                <div class="pv-bar"><div class="seg" role="group" aria-label="미리보기 크기"><button class="{{pvWebCls}}" onClick="{{pvWeb}}">웹</button><button class="{{pvAppCls}}" onClick="{{pvApp}}">앱 (390)</button></div><span class="s">스테이징 미리보기 · 예시 화면</span></div>
                <div class="pv-stage"><div class="{{pvFrameCls}}">
                  <div class="pv-url"><i></i><i></i><i></i>{{av.url}}</div>
                  <sc-if value="{{av.pvHub}}"><div class="mk">
                    <div class="mk-h"><span>리서치 허브</span><span style="font-weight: 400; font-size: 11px; color: #6A6A71">주제 12 · 자료 318</span></div>
                    <div class="mk-s">‘에이전트 평가’ 관련 자료 찾기</div>
                    <div class="mk-g">
                      <div class="mk-c"><span class="mk-tag">요약 완료</span><b>에이전트 평가 지표 정리</b><span></span><span class="s"></span></div>
                      <div class="mk-c"><span class="mk-tag">연결 4</span><b>도구 호출 실패 사례</b><span></span><span class="s"></span></div>
                      <div class="mk-c"><span class="mk-tag">요약 완료</span><b>장기 작업 메모리 설계</b><span></span><span class="s"></span></div>
                      <div class="mk-c"><span class="mk-tag">검토 필요</span><b>PDF 표 추출 정확도</b><span></span><span class="s"></span></div>
                    </div>
                  </div></sc-if>
                  <sc-if value="{{av.pvPort}}"><div class="mk">
                    <div class="mk-h"><span>[이름] 포트폴리오</span><span style="font-weight: 400; font-size: 11px; color: #6A6A71">작업 · 소개 · 연락</span></div>
                    <div class="mk-hero">생각을 제품으로 옮기는 일<small>A안 · 편집형 레이아웃</small></div>
                    <div class="mk-g"><div class="mk-c"><b>프로젝트 1</b><span></span><span class="s"></span></div><div class="mk-c"><b>프로젝트 2</b><span></span><span class="s"></span></div></div>
                  </div></sc-if>
                </div></div>
              </div>
            </sc-if>
            <sc-if value="{{av.isFile}}">
              <div class="big-pv">
                <sc-if value="{{av.isDoc}}"><div class="docpv"><div class="pvmeta">{{av.cur}} · {{av.vDate}}</div><h4>{{av.head}}</h4><sc-for list="{{av.lines}}" as="li"><p>{{li.t}}</p></sc-for></div></sc-if>
                <sc-if value="{{av.isSlide}}"><div class="slidepv"><div><h4>{{av.head}}</h4><sc-for list="{{av.lines}}" as="li"><p>{{li.t}}</p></sc-for></div><div class="bars"><i style="height:40%"></i><i style="height:70%"></i><i style="height:55%"></i><i style="height:90%"></i><i style="height:65%"></i></div></div></sc-if>
                <sc-if value="{{av.isDesign}}"><div class="dsnpv"><figure><div class="fr"><i class="blk"></i><i></i><i style="width: 60%"></i></div><figcaption>A · 편집형</figcaption></figure><figure><div class="fr"><div class="gr"><i></i><i></i><i></i><i></i></div><i style="width: 70%"></i></div><figcaption>B · 그리드형</figcaption></figure></div></sc-if>
              </div>
            </sc-if>
            <div class="blk"><h3>관련 검증 근거</h3><div class="linkchips"><sc-for list="{{av.crit}}" as="c"><button class="lchip" onClick="{{c.go}}">{{c.l}}</button></sc-for></div></div>
            <sc-if value="{{av.hasVersions}}">
              <div class="blk"><h3>버전 기록</h3>
                <div class="vlist"><sc-for list="{{av.versions}}" as="v">
                  <div class="{{v.cls}}"><span class="vn">{{v.id}}</span><div><div class="vt">{{v.note}}</div><div class="vs">{{v.date}} · {{v.by}}</div></div>
                    <sc-if value="{{v.isCur}}"><span class="curb">현재</span></sc-if>
                    <sc-if value="{{v.canRevert}}"><button class="btn" onClick="{{v.revert}}">되돌리기</button></sc-if>
                  </div>
                </sc-for></div>
              </div>
            </sc-if>
            <div class="blk"><h3>수정 요청</h3>
              <div class="form">
                <label for="req-in">{{av.team}}에 보낼 요청</label>
                <textarea id="req-in" placeholder="예: 3장 수치에 출처 링크를 붙여줘" value="{{draft}}" onChange="{{onDraft}}"></textarea>
                <div class="form-row"><small>담당 팀 대기열에 ‘검토 대기’로 들어갑니다 (시안)</small><button class="btn pri" onClick="{{submitReq}}">요청 보내기</button></div>
              </div>
              <div class="reqs"><sc-for list="{{av.reqs}}" as="rq"><div class="req"><span>{{rq.t}}</span><small>{{rq.st}}</small></div></sc-for></div>
            </div>
          </div>
        </section>
      </sc-if>

      <section class="tbl">
        <div class="pn-h"><h2>파일</h2><span class="aside">projects/{{w.slug}} · 예시</span></div>
        <div class="row flrow head"><span>경로</span><span>변경</span><span>시각</span><span>작성</span><span></span></div>
        <sc-for list="{{w.files}}" as="fl">
          <div class="row flrow"><span class="mono wide">{{fl.p}}</span><span class="mono"><span class="cl">변경</span>{{fl.ch}}</span><span class="mono"><span class="cl">시각</span>{{fl.at}}</span><span><span class="cl">작성</span>{{fl.by}}</span><button class="btn" onClick="{{fl.open}}">열기</button></div>
        </sc-for>
        <sc-if value="{{w.noFiles}}"><div class="pnote s">파일이 없습니다.</div></sc-if>
      </section>
    </sc-if>

    <!-- 실행·로그 -->
    <sc-if value="{{wt.runs}}">
      <div class="wgrid">
        <div class="col">
          <section class="panel pad">
            <div class="term-h"><span>터미널 · projects/{{w.slug}}</span><span>예시 로그 · 실제 세션 아님</span></div>
            <div class="term"><sc-for list="{{w.log}}" as="ln"><div class="ln"><span class="ts">{{ln.ts}}</span><span class="{{ln.c}}">{{ln.tx}}</span></div></sc-for></div>
            <sc-if value="{{w.noLog}}"><div class="s" style="margin-top: 8px">아직 실행 기록이 없습니다.</div></sc-if>
          </section>
          <section class="tbl">
            <div class="pn-h"><h2>실행 회차</h2><span class="aside">모델은 실행 도구가 보고한 값만 표시</span></div>
            <div class="row rnrow head"><span>회차</span><span>시도</span><span>시작</span><span>실행 도구 · 모델</span><span>결과</span></div>
            <sc-for list="{{w.runs}}" as="rn">
              <div class="row rnrow"><span class="mono"><span class="cl">회차</span>{{rn.n}}</span><span class="mono"><span class="cl">시도</span>{{rn.a}}</span><span class="mono"><span class="cl">시작</span>{{rn.start}}</span><span class="asg"><span class="cl">실행 도구 · 모델</span>{{rn.tm}}</span><span><span class="{{rn.cls}}">{{rn.res}}</span></span></div>
            </sc-for>
            <sc-if value="{{w.noRuns}}"><div class="pnote s">실행 회차가 없습니다.</div></sc-if>
          </section>
        </div>
        <div class="col">
          <section class="panel">
            <div class="pn-h"><h2>체크포인트</h2></div>
            <sc-for list="{{w.cps}}" as="cp"><div class="cprow"><div class="s mono">{{cp.at}}</div><div class="t">{{cp.t}}</div><div class="s">다음 · {{cp.next}}</div></div></sc-for>
            <sc-if value="{{w.noCps}}"><div class="pnote s">체크포인트가 없습니다.</div></sc-if>
          </section>
          <section class="panel">
            <div class="pn-h"><h2>실행 도구·모델 교대 기록</h2></div>
            <sc-for list="{{w.handoffs}}" as="ho">
              <div class="horow"><div class="s mono">{{ho.at}}</div><div class="ho-m"><span class="asg">{{ho.from}}</span><span aria-hidden="true">→</span><span class="asg">{{ho.to}}</span></div><div class="s">사유 · {{ho.why}}</div><div class="s">전달 · {{ho.carried}}</div></div>
            </sc-for>
            <sc-if value="{{w.noHandoffs}}"><div class="pnote s">{{w.handoffNote}}</div></sc-if>
          </section>
        </div>
      </div>
    </sc-if>

    <!-- 검증 -->
    <sc-if value="{{wt.verify}}">
      <div class="vsum"><span><b>{{w.pass}}</b>통과</span><span><b>{{w.fail}}</b>미통과</span><span><b>{{w.none}}</b>미검증</span><span class="s">모든 조건이 근거와 함께 통과해야 완료로 판단합니다. 실행 도구의 자체 완료 보고는 근거로 보지 않습니다.</span></div>
      <div class="tbl">
        <div class="row vrow head"><span>#</span><span>완료 조건</span><span>근거</span><span>결과</span><span>검증 시각</span></div>
        <sc-for list="{{w.crit}}" as="c">
          <div class="{{c.rowCls}}" id="{{c.anchor}}"><span class="mono">{{c.i}}</span><span class="wide" style="font-weight: 500">{{c.t}}</span><span class="{{c.eCls}}"><span class="cl">근거</span>{{c.e}}</span><span><span class="{{c.rCls}}">{{c.rL}}</span></span><span class="mono"><span class="cl">검증 시각</span>{{c.at}}<span class="s" style="display: block">{{c.by}}</span></span></div>
        </sc-for>
      </div>
    </sc-if>

    <!-- 설정 -->
    <sc-if value="{{wt.settings}}">
      <div class="setgrid">
        <section class="panel pad"><div class="stack">
          <h3 class="h3">모델 기본 정책 <span class="ex">시안 · 엔진 미연결</span></h3>
          <div class="seg" role="group" aria-label="프로젝트 기본 모델 정책"><button class="{{m.autoCls}}" aria-pressed="{{m.isAuto}}" onClick="{{m.setAuto}}">자동 선택</button><button class="{{m.pinCls}}" aria-pressed="{{m.isPin}}" onClick="{{m.setPin}}">특정 모델 고정</button></div>
          <sc-if value="{{m.isAuto}}"><div class="callout info">승인된 기본 모델이 있으면 그 모델을, 없으면 실행 도구의 기본 모델을 씁니다. 지금은 승인된 기본 모델이 없어 모델은 ‘확인 필요’입니다.</div></sc-if>
          <sc-if value="{{m.isPin}}">
            <div class="callout warn">고정할 모델 · 확인 필요. 공식 지원과 이 계정의 사용 가능 여부를 확인하기 전에는 고를 수 없습니다. 고정 모델을 쓸 수 없으면 다른 모델로 바꾸지 않고 대기합니다.</div>
            <button class="{{m.fbCls}}" aria-pressed="{{m.fb}}" onClick="{{m.toggleFb}}">대체 모델 허용 · {{m.fbL}}</button>
          </sc-if>
          <dl class="kv"><dt>실행 중</dt><dd class="unk">확인 필요 · 실행 도구의 보고 없음</dd><dt>다음 회차</dt><dd>{{m.next}}</dd></dl>
          <div class="s">변경은 체크포인트 저장 후 다음 회차부터 적용됩니다. 설정만 바꿨다고 실행 중 모델이 바뀐 것으로 표시하지 않습니다.</div>
        </div></section>

        <section class="panel pad"><div class="stack">
          <h3 class="h3">작업별 예외 <span class="ex">시안</span></h3>
          <sc-if value="{{w.noTasks}}"><div class="s">작업이 없습니다.</div></sc-if>
          <div class="tbl">
            <sc-for list="{{w.taskPols}}" as="tp">
              <div class="row tprow"><span class="wide" style="font-weight: 600">{{tp.t}}</span><span class="asg">{{tp.assign}}</span>
                <span class="stack"><span class="seg" role="group" aria-label="작업 모델 정책"><button class="{{tp.inhCls}}" onClick="{{tp.setInherit}}">기본 정책 따름</button><button class="{{tp.pinCls}}" onClick="{{tp.setPin}}">모델 지정</button></span><sc-if value="{{tp.isPin}}"><span class="s warn-t">지정 모델 확인 필요 → 이 작업은 대기</span></sc-if></span>
              </div>
            </sc-for>
          </div>
        </div></section>

        <section class="panel pad"><div class="stack">
          <h3 class="h3">실행 도구·주기</h3>
          <dl class="kv"><dt>실행 도구</dt><dd>일반 작업 Claude Code · 중요·복잡한 변경 Codex (운영 기준)</dd><dt>동시 실행</dt><dd>전체 2 · Claude Code 2 · Codex 1</dd><dt>반복 주기</dt><dd>{{w.cadence}}</dd></dl>
        </div></section>

        <section class="panel pad"><div class="stack">
          <h3 class="h3">완료 조건</h3>
          <ol class="olist"><sc-for list="{{w.crit}}" as="c"><li>{{c.t}}</li></sc-for></ol>
          <button class="btn" onClick="{{editCrit}}">완료 조건 수정 (시안)</button>
        </div></section>

        <section class="panel pad"><div class="stack">
          <h3 class="h3">작업 폴더·권한</h3>
          <dl class="kv"><dt>폴더</dt><dd class="mono">projects/{{w.slug}}</dd><dt>외부 게시</dt><dd>대장 승인 필요</dd><dt>비밀정보</dt><dd>로그·체크포인트에 저장하지 않음</dd></dl>
        </div></section>

        <section class="panel pad"><div class="stack">
          <h3 class="h3">프로젝트 정리</h3>
          <div class="acts" style="margin-top: 0"><sc-if value="{{w.canPause}}"><button class="btn" onClick="{{w.togglePause}}">{{w.pauseL}}</button></sc-if><button class="btn" onClick="{{archive}}">보관 (시안)</button></div>
        </div></section>
      </div>
    </sc-if>
</sc-if>

<!-- ============ 결과물 (전체) ============ -->
<sc-if value="{{vArtifacts}}">
    <div class="ph"><h1>결과물</h1><p>모든 프로젝트의 결과물입니다. 보기를 누르면 해당 프로젝트 작업실의 결과물 탭으로 이동합니다.</p></div>
    <div class="agrid">
      <sc-for list="{{allArts}}" as="ar">
        <div class="acard">
          <div class="thumb">
            <sc-if value="{{ar.isWeb}}"><div class="wthumb"><div class="u"></div><div class="b"><i></i><i></i><i></i><i></i></div></div></sc-if>
            <sc-if value="{{ar.isDoc}}"><div class="doc"><i class="h"></i><i></i><i></i><i class="s"></i><i></i><i class="s"></i></div></sc-if>
            <sc-if value="{{ar.isSlide}}"><div class="slide"><b>{{ar.name}}</b><div class="bars"><i style="height:40%"></i><i style="height:70%"></i><i style="height:55%"></i><i style="height:90%"></i></div></div></sc-if>
            <sc-if value="{{ar.isDesign}}"><div class="dsn"><div><i class="blk"></i><i></i><i></i></div><div><i></i><i class="blk"></i><i></i></div></div></sc-if>
          </div>
          <div class="a-body">
            <span class="a-name">{{ar.name}}</span>
            <span class="a-meta"><span class="vtag">{{ar.cur}}</span>{{ar.kindL}} · {{ar.projName}}</span>
            <div class="acts"><button class="btn pri" onClick="{{ar.view}}">{{ar.viewL}}</button><button class="btn" onClick="{{ar.edit}}">수정 요청</button></div>
          </div>
        </div>
      </sc-for>
    </div>
</sc-if>

<!-- ============ 반복 목표 ============ -->
<sc-if value="{{vRecurring}}">
    <div class="ph"><h1>반복 목표</h1><p>주기마다 조사 → 실행 → 검증을 돌리는 목표입니다. 대기 중이면 이유를 함께 표시합니다.</p></div>
    <div class="rlist">
      <sc-for list="{{recs}}" as="rc">
        <button class="rcard" onClick="{{rc.open}}">
          <div><div class="rc-name">{{rc.name}}</div><span class="{{rc.stCls}}">{{rc.stL}}</span><div class="rc-v s" style="margin-top: 8px">{{rc.cadence}}</div></div>
          <div><div class="rc-k">이번 주기 결과 · {{rc.at}}</div><div class="rc-v">{{rc.result}}</div></div>
          <div><div class="rc-k">다음 실행</div><div class="rc-next">{{rc.next}}</div></div>
          <div><div class="rc-k">대기 이유</div><div class="rc-v">{{rc.wait}}</div></div>
        </button>
      </sc-for>
    </div>
</sc-if>

<!-- ============ 레지스트리 ============ -->
<sc-if value="{{vRegistry}}">
    <div class="ph"><h1>스킬 · 플러그인 · MCP</h1><p>팀이 쓰는 확장 도구의 출처·버전·권한과 보안팀·정책팀 검토 상태입니다. 이름과 버전은 예시입니다.</p></div>
    <div class="tbl">
      <div class="row regrow head"><span>이름</span><span>유형</span><span>출처</span><span>버전</span><span>권한</span><span>보안 검토</span><span>정책 검토</span></div>
      <sc-for list="{{tools}}" as="tl">
        <button class="row regrow" onClick="{{tl.open}}">
          <span class="r-name wide">{{tl.name}}<span class="r-sub" style="display: block">{{tl.note}}</span></span>
          <span><span class="cl">유형</span>{{tl.type}}</span>
          <span><span class="cl">출처</span>{{tl.src}}</span>
          <span class="mono"><span class="cl">버전</span>{{tl.ver}}</span>
          <span><span class="cl">권한</span>{{tl.perm}}</span>
          <span><span class="cl">보안 검토</span><span class="{{tl.secCls}}">{{tl.secL}}</span></span>
          <span><span class="cl">정책 검토</span><span class="{{tl.polCls}}">{{tl.polL}}</span></span>
        </button>
      </sc-for>
    </div>
</sc-if>

<!-- ============ 사용량 ============ -->
<sc-if value="{{vUsage}}">
    <div class="ph"><h1>사용량</h1><p>모든 한도를 잔여율로 통일해 보여줍니다. 계정 한도와 팀별 작업 사용량은 별개입니다. 모든 값은 시안용 예시입니다.</p></div>
    <div class="duo">
      <sc-for list="{{accounts}}" as="ac">
        <section class="panel">
          <div class="pn-h"><h2>{{ac.name}} 계정</h2><span class="{{ac.stCls}}">{{ac.stL}}</span></div>
          <div class="usage">
            <div class="meters">
              <sc-for list="{{ac.meters}}" as="m">
                <div class="{{m.cls}}">
                  <div class="m-top"><span class="k">{{m.k}}</span><span class="{{m.vCls}}">{{m.vTxt}}</span></div>
                  <div class="{{m.barCls}}"><i style="width: {{m.pct}}%"></i><span class="th" style="left: {{m.th}}%"></span></div>
                  <sc-if value="{{m.hit}}"><span class="m-flag">중단 기준 도달</span></sc-if>
                  <sc-if value="{{m.safe}}"><span class="m-ok">기준 이내</span></sc-if>
                  <sc-if value="{{m.unknown}}"><span class="m-unk">확인 불가 · 새 작업 배정 보류</span></sc-if>
                  <div class="m-meta">{{m.rule}}<br>초기화 <b>{{m.reset}}</b> · 조회 <b>{{m.checked}}</b></div>
                </div>
              </sc-for>
            </div>
            <sc-if value="{{ac.hasSub}}">
              <div class="submeter">
                <div class="subhead"><b>{{ac.sub.k}}</b><span class="subtag">전체 주간 한도에 포함된 모델별 상한</span></div>
                <div class="{{ac.sub.innerCls}}">
                  <div class="m-top"><span class="k">잔여율</span><span class="{{ac.sub.vCls}}">{{ac.sub.vTxt}}</span></div>
                  <div class="{{ac.sub.barCls}}"><i style="width: {{ac.sub.pct}}%"></i><span class="th" style="left: {{ac.sub.th}}%"></span></div>
                  <sc-if value="{{ac.sub.hit}}"><span class="m-flag">Fable 작업 중단</span></sc-if>
                  <sc-if value="{{ac.sub.safe}}"><span class="m-ok">기준 이내</span></sc-if>
                  <div class="m-meta">{{ac.sub.rule}}<br>초기화 <b>{{ac.sub.reset}}</b> · 조회 <b>{{ac.sub.checked}}</b></div>
                </div>
                <div class="u-note">Fable 사용분은 전체 주간 한도에서도 함께 차감됩니다. 추가로 주어지는 사용량이 아닙니다.</div>
              </div>
            </sc-if>
            <div class="swap">{{ac.note}}</div>
          </div>
        </section>
      </sc-for>
    </div>
    <div class="rules">
      <div class="rule"><b>5시간 한도</b>잔여 3% 미만이면 새 작업을 멈추고 ‘한도 대기’로 표시합니다.</div>
      <div class="rule"><b>주간 한도</b>잔여 10% 이하이면 새 작업을 멈춥니다. Fable 상한에도 같은 기준을 적용합니다.</div>
      <div class="rule"><b>값이 없을 때</b>0%로 처리하지 않고 ‘확인 불가’로 표시하며, 추정하지 않습니다. 확인되지 않은 계정에는 새 작업을 배정하지 않습니다.</div>
    </div>
    <section>
      <div class="sec-h"><h2>공급자 원래 표시<span class="ex">예시</span></h2><span class="aside">공급자 화면의 표시 방식 그대로 · 잔여율 환산과 함께</span></div>
      <div class="tbl">
        <div class="row rawrow head"><span>계정</span><span>구간</span><span>공급자 원래 표시</span><span>잔여율</span><span>중단 기준</span><span>상태</span></div>
        <sc-for list="{{rawRows}}" as="rr">
          <div class="row rawrow"><span style="font-weight: 600">{{rr.acct}}</span><span>{{rr.k}}</span><span class="mono"><span class="cl">공급자 원래 표시</span>{{rr.raw}}</span><span class="mono"><span class="cl">잔여율</span>{{rr.rem}}</span><span><span class="cl">중단 기준</span>{{rr.rule}}</span><span><span class="{{rr.stCls}}">{{rr.stL}}</span></span></div>
        </sc-for>
      </div>
    </section>
    <section>
      <div class="sec-h"><h2>팀별 작업 사용량<span class="ex">예시 추정치</span></h2><span class="aside">이번 주 작업 시간 · 계정 한도 비율이 아님</span></div>
      <div class="tbl">
        <div class="row urow head"><span>팀</span><span>실행 도구 · 모델</span><span>작업 시간 비중</span><span>시간</span></div>
        <sc-for list="{{teamUse}}" as="u">
          <div class="row urow"><span style="font-weight: 600">{{u.name}}</span><span class="asg">{{u.tm}}</span><div class="ubar wide"><i style="width: {{u.pct}}%"></i></div><span class="mono">{{u.h}}h</span></div>
        </sc-for>
      </div>
    </section>
</sc-if>

  </div>
</div>

<!-- ============ 상세 패널 ============ -->
<sc-if value="{{hasSel}}">
  <button class="scrim" aria-label="상세 패널 닫기" onClick="{{close}}"></button>
  <aside class="drawer" role="dialog" aria-modal="true" aria-label="{{d.title}}">
    <div class="d-h">
      <div class="d-top"><span class="d-kind">{{d.kind}}<span class="ex" style="margin-left: 2px">예시</span></span><button class="x" aria-label="닫기" onClick="{{close}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div>
      <h2 class="d-title">{{d.title}}</h2>
      <div class="d-meta"><sc-if value="{{d.hasSt}}"><span class="{{d.stCls}}">{{d.stL}}</span></sc-if><sc-if value="{{d.hasAssign}}"><span class="asg">{{d.assign}}</span></sc-if></div>
    </div>
    <div class="d-b">

      <sc-if value="{{isTeam}}">
        <div class="blk"><h3>담당 프로젝트</h3><button class="lchip" onClick="{{d.openProj}}">{{d.projName}} →</button></div>
        <div class="blk"><h3>현재 작업</h3><p class="goal">{{d.task}}</p></div>
        <div class="{{d.blockCallout}}">막힌 이유 · {{d.blockTxt}}</div>
        <div class="blk"><h3>다음 행동</h3><p class="goal" style="font-size: 15px">{{d.next}}</p></div>
        <div class="blk"><h3>팀 · 실행 도구 · 모델</h3><div class="callout info">{{d.name}}은(는) 역할 단위의 팀, {{d.tool}}은(는) 실행 도구, 모델은 그 도구가 실행하는 AI 모델입니다. 모델은 공식 지원과 이 계정의 사용 가능 여부를 확인하기 전까지 ‘확인 필요’로 표시하며 임의의 목록을 만들지 않습니다.</div></div>
        <div class="blk"><h3>이번 주 팀 작업 사용량 (예시 추정치)</h3><div class="rc-v"><span class="mono" style="font-size: 20px; font-weight: 600">{{d.hours}}h</span> · 계정 한도 비율과 별개</div></div>
        <div class="blk"><button class="btn" onClick="{{d.openLog}}">작업실에서 실행·로그 보기</button></div>
      </sc-if>

      <sc-if value="{{isAppr}}">
        <div class="blk"><h3>상황</h3><p class="goal" style="font-size: 15px">{{d.body}}</p></div>
        <div class="blk"><h3>판단 근거</h3><div class="evs"><sc-for list="{{d.ev}}" as="e"><span class="{{e.c}}">{{e.t}}</span></sc-for></div></div>
        <div class="blk"><h3>영향 범위</h3><p class="goal" style="font-size: 14px; color: #44444C">{{d.impact}}</p></div>
        <div class="blk"><h3>관련 프로젝트</h3><button class="lchip" onClick="{{d.openProj}}">{{d.projName}} 작업실 열기 →</button></div>
        <sc-if value="{{d.isOpen}}"><div class="acts"><sc-for list="{{d.acts}}" as="x"><button class="{{x.cls}}" onClick="{{x.go}}">{{x.l}}</button></sc-for></div></sc-if>
        <sc-if value="{{d.isDone}}"><div class="callout info">‘{{d.resText}}’로 처리했습니다. 시안이므로 실제 작업은 실행되지 않습니다.</div></sc-if>
      </sc-if>

      <sc-if value="{{isTool}}">
        <dl class="kv" style="grid-template-columns: 76px minmax(0,1fr); font-size: 14px">
          <dt>유형</dt><dd>{{d.type}}</dd><dt>출처</dt><dd>{{d.src}}</dd><dt>버전</dt><dd class="mono">{{d.ver}}</dd><dt>요청 권한</dt><dd>{{d.perm}}</dd><dt>사용 팀</dt><dd>{{d.used}}</dd>
        </dl>
        <div class="blk"><h3>보안 검토 · <span class="{{d.secCls}}">{{d.secL}}</span></h3><div class="clist"><sc-for list="{{d.secChecks}}" as="c"><div class="ci"><span>{{c.t}}</span><span class="{{c.cls}}">{{c.l}}</span></div></sc-for></div></div>
        <div class="blk"><h3>정책 검토 · <span class="{{d.polCls}}">{{d.polL}}</span></h3><div class="clist"><sc-for list="{{d.polChecks}}" as="c"><div class="ci"><span>{{c.t}}</span><span class="{{c.cls}}">{{c.l}}</span></div></sc-for></div></div>
      </sc-if>

// Minimal renderer for the design's template syntax: {{path}}, <sc-if value>, <sc-for list as>, on* handlers.
class DCLogic {
  constructor(props) { this.props = props; this.state = {}; }
  setState(patch) {
    Object.assign(this.state, typeof patch === 'function' ? patch(this.state, this.props) : patch);
    scheduleRender();
  }
}
const HOLE = /\{\{\s*([\w.$]+)\s*\}\}/g;
function lookup(path, vals, scope) {
  const [head, ...rest] = path.split('.');
  let v = Object.hasOwn(scope, head) ? scope[head] : vals[head];
  for (const k of rest) v = v == null ? undefined : v[k];
  return v;
}
const interp = (s, vals, scope) => s.replace(HOLE, (_, p) => { const v = lookup(p, vals, scope); return v == null ? '' : String(v); });
const exact = (s, vals, scope) => { const m = /^\s*\{\{\s*([\w.$]+)\s*\}\}\s*$/.exec(s || ''); return m ? lookup(m[1], vals, scope) : undefined; };
function build(nodes, parent, vals, scope) {
  for (const node of nodes) {
    if (node.nodeType === 3) { parent.appendChild(document.createTextNode(interp(node.data, vals, scope))); continue; }
    if (node.nodeType !== 1) continue;
    if (node.localName === 'sc-if') { if (exact(node.getAttribute('value'), vals, scope)) build(node.childNodes, parent, vals, scope); continue; }
    if (node.localName === 'sc-for') {
      const as = node.getAttribute('as');
      for (const item of exact(node.getAttribute('list'), vals, scope) || []) build(node.childNodes, parent, vals, { ...scope, [as]: item });
      continue;
    }
    const el = node.cloneNode(false);
    for (const { name, value } of [...node.attributes]) {
      if (name.startsWith('hint-')) { el.removeAttribute(name); continue; }
      if (name.startsWith('on')) {
        el.removeAttribute(name);
        const fn = exact(value, vals, scope), type = name.slice(2);
        if (typeof fn !== 'function') continue;
        if (type === 'change') {
          // Re-rendering mid-composition would break Hangul input, so wait for compositionend.
          el.addEventListener('input', e => { if (!e.isComposing) fn(e); });
          el.addEventListener('compositionend', fn);
        } else el.addEventListener(type, fn);
        continue;
      }
      if (value.includes('{{')) {
        const v = interp(value, vals, scope);
        el.setAttribute(name, v);
        if (name === 'value') el.value = v;
      }
    }
    build(node.childNodes, el, vals, scope);
    parent.appendChild(el);
  }
}

    // 사용량 원본: Claude는 사용률(used)로, Codex는 잔여율(left)로 제공된다고 가정한 예시. 화면은 잔여율로 통일한다.

  renderVals() {
    const s = this.state, D = this.D(), ST = D.ST, RVC = D.RVC, RV = D.RV, TOOL = D.TOOL;
    const narrow = !!this.props.forceNarrow || s.w < 900;
    const mid = !narrow && s.w < 1200;
    const P = D.projects.concat(s.extra);
    const projById = {}; P.forEach((p) => { projById[p.id] = p; });
    const teamById = {}; D.teams.forEach((t) => { teamById[t.id] = t; });
    const pst = (p) => (s.paused[p.id] ? 'paused' : p.status);
    const stOf = (k) => ST[k];
    const toolModel = (tool) => TOOL[tool] + ' · 확인 필요';

    const okOf = (p) => p.crit.filter((c) => c.r === 'pass').length;

      this.setState({ resolved: r });

    };
    const approvals = D.approvals.map((a) => {
      const res = s.resolved[a.id];
      return Object.assign({}, a, { isOpen: !res, isDone: !!res, resText: res || '', open: () => this.open('appr', a.id),
        acts: a.acts.map((x) => ({ l: x.l, cls: x.pri ? 'btn pri' : 'btn', go: resolve(a, x) })) });
    });
    const openCount = approvals.filter((a) => a.isOpen).length;
    const openFirst = approvals.filter((a) => a.isOpen).concat(approvals.filter((a) => a.isDone));
    const inboxShown = s.inboxAll ? openFirst : openFirst.slice(0, 3);

    // 실행 슬롯
    const running = D.teams.filter((t) => t.status === 'run');
    const runClaude = running.filter((t) => t.tool === 'claude-code').length;
    const runCodex = running.filter((t) => t.tool === 'codex').length;
    const queued = D.teams.filter((t) => t.status === 'queue').length;
    const limited = D.teams.filter((t) => t.status === 'limit').length;
    let critOk = 0, critAll = 0;
    P.forEach((p) => { critAll += p.crit.length; critOk += okOf(p); });

    // 사용량 (잔여율 통일)
    const meterOf = (m, src) => {
      const known = typeof m.raw === 'number';
      const rem = known ? (src === 'used' ? 100 - m.raw : m.raw) : null;
      const th = m.win === '5h' ? 3 : 10;
      const hit = known && (m.win === '5h' ? rem < 3 : rem <= 10);
      return { k: m.k + ' 잔여', vTxt: known ? rem + '%' : '확인 불가', vCls: known ? 'm-v' : 'm-v na', pct: known ? rem : 0, th: th,
        barCls: known ? 'bar' : 'bar unknown', hit: hit, safe: known && !hit, unknown: !known,
        cls: 'meter' + (hit ? ' hit' : ''), innerCls: hit ? 'hit' : '',
        rule: m.win === '5h' ? '잔여 3% 미만이면 중단' : '잔여 10% 이하이면 중단', reset: m.reset, checked: m.checked,

    };
    const accounts = D.accounts.map((a) => {
      const meters = a.meters.map((m) => meterOf(m, a.src));
      const sub = a.sub ? Object.assign(meterOf(a.sub, a.src), { k: a.sub.k + ' 상한' }) : null;
      const hit = meters.some((m) => m.hit), unknown = meters.some((m) => m.unknown);
      const all = meters.map((m) => Object.assign({}, m, { miniCls: 'mini' + (m.hit ? ' hit' : '') }));
      if (sub) all.push(Object.assign({}, sub, { k: 'Fable 잔여 (주간 포함)', miniCls: 'mini sub' + (sub.hit ? ' hit' : '') }));
      return { name: a.name, note: a.note, meters: meters, sub: sub, hasSub: !!sub, all: all,
        stL: hit ? '한도 대기' : (unknown ? '확인 불가 · 배정 보류' : '사용 가능'), stCls: hit ? 'st st-limit' : (unknown ? 'st st-queue' : 'st st-done') };
    });
    const rawRows = [];
    D.accounts.forEach((a) => {
      a.meters.concat(a.sub ? [a.sub] : []).forEach((m) => {
        const x = meterOf(m, a.src);
        rawRows.push({ acct: a.name, k: m.k, raw: x.raw, rem: x.vTxt, rule: x.rule, stL: x.stL, stCls: x.stCls });
      });
    });

    // 팀
    const teams = D.teams.map((t) => ({ name: t.name, task: t.task, next: t.next,
      projName: projById[t.proj].name, blockTxt: t.block || '없음', blockCls: t.block ? 'warn-t' : 'none-t',
      cls: 'tcard' + (t.status === 'stall' ? ' alert' : ''), stCls: stOf(t.status).c, stL: stOf(t.status).l, open: () => this.open('team', t.id) }));
    const legend = ['run', 'queue', 'limit', 'review', 'approve', 'stall', 'paused', 'done'].map((k) => ({ l: ST[k].l, c: ST[k].c }));
    const maxH = Math.max.apply(null, D.teams.map((t) => t.hours));
    const teamUse = D.teams.map((t) => ({ name: t.name, tm: toolModel(t.tool), h: t.hours.toFixed(1), pct: Math.round(t.hours / maxH * 100) }));

    // 프로젝트 목록
    const rowOf = (p) => {
      const k = pst(p);
      return { name: p.name, goal: p.goal, stCls: ST[k].c, stL: ST[k].l, ok: okOf(p), all: p.crit.length, next: p.next,
        teamNames: p.teams.length ? p.teams.map((id) => teamById[id].name).join(', ') : '미배정',
        blockTxt: p.block || '없음', blockCls: p.block ? 'warn-t' : 'none-t', open: () => this.openProject(p.id) };
    };
    const fdefs = [['all', '전체'], ['run', '실행 중'], ['queue', '실행 대기'], ['limit', '한도 대기'], ['wait', '승인·검토 대기'], ['stall', '정체 중단'], ['paused', '일시정지'], ['plan', '준비 중'], ['done', '검증 완료']];
    const matchF = (p, f) => f === 'all' || (f === 'wait' ? ['approve', 'review'].includes(pst(p)) : pst(p) === f);
    const filters = fdefs.map((f) => ({ id: f[0], l: f[1], n: P.filter((p) => matchF(p, f[0])).length }))
      .filter((f) => f.id === 'all' || f.n > 0 || s.pf === f.id)
      .map((f) => ({ l: f.l, n: f.n, on: s.pf === f.id, cls: 'fchip' + (s.pf === f.id ? ' on' : ''), go: () => this.setState({ pf: f.id }) }));
    const pq = s.pq.trim().toLowerCase();

      .map(rowOf);
    const activeProjects = P.filter((p) => p.status !== 'done').map(rowOf);

    // 사이드바
    const views = [
      { id: 'overview', l: '상황실', icon: 'M4 5h7v6H4zM13 5h7v4h-7zM13 11h7v8h-7zM4 13h7v6H4z', cnt: openCount, on: s.view === 'overview' },

    const slots = [runClaude + runCodex > 0 ? '' : 'off', runClaude + runCodex > 1 ? '' : 'off'];

    // 전역 검색
    const q = s.q.trim().toLowerCase();
    let results = [];

      P.forEach((p) => { if (has(p.name, p.goal)) results.push({ label: p.name, sub: ST[pst(p)].l + ' · ' + p.goal, kind: '프로젝트', open: () => this.openProject(p.id) }); });
      D.teams.forEach((t) => { if (has(t.name, t.task, TOOL[t.tool])) results.push({ label: t.name, sub: assignOf(t.id) + ' · ' + t.task, kind: '팀', open: () => this.open('team', t.id) }); });
      P.forEach((p) => p.arts.forEach((a) => { if (has(a.name)) results.push({ label: a.name, sub: p.name, kind: '결과물', open: () => this.showArt(p.id, a.id) }); }));
      D.tools.forEach((t) => { if (has(t.name, t.type, t.src)) results.push({ label: t.name, sub: t.type + ' · ' + t.src, kind: '도구', open: () => this.open('tool', t.id) }); });
      D.recs.forEach((r) => { if (has(r.name)) results.push({ label: r.name, sub: r.cadence, kind: '반복 목표', open: () => this.open('rec', r.id) }); });

    // 결과물 카드
