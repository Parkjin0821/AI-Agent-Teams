<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AGENT HQ</title>
<meta name="description" content="AI 팀이 프로젝트를 기획·개발·검증하며 진행하는 로컬 작업 공간">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111'/%3E%3Cpath d='M9 22V10h3v4.8h8V10h3v12h-3v-4.6h-8V22z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#FAFAFA;--surface:#FFFFFF;--subtle:#F4F4F5;--line:#E7E7EA;--line-strong:#D4D4D8;
  --text:#0A0A0B;--text-2:#52525B;--text-3:#71717A;--text-4:#A1A1AA;
  --accent:#2E5BFF;--accent-soft:#EEF2FF;--accent-ink:#1E3FCC;
  --run:#2E5BFF;--done:#15803D;--done-soft:#EDFAF1;--attn:#B45309;--attn-soft:#FFF7E8;--stop:#C2410C;--stop-soft:#FFF1EB;--idle:#A1A1AA;
  --r-sm:6px;--r:10px;--r-lg:14px;
  --shadow:0 1px 2px rgba(17,17,26,.04),0 4px 16px rgba(17,17,26,.04);
  --font:"Geist","Pretendard Variable",Pretendard,-apple-system,"Malgun Gothic",sans-serif;
  --mono:"Geist Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.skip{position:absolute;left:-999px;top:8px;background:var(--text);color:#fff;padding:8px 12px;border-radius:var(--r-sm);z-index:100}
.skip:focus{left:8px}

/* 상단 바 */
.top{position:sticky;top:0;z-index:20;background:rgba(250,250,250,.86);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1520px;margin:0 auto;padding:0 32px;height:64px;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:-.01em;font-size:14.5px;flex:none;border:0;background:none;padding:0}
.mark{width:24px;height:24px;border-radius:7px;background:var(--text);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700;font-family:var(--mono)}
.tabs-top{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs-top::-webkit-scrollbar{display:none}
.tt{border:0;background:none;padding:6px 10px;border-radius:var(--r-sm);color:var(--text-3);font-weight:500;white-space:nowrap;transition:color .15s,background .15s}
.tt:hover{color:var(--text);background:var(--subtle)}
.tt.on{color:var(--text);background:var(--subtle)}
.tt .n{margin-left:6px;font-family:var(--mono);font-size:11.5px;color:var(--attn);font-weight:600}
.top-r{justify-self:end;display:flex;align-items:center;gap:10px;flex:none}
.brand{justify-self:start}
@media(max-width:760px){.top-in{height:auto;min-height:64px;grid-template-columns:1fr auto;padding-top:12px!important;padding-bottom:8px!important}.tabs-top{grid-column:1 / -1;grid-row:2;justify-content:center;max-width:100%}.top-r{grid-column:2;grid-row:1}}
.mode{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;color:var(--text-2);padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);white-space:nowrap}
.mode i{width:7px;height:7px;border-radius:50%;background:var(--idle)}
.mode.real{color:var(--stop);border-color:#F5C9B5;background:var(--stop-soft)}
.mode.real i{background:var(--stop);box-shadow:0 0 0 3px rgba(194,65,12,.15)}
.mode.off{color:var(--text-3)}

/* 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 13px;border-radius:var(--r-sm);border:1px solid var(--line-strong);background:var(--surface);font-weight:500;font-size:13.5px;white-space:nowrap;transition:background .15s,border-color .15s,transform .08s}
.btn:hover{background:var(--subtle)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--text);border-color:var(--text);color:#fff}
.btn.pri:hover{background:#27272A}
.btn.danger{color:var(--stop);border-color:#F2C6B4}
.btn.danger:hover{background:var(--stop-soft)}
.btn.ghost{border-color:transparent;background:none;color:var(--text-2)}
.btn.ghost:hover{background:var(--subtle);color:var(--text)}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px}
.link{border:0;background:none;padding:0;color:var(--accent-ink);font-weight:500}
.link:hover{text-decoration:underline;text-underline-offset:3px}

/* 레이아웃 */
main{max-width:1520px;margin:0 auto;padding:36px 32px 96px}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:28px}
h1{margin:0;font-size:26px;line-height:1.25;letter-spacing:-.025em;font-weight:600;text-wrap:balance}
.lede{margin:6px 0 0;color:var(--text-3);max-width:62ch;text-wrap:pretty}
h2{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em}
.sec{margin-top:40px}
.sec:first-of-type{margin-top:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.sec-h .meta{font-size:12.5px;color:var(--text-3)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.muted{color:var(--text-3)}
.small{font-size:12.5px}
.hint{font-size:12.5px;color:var(--text-3);line-height:1.6}

/* 통계 */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.stat{padding:16px 20px;border-left:1px solid var(--line)}
.stat:first-child{border-left:0}
.stat .k{font-size:12.5px;color:var(--text-3)}
.stat .v{font-size:24px;font-weight:600;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.stat .v small{font-size:13px;color:var(--text-4);font-weight:500;margin-left:3px}
.stat.attn .v{color:var(--attn)}

/* 상태 표시 */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--text-2);white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--idle);flex:none}
.pill.run i{background:var(--run);box-shadow:0 0 0 3px rgba(46,91,255,.14);animation:pulse 1.8s ease-in-out infinite}
.pill.run{color:var(--accent-ink)}
.pill.wait i{background:var(--attn)}
.pill.attn{color:var(--attn)} .pill.attn i{background:var(--attn)}
.pill.stop{color:var(--stop)} .pill.stop i{background:var(--stop)}
.pill.done{color:var(--done)} .pill.done i{background:var(--done)}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(46,91,255,.06)}}
@media (prefers-reduced-motion:reduce){.pill.run i{animation:none}*{transition:none!important}}

/* 팀 흐름 */
.flow{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-4)}
.flow .s{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.flow .s b{width:6px;height:6px;border-radius:2px;background:var(--line-strong)}
.flow .s.on{color:var(--text);font-weight:600}
.flow .s.on b{background:var(--accent)}
.flow .sep{width:10px;height:1px;background:var(--line-strong)}
.flow-lg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.fstep{padding:14px 18px;border-left:1px solid var(--line);position:relative}
.fstep:first-child{border-left:0}
.fstep .t{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:600;font-size:13.5px}
.fstep .d{font-size:12.5px;color:var(--text-3);margin-top:3px}
.fstep.on{background:linear-gradient(180deg,var(--accent-soft),var(--surface) 70%)}
.fstep.on::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--accent)}
.fstep .tool{font-family:var(--mono);font-size:11.5px;color:var(--text-3);font-weight:400}

/* 목록 행 */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 200px 150px 88px 76px;gap:20px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:14px 20px;transition:background .12s}
.prow:first-child{border-top:0}
.prow:hover{background:#FCFCFD}
.prow .name{font-weight:600;font-size:14px;letter-spacing:-.005em;display:flex;align-items:center;gap:8px}
.prow .sub{display:block;font-size:13px;color:var(--text-3);margin-top:6px;white-space:normal;line-height:1.6}
.prow{grid-template-columns:minmax(0,1fr) auto auto auto!important;gap:24px!important;padding:20px!important}
.prow>.flow{display:none}
.prow .c{font-size:12.5px;color:var(--text-2);font-variant-numeric:tabular-nums}
.prow .c small{color:var(--text-4)}
.prow .when{font-size:12px;color:var(--text-4);text-align:right}
.kind{font-size:11px;font-weight:500;color:var(--text-3);border:1px solid var(--line);border-radius:4px;padding:0 5px;line-height:18px}

/* 확인함 */
.inbox{display:flex;flex-direction:column}
.item{padding:16px 20px;border-top:1px solid var(--line);display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px}
.item:first-child{border-top:0}
.ico{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--attn-soft);color:var(--attn)}
.ico.stop{background:var(--stop-soft);color:var(--stop)}
.ico.done{background:var(--done-soft);color:var(--done)}
.ico svg{width:15px;height:15px}
.item .t{font-weight:600;font-size:14px}
.item .t .proj{color:var(--text-3);font-weight:500}
.item .b{color:var(--text-2);margin-top:3px;max-width:72ch}
.item .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:flex-start}
.q{margin-top:8px;padding:10px 12px;border-radius:var(--r);background:var(--subtle);color:var(--text);max-width:72ch}
.ta{width:100%;min-height:68px;resize:vertical;border:1px solid var(--line-strong);border-radius:var(--r);padding:9px 11px;background:var(--surface);line-height:1.55;transition:border-color .15s,box-shadow .15s}
.ta:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(46,91,255,.12)}
.input{width:100%;height:36px;border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:0 11px;background:var(--surface);transition:border-color .15s,box-shadow .15s}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(46,91,255,.12)}
.ul{margin:8px 0 0;padding-left:18px;color:var(--text-2)}
.ul li{margin:2px 0}

/* 빈 화면 */
.empty{padding:48px 24px;text-align:center;color:var(--text-3)}
.empty .h{color:var(--text);font-weight:600;font-size:15px}
.empty p{margin:6px auto 16px;max-width:46ch}
.empty.sm{padding:22px 20px}
.offline{padding:12px 16px;border:1px solid #F2C6B4;background:var(--stop-soft);color:var(--stop);border-radius:var(--r);margin-bottom:20px;font-weight:500}

/* 팀 */
.teams{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding:14px}
.teams .team{border:1px solid var(--line)!important;border-radius:var(--r);background:var(--surface)}
.project-teams{margin:20px 0;overflow:hidden}
.project-team{display:grid;grid-template-columns:100px 90px minmax(0,1fr) minmax(160px,240px);gap:16px;align-items:start;padding:15px 20px;border-top:1px solid var(--line)}
.project-team:first-child{border-top:0}
.project-team details{grid-column:3 / -1;font-size:12px;color:var(--text-3)}
@media(max-width:760px){.prow{grid-template-columns:minmax(0,1fr) auto!important;gap:12px!important}.prow .when,.prow .c{display:none}.project-team{grid-template-columns:1fr auto}.project-team details{grid-column:1 / -1}main{padding-left:16px;padding-right:16px}}
.team{padding:18px 20px;border-left:1px solid var(--line)}
.team:nth-child(3n+1){border-left:0}
.team:nth-child(n+4){border-top:1px solid var(--line)}
.team .h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.team .nm{font-weight:600}
.team .role{font-size:12.5px;color:var(--text-3);margin-top:4px;min-height:40px}
.team dl{display:grid;grid-template-columns:64px minmax(0,1fr);gap:4px 10px;margin:12px 0 0;font-size:12.5px}
.team dt{color:var(--text-4)}
.team dd{margin:0;color:var(--text-2)}

/* 프로젝트 상세 */
.crumb{font-size:12.5px;color:var(--text-3);display:flex;gap:6px;align-items:center;margin-bottom:10px}
.ws-h{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap}
.ws-h .goal{margin:8px 0 0;color:var(--text-2);max-width:70ch}
.ws-h .acts{display:flex;gap:8px;flex:none}
.ptabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:28px 0 24px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.ptabs::-webkit-scrollbar{display:none}
.pt{border:0;background:none;padding:8px 4px;margin-right:14px;color:var(--text-3);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:color .15s}
.pt:hover{color:var(--text)}
.pt.on{color:var(--text);border-bottom-color:var(--text)}
.pt .n{font-family:var(--mono);font-size:11.5px;color:var(--text-4);margin-left:5px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:24px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:18px 20px}
.card.attn{border-color:#F3D9A8;background:linear-gradient(180deg,var(--attn-soft),var(--surface) 60%)}
.card.done{border-color:#BFE6CB;background:linear-gradient(180deg,var(--done-soft),var(--surface) 60%)}
.card.stop{border-color:#F2C6B4;background:linear-gradient(180deg,var(--stop-soft),var(--surface) 60%)}
.card .lbl{font-size:12px;font-weight:500;color:var(--text-3);margin-bottom:6px}
.card .big{font-size:15px;font-weight:500;line-height:1.6}
.answer{white-space:pre-wrap;color:var(--text-2);line-height:1.7;max-height:320px;overflow:auto}
.facts{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px 12px;margin:0;font-size:13px}
.facts dt{color:var(--text-3)}
.facts dd{margin:0;color:var(--text);min-width:0}
.bar{height:4px;border-radius:2px;background:var(--subtle);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--text)}
.crit{display:flex;flex-direction:column}
.cr{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:10px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
.cr:first-child{border-top:0;padding-top:2px}
.ck{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--line-strong);margin-top:2px;display:grid;place-items:center}
.ck.ok{background:var(--done);border-color:var(--done)}
.ck.no{border-color:var(--stop)}
.ck svg{width:10px;height:10px}
.cr .t{font-weight:500}
.cr .e{font-size:12.5px;color:var(--text-3);margin-top:2px}
.cr .e.ok{color:var(--done)}

/* 활동 */
.tl{display:flex;flex-direction:column}
.ev{display:grid;grid-template-columns:84px minmax(0,1fr);gap:16px;padding:16px 20px;border-top:1px solid var(--line)}
.ev:first-child{border-top:0}
.ev .when{font-size:12px;color:var(--text-4);padding-top:2px}
.ev .who{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:600}
.ev .who .tool{font-family:var(--mono);font-size:11.5px;color:var(--text-3);font-weight:400}
.ev .res{margin-top:3px;color:var(--text-2)}
details{margin-top:8px}
summary{cursor:pointer;color:var(--accent-ink);font-weight:500;font-size:12.5px;list-style:none;display:inline-flex;align-items:center;gap:4px}
summary::-webkit-details-marker{display:none}
summary::before{content:"";width:0;height:0;border-left:4px solid currentColor;border-top:4px solid transparent;border-bottom:4px solid transparent;transition:transform .15s}
details[open] summary::before{transform:rotate(90deg)}
.progs{display:grid;gap:0;margin-top:6px;border-top:1px solid var(--line)}
.prog{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.prog .kind{margin-left:6px}
.tchecks{display:grid;gap:6px;margin-top:8px}
.tcheck{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:baseline}
.tcheck details{grid-column:2}
@media (max-width:560px){.prog{grid-template-columns:minmax(0,1fr)}}
details .answer{margin-top:8px;padding:12px 14px;background:var(--subtle);border-radius:var(--r);font-size:13px}
.log{font-family:var(--mono);font-size:12px;color:var(--text-2);padding:14px 20px;line-height:1.9;max-height:360px;overflow:auto}
.log .ts{color:var(--text-4);margin-right:12px}

/* 표 형태 목록 (table 안에는 반복 태그를 넣을 수 없어 grid로 만든다) */
.urow{display:grid;grid-template-columns:minmax(0,1fr) 110px 150px 180px;gap:16px;align-items:center;padding:12px 20px;border-top:1px solid var(--line);font-size:13px;font-variant-numeric:tabular-nums}
.urow.head{border-top:0;font-size:12px;font-weight:500;color:var(--text-3);background:#FCFCFD;padding:10px 20px}
.urow.head + .urow{border-top:1px solid var(--line)}
@media (max-width:900px){.urow{grid-template-columns:minmax(0,1fr) auto}.urow.head{display:none}}

/* 연결 */
.erow{display:grid;grid-template-columns:minmax(0,1.4fr) 170px minmax(0,1fr) 150px;gap:18px;align-items:center;padding:16px 20px;border-top:1px solid var(--line)}
.erow:first-child{border-top:0}
.erow .nm{font-weight:600}
.erow .sub{font-size:12.5px;color:var(--text-3);margin-top:2px}
.erow .bill{font-size:12.5px;color:var(--text-2)}
.erow .act{display:flex;justify-content:flex-end;gap:8px;align-items:center}
.switch{position:relative;width:38px;height:22px;border-radius:999px;border:0;background:var(--line-strong);padding:0;transition:background .15s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .15s}
.switch.on{background:var(--done)}
.switch.on::after{transform:translateX(16px)}
.switch:disabled{opacity:.4;cursor:not-allowed}
.group-h{font-size:12px;font-weight:600;color:var(--text-3);margin:28px 0 10px;letter-spacing:.01em}
@media (max-width:900px){.erow{grid-template-columns:minmax(0,1fr) auto}.erow .bill{grid-column:1 / -1}}

/* 설정 */
.seg{display:inline-flex;padding:2px;border-radius:8px;background:var(--subtle);border:1px solid var(--line)}
.seg button{border:0;background:none;height:28px;padding:0 12px;border-radius:6px;color:var(--text-3);font-weight:500;font-size:13px;transition:background .15s,color .15s}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.row-f{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg.wrap{display:flex;flex-wrap:wrap;gap:2px}
/* 승인함·기억 */
.ib-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.ib-row:last-of-type{border-bottom:0}
.ib-row.col{grid-template-columns:minmax(0,1fr);gap:8px}
.ib-acts{justify-content:flex-end}
@media (max-width:760px){.ib-row{grid-template-columns:minmax(0,1fr)}.ib-acts{justify-content:flex-start}}
/* 프로젝트 대화 스레드 */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ws-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start;margin-top:4px}
.ws-grid .side{position:sticky;top:72px}
@media (max-width:960px){.ws-grid{grid-template-columns:minmax(0,1fr)}.ws-grid .side{position:static}}
.thread-wrap{background:var(--surface);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-height:420px}
.thread{display:flex;flex-direction:column;gap:12px;padding:20px;flex:1}
.msg{max-width:88%;border-radius:12px;padding:10px 14px;background:var(--subtle);border:1px solid transparent}
.msg .meta{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:4px}
.msg .meta .when{margin-left:auto}
.msg .body{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55}
.msg .tchecks{margin-top:8px}
.msg details{margin-top:6px}
.msg.me{align-self:flex-end;background:#EEF2FF;border-color:#DCE3FF}
.msg.me .meta b{color:#2E5BFF}
.msg.team{align-self:flex-start}
.msg.team.err{border-color:#F2C6B4;background:#FFF7F4}
.msg.sys{align-self:center;max-width:94%;background:none;border:1px dashed var(--line-strong);font-size:13px}
.msg.sys.stop{border-color:#F2B8A0;color:#9A3412;background:#FFF7F4}
.msg.action{align-self:stretch;max-width:none;background:var(--surface);border:1px solid var(--line-strong);box-shadow:0 1px 2px rgba(0,0,0,.04)}
.msg.action.attn{border-color:#F5C77E;background:#FFFBF0}
.msg.action.done{border-color:#A7D8B8;background:#F3FBF6}
.msg.action.stop{border-color:#F2B8A0;background:#FFF7F4}
.msg.action .row-f{margin-top:10px}
.msg.action .ul{margin:8px 0 0}
.msg.working{display:flex;gap:10px;align-items:center;color:var(--text-3)}
.dots{display:inline-flex;gap:3px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--text-3);animation:hq-dot 1.2s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes hq-dot{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none}}
.composer{border-top:1px solid var(--line);padding:14px 20px;display:grid;gap:8px;background:var(--surface);border-radius:0 0 14px 14px}
.composer .ta{min-height:64px}
.composer-row{justify-content:space-between}
.next{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:10px}
.next li{padding-left:14px;border-left:2px solid var(--line)}
.next li.now{border-left-color:#2E5BFF}
.next li.done{border-left-color:#16A34A}
.sentinel-row{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:baseline;margin-top:6px}
.tools-card summary{cursor:pointer;list-style:none}
.tools-card summary::-webkit-details-marker{display:none}
.tm-list{display:grid;border-top:1px solid var(--line)}
.tm-row{display:grid;grid-template-columns:180px minmax(0,1fr);gap:12px;padding:14px 0;border-bottom:1px solid var(--line);align-items:start}
.tm-head{display:grid;gap:4px;align-content:start}
.tm-head .kind{justify-self:start}
.tm-picks{display:grid;gap:8px;justify-items:start}
.project-settings{width:100%;max-width:none}
@media(min-width:1100px){.tm-row{grid-template-columns:220px minmax(0,1fr);gap:24px;padding:20px 0}.tm-picks{width:100%;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:20px;align-items:start}.tm-picks .seg{width:100%}.tm-picks .seg button{flex:1;height:34px}}
@media (max-width:640px){.tm-row{grid-template-columns:minmax(0,1fr)}}
.danger-zone{border-color:#F2C6B4}
.danger-zone .lbl{color:var(--stop)}

/* 슬라이드 패널 */
.scrim{position:fixed;inset:0;background:rgba(10,10,11,.28);z-index:40;border:0;padding:0;width:100%;cursor:default;animation:fade .15s ease-out}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--surface);z-index:41;display:flex;flex-direction:column;box-shadow:-24px 0 60px rgba(10,10,11,.12);animation:slide .22s cubic-bezier(.2,.8,.2,1)}
.sheet-h{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.sheet-b{padding:22px 24px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:18px}
.sheet-f{padding:16px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;background:#FCFCFD}
.field label{display:block;font-weight:500;font-size:13px;margin-bottom:6px}
.field .opt{color:var(--text-4);font-weight:400}
.field .hint{margin-top:6px}
.note{padding:12px 14px;border-radius:var(--r);background:var(--subtle);font-size:12.5px;color:var(--text-2);line-height:1.65}
.note b{color:var(--text)}
@keyframes fade{from{opacity:0}}
@keyframes slide{from{transform:translateX(24px);opacity:0}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 16px;border-radius:var(--r);font-size:13px;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.2);max-width:calc(100% - 32px);animation:fade .15s}

/* 반응형 */
@media (max-width:900px){
  .top-in{padding:0 16px;gap:12px}
  main{padding:24px 16px 80px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat:nth-child(3){border-left:0}
  .stat:nth-child(n+3){border-top:1px solid var(--line)}
  .prow{grid-template-columns:minmax(0,1fr) auto;gap:6px 12px}
  .prow .flow,.prow .when,.prow .c{grid-column:1 / -1}
  .prow .when{text-align:left}
  .teams,.flow-lg{grid-template-columns:minmax(0,1fr)}
  .team,.fstep{border-left:0;border-top:1px solid var(--line)}
  .team:first-child,.fstep:first-child{border-top:0}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .ev{grid-template-columns:minmax(0,1fr);gap:4px}
  .mode span{display:none}
  .brand .word{display:none}
}
</style>
</head>
<body>
<a class="skip" href="#main">본문으로 건너뛰기</a>
<div id="app"></div>
<template id="tpl">
<div style="--accent: {{accent}}">
<header class="top">
  <div class="top-in">
    <button class="brand" onClick="{{goHome}}" aria-label="홈으로"><span class="mark">HQ</span><span class="word">AGENT HQ</span></button>
    <nav class="tabs-top" aria-label="주 메뉴">
      <sc-for list="{{nav}}" as="n"><button class="{{n.cls}}" aria-current="{{n.cur}}" onClick="{{n.go}}">{{n.l}}<sc-if value="{{n.hasN}}"><span class="n">{{n.n}}</span></sc-if></button></sc-for>
    </nav>
    <div class="top-r">
      <sc-if value="{{notif.canAsk}}"><button class="btn ghost sm" onClick="{{notif.enable}}" title="질문·승인·완료·멈춤이 생기면 이 창을 보고 있지 않아도 알려 줍니다">알림 켜기</button></sc-if>
      <sc-if value="{{notif.on}}"><span class="small muted" title="이 브라우저 창이 열려 있는 동안 알려 줍니다">알림 켜짐</span></sc-if>
      <span class="{{modeCls}}" title="{{modeTitle}}"><i></i><span>{{modeL}}</span></span>
      <button class="btn pri sm" onClick="{{openNew}}">새 프로젝트</button>
    </div>
  </div>
</header>

<main id="main">
  <sc-if value="{{offline}}"><div class="offline" role="alert">엔진 서버에 연결할 수 없습니다. 서버가 켜져 있는지 확인해 주세요.</div></sc-if>

<!-- ================= 홈 ================= -->
<sc-if value="{{vHome}}">
  <div class="page-h">
    <div><h1>{{greeting}}</h1><p class="lede">{{homeLede}}</p></div>
  </div>

  <sc-if value="{{hasProjects}}">
    <section class="sec" aria-label="요약">
      <div class="stats">
        <div class="stat"><div class="k">진행 중</div><div class="v">{{st.active}}<small>개</small></div></div>
        <div class="{{st.attnCls}}"><div class="k">확인 필요</div><div class="v">{{st.inbox}}<small>건</small></div></div>
        <div class="stat"><div class="k">오늘 실행한 단계</div><div class="v">{{st.today}}<small>회</small></div></div>
        <div class="stat"><div class="k">완료</div><div class="v">{{st.done}}<small>개</small></div></div>
      </div>
    </section>

    <section class="sec" aria-labelledby="inbox-h">
      <div class="sec-h"><h2 id="inbox-h">확인 필요</h2><span class="meta">팀이 대장의 결정을 기다리는 일</span></div>
      <div class="list inbox">
        <sc-for list="{{inbox}}" as="it">
          <div class="item">
            <span class="{{it.icoCls}}" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{it.icon}}"></path></svg></span>
            <div>
              <div class="t">{{it.title}} <span class="proj">· {{it.project}}</span></div>
              <div class="b">{{it.body}}</div>
              <sc-if value="{{it.isQuestion}}">
                <div class="q">{{it.question}}</div>
                <div class="acts" style="flex-direction: column; align-items: stretch; max-width: 72ch">
                  <label class="hint" for="{{it.inputId}}">답변</label>
                  <textarea class="ta" id="{{it.inputId}}" placeholder="예: 결제 기능은 빼고 진행해" value="{{it.draft}}" onChange="{{it.onDraft}}"></textarea>
                  <div class="row-f"><button class="btn pri sm" onClick="{{it.send}}">답변 보내고 계속</button><button class="btn ghost sm" onClick="{{it.open}}">프로젝트 보기</button></div>
                </div>
              </sc-if>
              <sc-if value="{{it.isProposal}}">
                <ul class="ul"><sc-for list="{{it.items}}" as="x"><li>{{x}}</li></sc-for></ul>
                <div class="acts"><button class="btn pri sm" onClick="{{it.accept}}">승인하고 계속</button><button class="btn sm" onClick="{{it.dismiss}}">보류</button><button class="btn ghost sm" onClick="{{it.open}}">프로젝트 보기</button></div>
              </sc-if>
              <sc-if value="{{it.isIssue}}">
                <div class="acts"><sc-for list="{{it.actions}}" as="a"><button class="{{a.cls}}" onClick="{{a.go}}">{{a.l}}</button></sc-for></div>
              </sc-if>
            </div>
          </div>
        </sc-for>
        <sc-if value="{{inboxEmpty}}"><div class="empty sm">확인할 일이 없습니다. 팀이 결정을 기다리면 여기에 나타납니다.</div></sc-if>
      </div>
    </section>

    <section class="sec" aria-labelledby="proj-h">
      <div class="sec-h"><h2 id="proj-h">프로젝트</h2><button class="link small" onClick="{{goProjects}}">모두 보기</button></div>
      <div class="list">
        <sc-for list="{{homeProjects}}" as="p">
          <button class="prow" onClick="{{p.open}}">
            <span style="min-width: 0"><span class="name">{{p.name}}<sc-if value="{{p.single}}"><span class="kind">단일 실행</span></sc-if></span><span class="sub">{{p.sub}}</span></span>
            <span class="flow" aria-label="팀 흐름"><sc-for list="{{p.flow}}" as="f"><sc-if value="{{f.sep}}"><span class="sep"></span></sc-if><span class="{{f.cls}}"><b></b>{{f.l}}</span></sc-for></span>
            <span class="{{p.pillCls}}"><i></i>{{p.stL}}</span>
            <span class="c">{{p.proven}}<small>/{{p.total}} 조건</small></span>
            <span class="when">{{p.ago}}</span>
          </button>
        </sc-for>
      </div>
    </section>

    <section class="sec" aria-labelledby="team-h" hidden>
      <div class="sec-h"><h2 id="team-h">팀</h2><button class="link small" onClick="{{goTeams}}">자세히</button></div>
      <div class="panel teams">
        <sc-for list="{{teams}}" as="t">
          <div class="team">
            <div class="h"><span class="nm">{{t.name}}</span><span class="{{t.pillCls}}"><i></i>{{t.stL}}</span></div>
            <div class="role">{{t.now}}</div>
            <dl><dt>AI 모델 계열</dt><dd>{{t.family}}</dd><dt>실행 도구</dt><dd class="mono small">{{t.tool}}</dd><dt>확인된 모델</dt><dd class="mono small">{{t.model}}</dd><dt>오늘</dt><dd class="num">{{t.today}}회</dd></dl>
          </div>
        </sc-for>
      </div>
    </section>
  </sc-if>

  <sc-if value="{{noProjects}}">
    <div class="panel empty">
      <div class="h">첫 프로젝트를 만들어 보세요</div>
      <p>대화로 시작하세요. 팀이 검증 조건을 도출하고 작업·수정·검증을 이어갑니다.</p>
      <button class="btn pri" onClick="{{openNew}}">새 프로젝트</button>
    </div>
  </sc-if>
</sc-if>

<!-- ================= 프로젝트 목록 ================= -->
<sc-if value="{{vProjects}}">
  <div class="page-h">
    <div><h1>프로젝트</h1><p class="lede">각 프로젝트는 기획 → 개발 → 검증을 돌며 진행됩니다. 행을 누르면 상세로 이동합니다.</p></div>
    <button class="btn pri" onClick="{{openNew}}">새 프로젝트</button>
  </div>
  <div class="list">
    <sc-for list="{{allProjects}}" as="p">
      <button class="prow" onClick="{{p.open}}">
        <span style="min-width: 0"><span class="name">{{p.name}}<sc-if value="{{p.single}}"><span class="kind">단일 실행</span></sc-if></span><span class="sub">{{p.sub}}</span></span>
        <span class="flow" aria-label="팀 흐름"><sc-for list="{{p.flow}}" as="f"><sc-if value="{{f.sep}}"><span class="sep"></span></sc-if><span class="{{f.cls}}"><b></b>{{f.l}}</span></sc-for></span>
        <span class="{{p.pillCls}}"><i></i>{{p.stL}}</span>
        <span class="c">{{p.proven}}<small>/{{p.total}} 조건</small></span>
        <span class="when">{{p.ago}}</span>
      </button>
    </sc-for>
    <sc-if value="{{noProjects}}"><div class="empty"><div class="h">아직 프로젝트가 없습니다</div><p>새 프로젝트를 만들면 여기에 나타납니다.</p><button class="btn pri" onClick="{{openNew}}">새 프로젝트</button></div></sc-if>
  </div>
</sc-if>

<!-- ================= 프로젝트 상세 ================= -->
<sc-if value="{{vProject}}">
  <div class="crumb"><button class="link" onClick="{{goProjects}}">프로젝트</button><span aria-hidden="true">/</span><span>{{w.name}}</span></div>
  <div class="ws-h">
    <div style="min-width: 0">
      <div class="row-f"><h1>{{w.name}}</h1><span class="{{w.pillCls}}"><i></i>{{w.stL}}</span></div>
      <p class="goal">{{w.objective}}</p>
      <sc-if value="{{criteriaPending}}"><button class="btn pri" onClick="{{approveCriteria}}">완료 조건 확인·승인</button></sc-if>
    </div>
    <div class="acts">
      <sc-if value="{{w.canStart}}"><button class="btn pri" onClick="{{w.start}}">{{w.startL}}</button></sc-if>
      <sc-if value="{{w.canStop}}"><button class="btn" onClick="{{w.stop}}">멈춤</button></sc-if>
      <sc-if value="{{w.canRunOnce}}"><button class="btn pri" onClick="{{w.runOnce}}">실행 1회</button></sc-if>
    </div>
  </div>

  <nav class="ptabs" aria-label="프로젝트 탭"><sc-for list="{{ptabs}}" as="tb"><button class="{{tb.cls}}" aria-current="{{tb.cur}}" onClick="{{tb.go}}">{{tb.l}}<sc-if value="{{tb.hasN}}"><span class="n">{{tb.n}}</span></sc-if></button></sc-for></nav>

  <!-- 개요 · 대화 스레드 (메타 뮤즈 방식: 대화·진행·승인이 한 흐름, 오른쪽에 계획과 할 일) -->
  <sc-if value="{{pt.over}}">
    <div class="ws-grid">
      <section class="thread-wrap" aria-label="프로젝트 대화">
        <div class="thread" role="log" aria-live="polite">
          <sc-for list="{{w.thread}}" as="x">
            <div class="{{x.cls}}">
              <div class="meta"><b>{{x.who}}</b><span class="small muted">{{x.sub}}</span><span class="small muted when">{{x.when}}</span></div>
              <div class="body">{{x.text}}</div>
              <sc-if value="{{x.hasTools}}"><div class="tchecks"><sc-for list="{{x.tools}}" as="k"><div class="tcheck"><span class="{{k.pillCls}}"><i></i>{{k.stL}}</span><span class="small"><b>{{k.name}}</b> · {{k.summary}}</span><sc-if value="{{k.hasDetails}}"><details><summary>자세히</summary><div class="answer">{{k.details}}</div></details></sc-if></div></sc-for></div></sc-if>
              <sc-if value="{{x.hasAnswer}}"><details><summary>팀 답변 전체</summary><div class="answer">{{x.answer}}</div></details></sc-if>
            </div>
          </sc-for>
          <sc-if value="{{w.working}}"><div class="msg sys working"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>{{w.workingL}}</div></sc-if>
          <sc-if value="{{w.hasQuestion}}">
            <div class="msg action attn">
              <div class="meta"><b>{{w.askedBy}}</b><span class="small muted">대장의 답이 필요합니다</span></div>
              <div class="body big">{{w.question}}</div>
              <div class="hint">아래 입력창에 답을 적어 보내면 기획팀이 이어서 계획합니다.</div>
            </div>
          </sc-if>
          <sc-if value="{{criteriaPending}}">
            <div class="msg action attn">
              <div class="meta"><b>기획팀</b><span class="small muted">완료 조건 승인이 필요합니다</span></div>
              <div class="body">대화에서 이 조건들을 도출했습니다. 승인하면 이 조건으로 작업과 검증을 진행합니다.</div>
              <ol class="ul"><sc-for list="{{w.pendingCriteria}}" as="c"><li>{{c}}</li></sc-for></ol>
              <div class="row-f"><button class="btn pri sm" onClick="{{approveCriteria}}">이 조건으로 승인</button><span class="hint">고칠 점이 있으면 아래에 적어 보내세요. 조건을 다시 도출합니다.</span></div>
            </div>
          </sc-if>
          <sc-if value="{{w.hasProposal}}">
            <div class="msg action done">
              <div class="meta"><b>검증팀</b><span class="small muted">완료 · 다음 개선안</span></div>
              <ul class="ul"><sc-for list="{{w.proposal}}" as="p"><li>{{p}}</li></sc-for></ul>
              <div class="row-f"><button class="btn pri sm" onClick="{{w.accept}}">승인하고 계속</button><button class="btn sm" onClick="{{w.dismiss}}">보류</button></div>
            </div>
          </sc-if>
          <sc-if value="{{w.hasIssue}}">
            <div class="{{w.issueMsgCls}}">
              <div class="meta"><b>엔진</b><span class="small muted">{{w.issueTitle}}</span></div>
              <div class="body">{{w.issueText}}</div>
              <div class="row-f"><sc-for list="{{w.issueActions}}" as="a"><button class="{{a.cls}}" onClick="{{a.go}}">{{a.l}}</button></sc-for></div>
            </div>
          </sc-if>
        </div>
        <div class="composer">
          <label class="sr" for="ws-compose">{{w.composerLabel}}</label>
          <textarea class="ta" id="ws-compose" placeholder="{{w.composerPh}}" value="{{w.draft}}" onChange="{{w.onDraft}}"></textarea>
          <div class="row-f composer-row"><span class="hint">{{w.composerHint}}</span><button class="btn pri sm" onClick="{{w.send}}" disabled="{{w.sendDisabled}}">{{w.sendL}}</button></div>
        </div>
      </section>
      <aside class="stack side" aria-label="계획과 진행">
        <div class="card">
          <div class="lbl">계획 · 완료 조건 {{w.proven}}/{{w.total}}</div>
          <div class="bar"><i style="width: {{w.pct}}%"></i></div>
          <div class="crit" style="margin-top: 12px">
            <sc-for list="{{w.crit}}" as="c"><div class="cr"><span class="{{c.ckCls}}"><sc-if value="{{c.ok}}"><svg viewBox="0 0 12 12" fill="none" stroke="#fff" stroke-width="2"><path d="M2.5 6.2l2.2 2.2 4.8-5"></path></svg></sc-if></span><div style="min-width: 0"><div class="t small">{{c.t}}</div></div><span></span></div></sc-for>
          </div>
          <sc-if value="{{w.noCriteria}}"><p class="hint">기획팀이 대화에서 완료 조건을 정하면 여기에 보입니다.</p></sc-if>
          <button class="link small" style="margin-top: 8px" onClick="{{w.goVerify}}">근거 보기</button>
        </div>
        <div class="card">
          <div class="lbl">할 일</div>
          <ol class="next"><sc-for list="{{w.upcoming}}" as="u"><li class="{{u.cls}}"><div class="row-f"><b class="small">{{u.team}}</b><span class="kind">{{u.state}}</span></div><div class="small muted">{{u.what}}</div></li></sc-for></ol>
          <sc-if value="{{w.hasWaitNote}}"><p class="hint" style="margin-top: 8px">{{w.waitNote}}</p></sc-if>
        </div>
        <div class="card">
          <div class="lbl">감시 에이전트</div>
          <p class="small">{{w.sentinelL}}</p>
          <sc-for list="{{w.sentinelBlocked}}" as="b"><div class="sentinel-row small"><span class="{{b.pillCls}}"><i></i>차단</span><span>{{b.text}}</span></div></sc-for>
        </div>
        <details class="card tools-card">
          <summary class="lbl">도구 · 결과물 · 기록</summary>
          <div class="row-f" style="margin-top: 10px">
            <button class="btn sm" onClick="{{showArtifacts}}">결과물 미리보기</button>
            <button class="btn sm" onClick="{{runSandboxTests}}">격리 테스트 실행</button>
            <button class="btn sm" onClick="{{w.toggleAutonomy}}">자율 후속 작업 · {{w.autonomyL}}</button>
            <a class="btn sm" href="{{w.recordsUrl}}" target="_blank" rel="noopener noreferrer">GitHub·Notion 기록 초안</a>
            <button class="btn sm" onClick="{{configureAutoSave}}">자동 저장 설정</button>
            <button class="btn sm" onClick="{{inspectAutoSave}}">자동 저장 상태</button>
          </div>
          <p class="hint">미리보기는 외부 통신·스크립트 실행을 차단합니다. 격리 테스트는 고정 테스트 명령만 실행합니다.</p>
        </details>
        <div class="card">
          <dl class="facts">
            <dt>진행 방식</dt><dd>{{w.kindL}}</dd>
            <dt>회차</dt><dd class="num">{{w.cycleL}}</dd>
            <dt>오늘</dt><dd class="num">{{w.today}} / {{limits.day}}단계</dd>
            <dt>작업 폴더</dt><dd class="mono small">projects/{{w.id}}</dd>
            <dt>만든 날</dt><dd class="num">{{w.created}}</dd>
          </dl>
        </div>
      </aside>
    </div>
  </sc-if>

  <!-- 활동 -->
  <sc-if value="{{pt.activity}}">
    <div class="list tl">
      <sc-for list="{{w.activity}}" as="a">
        <div class="ev">
          <div class="when">{{a.when}}</div>
          <div style="min-width: 0">
            <div class="who">{{a.who}}<span class="tool">{{a.tool}}</span><span class="{{a.pillCls}}"><i></i>{{a.resL}}</span></div>
            <div class="res">{{a.res}}</div>
            <sc-if value="{{a.hasTools}}"><div class="tchecks"><sc-for list="{{a.tools}}" as="k"><div class="tcheck"><span class="{{k.pillCls}}"><i></i>{{k.stL}}</span><span class="small"><b>{{k.name}}</b> · {{k.summary}}</span><sc-if value="{{k.hasDetails}}"><details><summary>자세히</summary><div class="answer">{{k.details}}</div></details></sc-if></div></sc-for></div></sc-if>
            <sc-if value="{{a.hasAnswer}}"><details><summary>답변 보기</summary><div class="answer">{{a.answer}}</div></details></sc-if>
          </div>
        </div>
      </sc-for>
      <sc-if value="{{w.noRuns}}"><div class="empty sm">아직 활동이 없습니다.</div></sc-if>
    </div>
    <details class="panel" style="margin-top: 16px; padding: 4px 0">
      <summary style="padding: 12px 20px">엔진 기록 {{w.logCount}}건</summary>
      <div class="log"><sc-for list="{{w.log}}" as="l"><div><span class="ts">{{l.ts}}</span>{{l.tx}}</div></sc-for></div>
    </details>
  </sc-if>

  <!-- 검증 -->
  <sc-if value="{{pt.artifacts}}">
    <div class="card">
      <div class="row-f"><h2>결과물 미리보기</h2><button class="btn sm" onClick="{{showArtifacts}}">파일 새로고침</button></div>
      <p class="hint">HTML·이미지·텍스트를 격리된 화면에서 봅니다. 외부 통신과 HTML 스크립트는 차단됩니다.</p>
      <div class="row-f"><sc-for list="{{artifactItems}}" as="a"><button class="btn sm" onClick="{{a.open}}">{{a.path}}</button></sc-for></div>
      <p class="hint">{{artifactMessage}}</p>
      <sc-if value="{{hasPreview}}"><iframe title="선택한 결과물 미리보기" src="{{previewUrl}}" sandbox="" referrerpolicy="no-referrer" style="width:100%;height:65vh;border:1px solid var(--line);border-radius:10px;background:white"></iframe></sc-if>
    </div>
  </sc-if>
  <sc-if value="{{pt.verify}}">
    <div class="card" style="margin-bottom:20px"><h2>격리 테스트</h2><p class="hint">프로젝트 테스트 코드를 실행합니다. 프로젝트 안의 파일이 변경될 수 있으며 AI는 호출하지 않습니다. 아래 버튼을 누르면 실행에 동의합니다.</p><button class="btn sm" onClick="{{runSandboxTests}}" disabled="{{testBusy}}">승인하고 테스트 실행</button><p class="answer" role="status">{{testMessage}}</p></div>
    <div class="card">
      <div class="lbl">완료 조건 · {{w.proven}}/{{w.total}} 확인</div>
      <p class="hint" style="margin: 0 0 8px">엔진이 작업 폴더에서 직접 확인했거나 대장이 확인한 것만 통과로 칩니다. AI가 “했다”고 말한 것만으로는 통과가 아닙니다.</p>
      <div class="crit">
        <sc-for list="{{w.crit}}" as="c">
          <div class="cr">
            <span class="{{c.ckCls}}"><sc-if value="{{c.ok}}"><svg viewBox="0 0 12 12" fill="none" stroke="#fff" stroke-width="2"><path d="M2.5 6.2l2.2 2.2 4.8-5"></path></svg></sc-if></span>
            <div style="min-width: 0"><div class="t">{{c.t}}</div><div class="{{c.eCls}}">{{c.e}}</div></div>
            <sc-if value="{{c.canConfirm}}"><button class="btn sm" onClick="{{c.confirm}}">완료로 확인</button></sc-if>
            <sc-if value="{{c.confirmHint}}"><span class="hint small">{{c.confirmHint}}</span></sc-if>
          </div>
        </sc-for>
      </div>
    </div>
    <sc-if value="{{w.hasHistory}}">
      <div class="sec-h" style="margin-top: 28px"><h2>이전 목표</h2></div>
      <div class="list"><sc-for list="{{w.history}}" as="h"><div class="ev"><div class="when">{{h.when}}</div><div><div class="who">{{h.title}}<span class="{{h.pillCls}}"><i></i>{{h.stL}}</span></div><div class="res">{{h.sub}}</div></div></div></sc-for></div>
    </sc-if>
  </sc-if>

  <!-- 설정 -->
  <sc-if value="{{pt.settings}}">
    <div class="stack project-settings">
      <div class="card">
        <div class="lbl">팀별 모델 · 추론 수준</div>
        <p class="hint" style="margin: 0 0 12px">팀마다 쓸 모델과 추론 수준을 고릅니다. 고르지 않은 팀은 "기본" 표시된 모델로 실행됩니다. 목록은 Claude Code 공식 문서와 이 계정의 Codex 공식 목록에서 가져오며, 바꾼 내용은 다음 단계부터 적용됩니다.</p>
        <sc-if value="{{m.loading}}"><p class="hint">모델 목록을 불러오는 중…</p></sc-if>
        <sc-if value="{{m.hasCodexError}}"><p class="hint" style="color: var(--attn-text, #B45309)">Codex 모델 목록을 불러오지 못했습니다 · {{m.codexError}} · 목록이 돌아올 때까지 Codex 팀의 모델을 바꿀 수 없습니다.</p></sc-if>
        <div class="tm-list">
          <sc-for list="{{m.teams}}" as="t">
            <div class="tm-row">
              <div class="tm-head"><b>{{t.name}}</b><span class="kind">{{t.tool}}</span><span class="small muted">지금 · {{t.current}}</span></div>
              <div class="tm-picks">
                <div class="seg wrap" role="group" aria-label="{{t.name}} 모델"><sc-for list="{{t.models}}" as="o"><button class="{{o.cls}}" aria-pressed="{{o.on}}" onClick="{{o.pick}}">{{o.label}}</button></sc-for></div>
                <div class="seg wrap" role="group" aria-label="{{t.name}} 추론 수준"><sc-for list="{{t.efforts}}" as="o"><button class="{{o.cls}}" aria-pressed="{{o.on}}" onClick="{{o.pick}}">{{o.label}}</button></sc-for></div>
              </div>
            </div>
          </sc-for>
        </div>
        <dl class="facts" style="margin-top: 16px"><dt>최근 실제 모델</dt><dd class="mono small">{{m.actual}}</dd></dl>
      </div>
      <div class="card">
        <div class="lbl">한도</div>
        <div class="field" style="margin-bottom: 12px"><label for="cap-in">하루 최대 단계 · 모든 프로젝트 공통 (기본 {{limits.dayDefault}})</label>
          <div class="row-f"><input class="input" id="cap-in" type="number" min="1" max="100" step="1" style="max-width: 110px" value="{{capDraft}}" onChange="{{onCap}}"><button class="btn sm" onClick="{{saveCap}}">저장</button><span class="hint">지금 {{limits.day}}단계 · 넘으면 다음 날 이어서. 사용량 기준(5시간 20%·주간 10%)은 따로 계속 적용됩니다.</span></div></div>
        <dl class="facts"><dt>동시 실행</dt><dd>전체 {{limits.all}} · Claude Code {{limits.claude}} · Codex {{limits.codex}}</dd><dt>진전 없음</dt><dd>개발 단계 3번 연속이면 멈추고 알림</dd></dl>
      </div>
      <div class="card danger-zone">
        <div class="lbl">프로젝트 삭제</div>
        <p class="hint" style="margin: 0 0 12px">목표·실행 기록·로그·모델 정책을 지웁니다. 작업 폴더 파일은 한 번 더 물어본 뒤에만 지웁니다. 실행 중에는 삭제할 수 없습니다.</p>
        <button class="btn danger" onClick="{{w.remove}}">프로젝트 삭제</button>
      </div>
    </div>
  </sc-if>
</sc-if>

<!-- ================= 승인함 (감시 에이전트 요청 · 결과 확인 · 기억 제안) ================= -->
<sc-if value="{{vInbox}}">
  <div class="page-h"><div><h1>승인함</h1><p class="lede">팀이 대장의 결정을 기다리는 일입니다. 감시 에이전트가 멈춰 둔 동작, 처음 몇 번 확인하는 작업 결과, 팀이 제안한 기억이 여기에 모입니다.</p></div>
    <button class="btn sm" onClick="{{ib.reload}}">새로고침</button></div>
  <div class="stack">
    <section class="card">
      <div class="lbl">감시 에이전트 승인 요청 · {{ib.approvalsN}}건</div>
      <sc-for list="{{ib.approvals}}" as="a">
        <div class="ib-row">
          <div style="min-width: 0"><div class="row-f"><b>{{a.kindL}}</b><span class="mono small">{{a.target}}</span></div>
            <div class="small muted">{{a.project}} · {{a.team}} · {{a.when}} · {{a.reason}}</div></div>
          <div class="row-f ib-acts"><sc-for list="{{a.actions}}" as="x"><button class="{{x.cls}}" onClick="{{x.go}}">{{x.l}}</button></sc-for></div>
        </div>
      </sc-for>
      <sc-if value="{{ib.noApprovals}}"><p class="hint">기다리는 요청이 없습니다.</p></sc-if>
    </section>
    <section class="card">
      <div class="lbl">결과 확인 · 신뢰 쌓기 · {{ib.reviewsN}}건</div>
      <p class="hint" style="margin: 0 0 8px">새로운 종류의 작업은 처음 {{ib.trustRequired}}번 결과를 대장이 보고 나서야 자동으로 이어집니다. 지금: {{ib.trustLevels}}</p>
      <sc-for list="{{ib.reviews}}" as="r">
        <div class="ib-row col">
          <div class="row-f"><b>{{r.team}}</b><span class="kind">{{r.step}}</span><span class="small muted">{{r.project}}</span></div>
          <div class="small">{{r.files}}</div>
          <sc-if value="{{r.hasTools}}"><div class="tchecks"><sc-for list="{{r.tools}}" as="k"><div class="tcheck"><span class="{{k.pillCls}}"><i></i>{{k.stL}}</span><span class="small"><b>{{k.name}}</b> · {{k.summary}}</span></div></sc-for></div></sc-if>
          <sc-if value="{{r.hasAnswer}}"><details><summary>팀 답변 전체</summary><div class="answer">{{r.answer}}</div></details></sc-if>
          <div class="row-f"><button class="btn pri sm" onClick="{{r.accept}}">확인하고 계속</button><button class="btn sm" onClick="{{r.sendBack}}">되돌려 보내기</button><button class="link small" onClick="{{r.open}}">프로젝트 열기</button></div>
        </div>
      </sc-for>
      <sc-if value="{{ib.noReviews}}"><p class="hint">확인할 결과가 없습니다.</p></sc-if>
    </section>
    <section class="card">
      <div class="lbl">기억 제안 · {{ib.proposalsN}}건</div>
      <sc-for list="{{ib.proposals}}" as="p">
        <div class="ib-row"><div style="min-width: 0"><div>{{p.text}}</div><div class="small muted">{{p.scope}} · {{p.by}} 제안 · {{p.when}}</div></div>
          <div class="row-f ib-acts"><button class="btn pri sm" onClick="{{p.approve}}">기억하기</button><button class="btn sm" onClick="{{p.reject}}">버리기</button></div></div>
      </sc-for>
      <sc-if value="{{ib.noProposals}}"><p class="hint">팀이 제안한 기억이 없습니다.</p></sc-if>
    </section>
    <section class="card">
      <div class="lbl">허용해 둔 것</div>
      <sc-for list="{{ib.grants}}" as="g">
        <div class="ib-row"><div style="min-width: 0"><div class="row-f"><b>{{g.kindL}}</b><span class="mono small">{{g.target}}</span></div><div class="small muted">{{g.scope}} · {{g.project}} · {{g.when}}</div></div>
          <div class="ib-acts"><button class="btn sm" onClick="{{g.revoke}}">취소</button></div></div>
      </sc-for>
      <sc-if value="{{ib.noGrants}}"><p class="hint">허용해 둔 것이 없습니다.</p></sc-if>
    </section>
    <section class="card">
      <div class="lbl">설정</div>
      <div class="field"><label>웹 접근</label>
        <div class="seg" role="group" aria-label="웹 접근"><button class="{{ib.webAskCls}}" aria-pressed="{{ib.webAsk}}" onClick="{{ib.setWebAsk}}">처음 여는 사이트는 승인 받기</button><button class="{{ib.webOpenCls}}" aria-pressed="{{ib.webOpen}}" onClick="{{ib.setWebOpen}}">공개 사이트는 모두 허용</button></div>
        <p class="hint">어느 쪽이든 내부·로컬 주소, 비밀정보가 담긴 주소, 유출 의심 주소는 막습니다.</p></div>
      <div class="field"><label for="trust-in">신뢰 쌓기 · 작업 종류마다 대장이 먼저 확인할 결과 수 (0이면 끔)</label>
        <div class="row-f"><input class="input" id="trust-in" type="number" min="0" max="10" step="1" style="max-width: 90px" value="{{ib.trustDraft}}" onChange="{{ib.onTrust}}"><button class="btn sm" onClick="{{ib.saveTrust}}">저장</button></div></div>
    </section>
  </div>
</sc-if>

<!-- ================= 기억 ================= -->
<sc-if value="{{vMemory}}">
  <div class="page-h"><div><h1>기억</h1><p class="lede">대장의 선호와 규칙입니다. 승인한 기억만 팀 지시에 들어가며, 프로젝트가 바뀌어도 유지됩니다. 언제든 고치거나 잊게 할 수 있습니다.</p></div></div>
  <div class="stack">
    <section class="card">
      <div class="lbl">새 기억</div>
      <div class="seg wrap" role="group" aria-label="적용 범위"><sc-for list="{{mem.scopes}}" as="c"><button class="{{c.cls}}" aria-pressed="{{c.on}}" onClick="{{c.pick}}">{{c.l}}</button></sc-for></div>
      <div class="row-f" style="margin-top: 10px"><label class="sr" for="mem-in">기억할 내용</label><input class="input" id="mem-in" style="flex: 1; min-width: 220px" placeholder="예: 답은 한국어로 짧게 · 결제 기능은 만들지 않는다" value="{{mem.draft}}" onChange="{{mem.onDraft}}"><button class="btn pri sm" onClick="{{mem.add}}">기억하기</button></div>
    </section>
    <sc-for list="{{mem.groups}}" as="grp">
      <section class="card">
        <div class="lbl">{{grp.title}} · {{grp.n}}개</div>
        <sc-for list="{{grp.items}}" as="i">
          <div class="ib-row"><div style="min-width: 0"><div>{{i.text}}</div><div class="small muted">{{i.by}} · {{i.when}}</div></div>
            <div class="row-f ib-acts"><button class="btn sm" onClick="{{i.edit}}">고치기</button><button class="btn sm" onClick="{{i.forget}}">잊기</button></div></div>
        </sc-for>
      </section>
    </sc-for>
    <sc-if value="{{mem.empty}}"><div class="empty">아직 기억이 없습니다. 위에서 추가하거나, 팀이 제안한 기억을 승인함에서 승인하세요.</div></sc-if>
    <sc-if value="{{mem.hasPending}}"><p class="hint">팀이 제안한 기억 {{mem.pendingN}}건이 승인함에서 기다립니다.</p></sc-if>
    <div class="card danger-zone"><div class="lbl">전체 초기화</div><p class="hint" style="margin: 0 0 12px">기억과 기억 제안을 모두 지웁니다. 되돌릴 수 없습니다.</p><button class="btn danger" onClick="{{mem.reset}}">기억 모두 지우기</button></div>
  </div>
</sc-if>

<!-- ================= 팀 ================= -->
<sc-if value="{{vSkills}}">
  <div class="page-h"><div><h1>스킬 라이브러리</h1><p class="lede">용도와 적용 팀을 확인하세요. 검토 대기 스킬은 작업에 적용되지 않습니다.</p></div><button class="btn sm" onClick="{{refreshSkills}}">새로고침</button></div>
  <p class="hint" role="status">{{skillsMessage}}</p>
  <div class="stack">
    <sc-for list="{{skillRows}}" as="k"><article class="card">
      <div class="sec-h"><h2>{{k.name}}</h2><span class="{{k.pillCls}}"><i></i>{{k.statusL}}</span></div>
      <p>{{k.description}}</p>
      <div class="row-f small muted"><span>적용 분야·팀: {{k.teamL}}</span><span>출처: {{k.sourceL}}</span></div>
      <details style="margin-top:14px"><summary>적용 조건 · 검토 기록 · 원문</summary>
        <dl class="facts" style="margin-top:12px"><dt>자동 선택 조건</dt><dd>{{k.triggerL}}</dd><dt>버전 지문</dt><dd class="mono small">{{k.id}}</dd><dt>출처 원문</dt><dd class="small">{{k.source}}</dd><dt>보안</dt><dd>{{k.security}}</dd><dt>정책·라이선스</dt><dd>{{k.policy}}</dd><dt>호환성</dt><dd>{{k.compatibility}}</dd></dl>
        <pre class="answer" style="max-height:480px;margin-top:16px">{{k.content}}</pre>
      </details>
    </article></sc-for>
    <sc-if value="{{skillsEmpty}}"><div class="empty">등록된 스킬이 없습니다. GitHub 후보와 자체 제작 초안을 등록하면 여기에 표시됩니다.</div></sc-if>
  </div>

// Minimal renderer for the template syntax: {{path}}, <sc-if value>, <sc-for list as>, on* handlers.
class DCLogic {
  constructor(props) { this.props = props; this.state = {}; }
  setState(patch) {
    Object.assign(this.state, typeof patch === 'function' ? patch(this.state, this.props) : patch);
    scheduleRender();
  }
}
const HOLE = /\{\{\s*([\w.$]+)\s*\}\}/g;
const BOOL_ATTRS = ['disabled', 'hidden', 'checked', 'required', 'open'];
function lookup(path, vals, scope) {
  const [head, ...rest] = path.split('.');
  let v = Object.hasOwn(scope, head) ? scope[head] : vals[head];
  for (const k of rest) v = v == null ? undefined : v[k];
  return v;
}
const interp = (s, vals, scope) => s.replace(HOLE, (_, p) => { const v = lookup(p, vals, scope); return v == null ? '' : String(v); });
const exact = (s, vals, scope) => { const m = /^\s*\{\{\s*([\w.$]+)\s*\}\}\s*$/.exec(s || ''); return m ? lookup(m[1], vals, scope) : undefined; };
function build(nodes, parent, vals, scope) {
  for (const node of nodes) {
    if (node.nodeType === 3) { parent.appendChild(document.createTextNode(interp(node.data, vals, scope))); continue; }
    if (node.nodeType !== 1) continue;
    if (node.localName === 'sc-if') { if (exact(node.getAttribute('value'), vals, scope)) build(node.childNodes, parent, vals, scope); continue; }
    if (node.localName === 'sc-for') {
      const as = node.getAttribute('as');
      for (const item of exact(node.getAttribute('list'), vals, scope) || []) build(node.childNodes, parent, vals, { ...scope, [as]: item });
      continue;
    }
    const el = node.cloneNode(false);
    for (const { name, value } of [...node.attributes]) {
      if (name.startsWith('on')) {
        el.removeAttribute(name);
        const fn = exact(value, vals, scope), type = name.slice(2);
        if (typeof fn !== 'function') continue;
        if (type === 'change') {
          // Re-rendering mid-composition would break Hangul input, so wait for compositionend.
          el.addEventListener('input', e => { if (!e.isComposing) fn(e); });
          el.addEventListener('compositionend', fn);
        } else el.addEventListener(type, fn);
        continue;
      }
      // Boolean attributes (disabled, hidden, …) are present or absent, never "empty".
      if (BOOL_ATTRS.includes(name) && value.includes('{{')) {
        const on = exact(value, vals, scope);
        if (on == null || on === false || on === '') el.removeAttribute(name); else el.setAttribute(name, '');
        continue;
      }
      if (value.includes('{{')) {
        const v = interp(value, vals, scope);
        el.setAttribute(name, v);
        if (name === 'value') el.value = v;
      }
    }
    build(node.childNodes, el, vals, scope);
    parent.appendChild(el);
  }
}

function stateOf(g) {
  if (!g) return { l: '비어 있음', tone: 'idle' };
  switch (g.status) {
    case 'running': return { l: (g.team ? TEAM_NAME[g.team.step] + ' 작업 중' : '실행 중') + (g.pauseRequested ? ' · 멈춤 예약' : ''), tone: 'run' };
    case 'scheduled':
      if (g.reason === 'daily_cap') return { l: '오늘 한도 · 내일 이어서', tone: 'wait' };
      if (g.kind === 'team') return g.autoRun ? { l: '다음 단계 준비', tone: 'run' } : { l: g.round ? '멈춤' : '시작 전', tone: 'idle' };
      return { l: '실행 대기', tone: 'idle' };
    case 'paused': return { l: '멈춤', tone: 'idle' };
    case 'retry_wait': return { l: '재시도 대기', tone: 'wait' };
    case 'model_wait': return { l: '모델 대기', tone: 'attn' };
    case 'review_required': return { l: g.reason === 'needs_decision' ? '대장 답변 필요' : '확인 필요', tone: 'attn' };
    case 'blocked': return { l: '중단됨', tone: 'stop' };
    case 'recovery_required': return { l: '복구 필요', tone: 'stop' };
    case 'verified': return { l: g.proposal && g.proposal.status === 'pending' ? '완료 · 개선안 있음' : '완료', tone: 'done' };
    default: return { l: g.status, tone: 'idle' };
  }
}

      approveCriteria: () => {
        const g = wp && (s.eng.projects || []).flatMap(p => p.goals || []).find(g => g.projectId === wp.id && g.criteriaApprovalPending);
        if (!g) return window.alert('승인 대기 중인 완료 조건이 없습니다.');
        if (window.confirm('이 조건으로 완료 여부를 검증합니까?\n\n' + g.completionCriteria.join('\n')))
          this.act(this.api('POST', '/api/goals/' + g.id + '/criteria/approve', { confirm: true, criteria: g.completionCriteria }), '완료 조건 승인');
      },
      quotaRows: (s.quotas || []).map(q => ({ name: q.provider === 'codex' ? 'Codex' : 'Claude Max', source: q.source,
        hasLimits: (q.limitStatus || []).length > 0,
        limits: (q.limitStatus || []).map((l) => { const st = LIMIT_ST[l.status] || [l.status, 'idle'];
          return { label: LIMIT_WIN[l.window] || l.window, stL: st[0] + (l.usingOverage ? ' · 추가 사용 중' : ''), pillCls: pillCls(st[1]),
            reset: l.resetsAt ? new Date(l.resetsAt).toLocaleString() : '알 수 없음', seen: ago(l.observedAt) }; }),
        observed: q.observedAt ? new Date(q.observedAt).toLocaleString() : '미수집',
        note: [q.note, q.basis === 'limit_status' ? '실행 판단: 팀 실행 때 받은 한도 상태(정상·근접·초과) 기준 · 터미널 없이 동작'
          : q.basis === 'percent' ? '실행 판단: 최신 사용률 기준 (5시간 20%·주간 10% 이하 남으면 중단)' : ''].filter(Boolean).join(' · '),
        windows: q.windows.map(w => ({ label: w.period === 'five_hour' ? '5시간' : '주간', remaining: Math.round(w.remaining * 10) / 10,
          color: w.blocked ? '#b42318' : q.stale ? '#a1a1aa' : '#397d60',
          status: (w.blocked ? '중단 기준 도달 · 새 단계 멈춤' : '기준 이내') + ' (' + w.stopAt + '% 이하 남으면 중단)' + (q.stale ? ' · ' + ago(q.observedAt) + ' 기준' : ''), reset: new Date(w.resetAt).toLocaleString() })) })),
      greeting: (hour < 12 ? '좋은 아침입니다' : hour < 18 ? '안녕하세요' : '수고하셨습니다') + ', 대장',
      homeLede: inboxN ? '팀이 결정을 기다리는 일이 ' + inboxN + '건 있습니다.' : (activeN ? '팀이 프로젝트 ' + activeN + '개를 진행하고 있습니다.' : '진행 중인 프로젝트가 없습니다.'),
      hasProjects: P.length > 0, noProjects: P.length === 0 && !!s.eng,
      st: { active: activeN, inbox: inboxN, today: P.reduce((n, p) => n + p.today, 0), done: P.filter((p) => p.goal.status === 'verified').length, attnCls: 'stat' + (inboxN ? ' attn' : '') },
      inbox: inbox, inboxEmpty: inbox.length === 0,
      homeProjects: P.slice(0, 6).map(rowOf), allProjects: P.map(rowOf), teams: teams,
      projectTeams: wp ? TEAMS.map(t => {
        const runs = wp.runs.filter(r => r.team === t.id).sort((a,b) => (b.startedAt || '').localeCompare(a.startedAt || ''));
        const active = wp.goal.status === 'running' && wp.goal.team?.step === t.id;
        const confirmed = runs.find(r => r.actualModel && !r.simulated);
        return {name:t.name, stL:active?'작업 중':'대기', pillCls:pillCls(active?'run':'idle'),
          task:active?(wp.goal.team.task || '작업 진행 중'):(runs.length?'최근 단계 종료':'아직 작업 기록 없음'),
          model:confirmed?confirmed.actualModel:'실제 모델 확인 전', tool:TOOL[runs[0]?.executor || t.tool],
          when:runs[0]?ago(runs[0].finishedAt || runs[0].startedAt):'없음', today:runs.filter(r=>sameDay(r.startedAt)).length};
      }) : [],
      w: w, m: m, limits: lim,
      ptabs: ptabDefs.map((x) => ({ l: x[1], n: x[2], hasN: x[2] !== '' && x[2] !== 0, cls: 'pt' + (s.ptab === x[0] ? ' on' : ''), cur: s.ptab === x[0] ? 'page' : 'false', go: () => this.setState({ ptab: x[0] }) })),
      artifactItems:(s.artifactItems || []).map(a=>({path:a.path,open:()=>this.setState({previewUrl:'/api/projects/'+encodeURIComponent(wp.id)+'/preview?path='+encodeURIComponent(a.path),artifactMessage:a.path})})),
      previewUrl:s.previewUrl || '', hasPreview:!!s.previewUrl, artifactMessage:s.artifactMessage || '파일 새로고침을 눌러 결과물을 불러오세요.', testBusy:!!s.testBusy, testMessage:s.testMessage || '아직 실행하지 않았습니다.',
      pt: { artifacts:s.ptab === 'artifacts', over: s.ptab === 'over', activity: s.ptab === 'activity', verify: s.ptab === 'verify', settings: s.ptab === 'settings' },
      pinDraft: s.pinDraft, onPin: (e) => this.setState({ pinDraft: e.target.value }),
      capDraft: s.capDraft == null ? String(lim.day) : s.capDraft, onCap: (e) => this.setState({ capDraft: e.target.value }),
      saveCap: () => {
        const n = Number(s.capDraft == null ? lim.day : s.capDraft);
        if (!Number.isInteger(n) || n < 1 || n > 100) { this.say('1부터 100 사이의 정수로 적어 주세요'); return; }
        this.api('PUT', '/api/settings', { key: 'limits.maxRoundsPerDay', value: n })
          .then(() => { this.setState({ capDraft: null }); return this.refresh(); })
          .then(() => this.say('하루 최대 ' + n + '단계로 바꿨습니다 · 모든 프로젝트에 바로 적용')).catch((e) => this.say(korErr(e.message)));
      },
      usageRows: P.map((p) => ({ name: p.name, today: p.today + ' / ' + lim.day, pct: Math.min(100, Math.round(p.today / lim.day * 100)), stL: p.st.l, pillCls: pillCls(p.st.tone) })),
      toolRows: [['claude-code', lim.claude], ['codex', lim.codex]].map((x) => ({ tool: TOOL[x[0]], cap: x[1], n: allRuns.filter((r) => (r.executor || 'claude-code') === x[0] && sameDay(r.startedAt)).length })),
      showNew: s.showNew, openNew: () => this.setState({ showNew: true }), closeNew: () => this.setState({ showNew: false }),
      np: { title: np.title, goal: np.goal, crit: np.crit, error: np.error, hasError: !!np.error, real: real,
        onTitle: setNp('title'), onGoal: setNp('goal'), onCrit: setNp('crit'), createOnly: createNew(false), createStart: createNew(true) },
      hasToast: !!s.toast, toast: s.toast
    };
  }

  loadEnvs() {
    return fetch('/api/environments').then((r) => { if (!r.ok) throw new Error(String(r.status)); return r.json(); })
      .then((envs) => this.setState({ envs: envs, envErr: '' })).catch(() => this.setState({ envErr: 'x' }))
      .then(() => this.loadTeams());
  }
  loadModelChoices() {
    return fetch('/api/model-choices').then((r) => { if (!r.ok) throw new Error(String(r.status)); return r.json(); })
      .then((d) => this.setState({ modelChoices: d }))
      .catch(() => this.setState({ modelChoices: { 'claude-code': { models: [], defaultModel: null }, codex: { models: [], defaultModel: null, error: '모델 목록 요청 실패' } } }));
  }
  loadTeams() {
    return fetch('/api/teams').then((r) => { if (!r.ok) throw new Error(String(r.status)); return r.json(); })
      .then((d) => { const by = {}; d.teams.forEach((t) => { by[t.id] = t.tools; }); this.setState({ teamTools: by }); })
      .catch(() => {});
  }
  refreshEnvs() {
    if (this.state.envBusy) return;
    this.setState({ envBusy: true });
    this.api('POST', '/api/environments/refresh', {}).then((envs) => { this.setState({ envs: envs, envBusy: false }); this.loadTeams(); this.say('연결 상태를 다시 확인했습니다'); })
      .catch((e) => { this.setState({ envBusy: false }); this.say(korErr(e.message)); });
  }
  toggleSetting(e) {
    const next = !e.enabled;
    const who = e.usedBy.join(', ') || '팀';
    if (next && !window.confirm(e.name + '을(를) ' + who + '에 켭니다.\n\n' + (e.note || '') + '\n\n켤까요?')) return;
    this.api('PUT', '/api/settings', { key: e.setting, value: next }).then(() => this.loadEnvs())
      .then(() => this.say(e.name + ' · ' + who + ' 사용을 ' + (next ? '켰습니다' : '껐습니다') + ' (다음 단계부터 적용)')).catch((err) => this.say(korErr(err.message)));
  }
  sendAnswer(goalId) {
    const text = (this.state.drafts[goalId] || '').trim();
    if (!text) { this.say('답변을 적어 주세요.'); return; }
    this.act(this.api('POST', '/api/goals/' + goalId + '/answer', { text: text }).then((v) => {
      const d = Object.assign({}, this.state.drafts); delete d[goalId]; this.setState({ drafts: d }); return v;
    }), '답변을 보냈습니다 · 기획팀이 이어서 계획합니다');
  }
  confirmCriterion(goalId, criterion) {
    const note = window.prompt('‘' + criterion + '’ 조건을 대장이 직접 확인한 것으로 기록합니다.\n확인한 내용을 짧게 적어 주세요 (비워도 됩니다).', '');
    if (note === null) return;
    this.act(this.api('POST', '/api/goals/' + goalId + '/confirm', { criterion: criterion, note: note }), '완료로 확인했습니다');
  }
  removeProject(p) {
    if (p.goal.status === 'running') { this.say('실행 중인 단계가 끝난 뒤에 삭제할 수 있습니다.'); return; }
    if (!window.confirm('‘' + p.name + '’ 프로젝트를 삭제합니다.\n\n목표 ' + p.goals.length + '개, 실행 기록 ' + p.runs.length + '건, 로그, 모델 정책이 지워지며 되돌릴 수 없습니다.\n계속할까요?')) return;
    const deleteFiles = window.confirm('작업 폴더(projects/' + p.id + ')의 파일도 지울까요?\n\n확인: 파일도 삭제\n취소: 파일은 남김');
    this.api('DELETE', '/api/projects/' + p.id, { deleteFiles: deleteFiles })
      .then((r) => this.refresh().then(() => { this.go('projects'); this.say('‘' + p.name + '’을 삭제했습니다' + (r.filesDeleted ? ' · 작업 폴더도 삭제' : ' · 작업 폴더 파일은 남김')); }))
      .catch((e) => this.say(korErr(e.message)));
  }
}

const root = document.getElementById('app');
const tpl = document.getElementById('tpl').content;
const comp = new Component({});
let queued = false;
function scheduleRender() { if (!queued) { queued = true; queueMicrotask(() => { queued = false; render(); }); } }
function render() {
  const active = document.activeElement, id = active && active.id;
  const range = id && typeof active.selectionStart === 'number' ? [active.selectionStart, active.selectionEnd] : null;
  const opened = [...root.querySelectorAll('details[open]')].map((d) => d.dataset.key || [...root.querySelectorAll('details')].indexOf(d));
  const frag = document.createDocumentFragment();
  build(tpl.childNodes, frag, comp.renderVals(), {});
  root.replaceChildren(frag);
  const all = [...root.querySelectorAll('details')];
  opened.forEach((i) => { if (all[i]) all[i].open = true; });
  const again = id && document.getElementById(id);
  if (again) { again.focus({ preventScroll: true }); if (range) again.setSelectionRange(...range); }
}
render();
comp.componentDidMount();
</script>
</body>
