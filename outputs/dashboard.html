    const allArts = [];
    P.forEach((p) => p.arts.forEach((a) => allArts.push(artCard(p, a))));

    // 프로젝트 작업실
    const wp = projById[s.pid] || P[0];
    const wk = pst(wp);
    const cnt = (r) => wp.crit.filter((c) => c.r === r).length;
    const togglePause = () => {
      const pz = Object.assign({}, this.state.paused); pz[wp.id] = !pz[wp.id];
      this.setState({ paused: pz });
      this.say(pz[wp.id] ? '일시정지했습니다 · 시안이므로 실제 실행은 멈추지 않습니다' : '재개했습니다 · 시안');
    };
    const chat = (s.chats[wp.id] || []).map((m) => ({ by: m.by, at: m.at, t: m.t, cls: 'msg' + (m.by === '대장' ? ' me' : '') }));
    const taskPols = wp.tasks.map((tk, i) => {
      const key = wp.id + ':' + i, pin = s.taskPol[key] === 'pinned';
      const setTp = (v) => () => { const all = Object.assign({}, this.state.taskPol); all[key] = v; this.setState({ taskPol: all }); this.say('시안: 작업별 예외 설정 화면만 바뀌었습니다'); };
      return { t: tk.t, assign: assignOf(tk.team), isPin: pin, inhCls: pin ? '' : 'on', pinCls: pin ? 'on' : '', setInherit: setTp('inherit'), setPin: setTp('pinned') };
    });
    const w = {
      id: wp.id, slug: wp.slug, name: wp.name, goal: wp.goal, cycle: wp.cycle, cadence: wp.cadence, next: wp.next,
      stCls: ST[wk].c, stL: ST[wk].l, isPaused: wk === 'paused', canPause: wp.status !== 'done',
      pauseL: s.paused[wp.id] ? '재개' : '일시정지', pauseCls: 'btn' + (s.paused[wp.id] ? ' pri' : ''), togglePause: togglePause,
      block: wp.block, hasBlock: !!wp.block, stages: mkStages(wp),
      pass: cnt('pass'), fail: cnt('fail'), none: cnt('none'), all: wp.crit.length,
      teams: wp.teams.map((id) => ({ assign: assignOf(id), stCls: ST[teamById[id].status].c, stL: ST[teamById[id].status].l, open: () => this.open('team', id) })),
      noTeams: !wp.teams.length,
      tasks: wp.tasks.map((tk) => ({ t: tk.t, assign: assignOf(tk.team), stCls: ST[tk.s].c, stL: ST[tk.s].l, blockTxt: tk.block || '없음', blockCls: tk.block ? 'warn-t' : 'none-t' })),
      noTasks: !wp.tasks.length, taskPols: taskPols,
      chat: chat, noChat: !chat.length,
      arts: wp.arts.map((a) => artCard(wp, a)), noArts: !wp.arts.length,
      files: wp.files.map((f) => ({ p: f.p, ch: f.ch, at: f.at, by: f.by, open: () => this.say('시안: ' + f.p + ' 파일 열기는 아직 연결되지 않았습니다') })), noFiles: !wp.files.length,
      log: wp.log, noLog: !wp.log.length,
      runs: wp.runs.map((r) => ({ n: r.n, a: r.a, start: r.start, tm: toolModel(r.tool), res: r.res, cls: RV[r.rc].c })), noRuns: !wp.runs.length,
      cps: wp.cps, noCps: !wp.cps.length,
      handoffs: wp.handoffs.map((h) => ({ at: h.at, from: toolModel(h.from), to: toolModel(h.to), why: h.why, carried: h.carried })),
      noHandoffs: !wp.handoffs.length, handoffNote: wp.handoffNote || '교대 기록 없음.',
      crit: wp.crit.map((c, i) => ({ i: '#' + (i + 1), t: c.t, e: c.e, at: c.at || '—', by: c.by, anchor: 'crit-' + i,
        eCls: 'ev' + (c.r === 'none' ? ' none-t' : ''), rL: RVC[c.r].l, rCls: RVC[c.r].c, rowCls: 'row vrow' + (s.hl === i ? ' hl' : '') }))
    };
    const tabDefs = [['over', '개요', ''], ['tasks', '작업·팀', wp.tasks.length], ['arts', '결과물', wp.arts.length], ['runs', '실행·로그', ''], ['verify', '검증', w.pass + '/' + w.all], ['settings', '설정', '']];
    const wtabs = tabDefs.map((x) => ({ l: x[1], n: x[2], hasN: x[2] !== '', on: s.wtab === x[0], cls: 'wtab' + (s.wtab === x[0] ? ' on' : ''),
      go: () => this.setState({ wtab: x[0], hl: null }) }));
    const wt = { over: s.wtab === 'over', tasks: s.wtab === 'tasks', arts: s.wtab === 'arts', runs: s.wtab === 'runs', verify: s.wtab === 'verify', settings: s.wtab === 'settings' };
    const switcher = P.map((p) => ({ name: p.name, dot: 'sd sd-' + pst(p), on: p.id === wp.id, cls: 'swc' + (p.id === wp.id ? ' on' : ''),
      go: () => { this.setState({ pid: p.id, art: null, hl: null, chatDraft: '', draft: '', pv: 'web' }); this.toTop(); } }));
    const sendChat = () => {
      const t = this.state.chatDraft.trim();
      if (!t) { this.say('메시지를 입력해 주세요'); return; }
      const all = Object.assign({}, this.state.chats); all[wp.id] = (all[wp.id] || []).concat([{ by: '대장', at: '방금', t: t }]);
      this.setState({ chats: all, chatDraft: '' });
      this.say(wp.name + ' 대화에 기록했습니다 · 시안이므로 에이전트에는 전달되지 않습니다');
    };

    // 결과물 보기
    const a = s.art ? wp.arts.find((x) => x.id === s.art) : null;
    let av = {};
    if (a) {
      const cv = a.versions ? (a.versions.find((v) => v.id === s.cur[a.id]) || a.versions[0]) : null;
      av = { name: a.name, team: a.team, kindL: kindL[a.kind], cur: curOf(a), url: a.url || '',
        isWeb: a.kind === 'web', isFile: a.kind !== 'web', isDoc: a.kind === 'doc', isSlide: a.kind === 'slide', isDesign: a.kind === 'design',
        pvHub: a.pv === 'hub', pvPort: a.pv === 'port', head: cv ? cv.head : '', vDate: cv ? cv.date : '', lines: cv ? cv.lines.map((t) => ({ t: t })) : [],
        crit: a.crit.map((i) => ({ l: '#' + (i + 1) + ' ' + wp.crit[i].t + ' · ' + RVC[wp.crit[i].r].l, go: () => this.goCrit(i) })),
        hasVersions: !!a.versions, reqs: (s.reqs[a.id] || []).slice().reverse(),
        versions: (a.versions || []).map((v) => ({ id: v.id, date: v.date, by: v.by, note: v.note, isCur: v.id === s.cur[a.id], canRevert: v.id !== s.cur[a.id],
          cls: 'vi' + (v.id === s.cur[a.id] ? ' cur' : ''),
          revert: () => { const c = Object.assign({}, this.state.cur); c[a.id] = v.id; this.setState({ cur: c }); this.say(v.id + ' 내용으로 되돌렸습니다 · 이후 버전 기록은 보존 (시안)'); } })) };
    }
    const submitReq = () => {
      if (!a) return;
      const t = this.state.draft.trim();
      if (!t) { this.say('수정 요청 내용을 입력해 주세요'); return; }
      const r = Object.assign({}, this.state.reqs); r[a.id] = (r[a.id] || []).concat([{ t: t, st: '검토 대기 · 방금' }]);
      this.setState({ reqs: r, draft: '' });
      this.say('수정 요청을 ' + a.team + ' 대기열에 추가했습니다 (시안)');
    };

    // 모델 기본 정책 (시안)
    const mp = Object.assign({ mode: 'auto', fb: false }, s.mpol[wp.id]);
    const setMp = (patch) => () => {
      const all = Object.assign({}, this.state.mpol);
      all[wp.id] = Object.assign({ mode: 'auto', fb: false }, all[wp.id], patch);
      this.setState({ mpol: all });
      this.say('시안: 설정 화면만 바뀌었습니다. 실제 실행에는 반영되지 않습니다.');
    };
    const m = { isAuto: mp.mode === 'auto', isPin: mp.mode === 'pinned', fb: mp.fb, fbL: mp.fb ? '켜짐' : '꺼짐',
      autoCls: mp.mode === 'auto' ? 'on' : '', pinCls: mp.mode === 'pinned' ? 'on' : '', fbCls: 'btn' + (mp.fb ? ' pri' : ''),
      setAuto: setMp({ mode: 'auto' }), setPin: setMp({ mode: 'pinned' }), toggleFb: setMp({ fb: !mp.fb }),
      next: mp.mode === 'auto' ? '실행 도구 기본 모델 · 확인 필요'
        : (mp.fb ? '고정 모델 사용 불가 → 대체 허용으로 실행 도구 기본 모델 (확인 필요)' : '고정 모델 사용 불가 → 대기 (자동 교체 안 함)') };

    // 상세 패널
    const sel = s.sel;
    let d = { kind: '', title: '', hasSt: false, hasAssign: false };
    let isTeam = false, isAppr = false, isTool = false, isRec = false, isNew = false;
    if (sel) {
      if (sel.kind === 'team') {
        const t = teamById[sel.id], p = projById[t.proj];
        d = { kind: '팀', title: t.name, name: t.name, tool: TOOL[t.tool], hasSt: true, stCls: ST[t.status].c, stL: ST[t.status].l, hasAssign: true, assign: assignOf(t.id),
          task: t.task, blockTxt: t.block || '없음', next: t.next, hours: t.hours.toFixed(1), projName: p.name,
          blockCallout: !t.block ? 'callout info' : (t.status === 'stall' ? 'callout' : 'callout warn'),
          openProj: () => this.openProject(p.id), openLog: () => this.openProject(p.id, 'runs') };
        isTeam = true;
      } else if (sel.kind === 'appr') {
        const x = approvals.find((y) => y.id === sel.id), p = projById[x.pid];
        d = Object.assign({ kind: '대장 확인 · ' + x.ty, title: x.title, hasSt: false, hasAssign: false, projName: p.name, openProj: () => this.openProject(p.id) }, x);
        d.kind = '대장 확인 · ' + x.ty;
        isAppr = true;
      } else if (sel.kind === 'tool') {
        const t = D.tools.find((y) => y.id === sel.id);
        d = { kind: '도구 · ' + t.type, title: t.name, hasSt: false, hasAssign: false, type: t.type, src: t.src, ver: t.ver, perm: t.perm, used: t.used,
          secL: RV[t.sec].l, secCls: RV[t.sec].c, polL: RV[t.pol].l, polCls: RV[t.pol].c, secChecks: t.secChecks, polChecks: t.polChecks };
        isTool = true;
      } else if (sel.kind === 'rec') {
        const r = D.recs.find((y) => y.id === sel.id);
        d = { kind: '반복 목표', title: r.name, hasSt: true, stCls: ST[r.status].c, stL: ST[r.status].l, hasAssign: false,
          cadence: r.cadence, next: r.next, wait: r.wait, team: r.team, at: r.at, result: r.result,
          history: r.history.map((h) => ({ at: h.at, r: h.r, stCls: ST[h.s].c, stL: ST[h.s].l })) };
        isRec = true;
      } else if (sel.kind === 'new') {
        d = { kind: '새 프로젝트', title: '새 프로젝트 만들기', hasSt: false, hasAssign: false };
        isNew = true;
      }
    }
    const setNp = (k) => (e) => { const np = Object.assign({}, this.state.np); np[k] = e.target.value; this.setState({ np: np }); };
    const createProject = () => {
      const np = this.state.np;
      const lines = np.crit.split('\n').map((x) => x.trim()).filter(Boolean);
      if (!np.name.trim() || !np.goal.trim()) { this.say('이름과 목표를 입력해 주세요'); return; }
      if (!lines.length) { this.say('완료 조건을 한 줄 이상 입력해 주세요'); return; }
      const id = 'n' + (this.state.extra.length + 1);
      const p = { id: id, slug: 'new-' + (this.state.extra.length + 1), name: np.name.trim(), goal: np.goal.trim(), status: 'plan', stage: 0, cycle: '시작 전', cadence: '미정',
        block: '', next: '담당 팀 배정 후 1회차 조사 시작', teams: [], crit: lines.map((t) => ({ t: t, r: 'none', e: '미검증', at: '', by: '' })),
        tasks: [], arts: [], files: [], chat: [], log: [], runs: [], cps: [], handoffs: [], handoffNote: '교대 기록 없음.' };
      const chats = Object.assign({}, this.state.chats); chats[id] = [];
      this.setState({ extra: this.state.extra.concat([p]), chats: chats, np: { name: '', goal: '', crit: '' } });
      this.openProject(id);
      this.say('시안에 프로젝트를 추가했습니다 · 실제 실행은 하지 않습니다');
    };

    return {
      rootCls: 'hq' + (narrow ? ' is-narrow' : '') + (mid ? ' is-mid' : ''),
      accent: this.props.accent || '#2F3FCF',
      navItems: navItems, sideProjects: sideProjects, slots: slots,
      running: runClaude + runCodex, runClaude: runClaude, runCodex: runCodex,
      strip: [
        { k: '실행 중', v: (runClaude + runCodex) + '/2 · Claude Code ' + runClaude + '/2 · Codex ' + runCodex + '/1' },
        { k: '실행 대기 (슬롯 부족)', v: queued + '팀' },
        { k: '한도 대기 (계정 한도)', v: limited + '팀' },
        { k: '검증 통과 완료 조건', v: critOk + '/' + critAll }
      ],
      openCount: openCount, openCls: 'big' + (openCount === 0 ? ' zero' : ''),
      inboxShown: inboxShown, inboxAll: s.inboxAll, hasMoreInbox: approvals.length > 3,
      inboxMoreL: s.inboxAll ? '접기' : '전체 보기 (' + approvals.length + '건)', toggleInbox: () => this.setState({ inboxAll: !this.state.inboxAll }),
      activeProjects: activeProjects, accounts: accounts, rawRows: rawRows, teams: teams, legend: legend, teamUse: teamUse,
      goProjects: () => this.go('projects'), goUsage: () => this.go('usage'),
      q: s.q, hasQ: q.length > 0, results: results, noResults: q.length > 0 && results.length === 0,
      onQ: (e) => this.setState({ q: e.target.value }),
      vOverview: s.view === 'overview', vProjects: s.view === 'projects', vProject: s.view === 'project', vArtifacts: s.view === 'artifacts',
      vRecurring: s.view === 'recurring', vRegistry: s.view === 'registry', vUsage: s.view === 'usage',
      pq: s.pq, onPq: (e) => this.setState({ pq: e.target.value }), filters: filters, plist: plist, plistEmpty: plist.length === 0,
      openNew: () => this.open('new', null),
      w: w, wt: wt, wtabs: wtabs, switcher: switcher, goVerify: () => this.setState({ wtab: 'verify', hl: null }),
      chatDraft: s.chatDraft, onChat: (e) => this.setState({ chatDraft: e.target.value }), sendChat: sendChat,
      hasArt: !!a, av: av, draft: s.draft, onDraft: (e) => this.setState({ draft: e.target.value }), submitReq: submitReq,
      pvWebCls: s.pv === 'web' ? 'on' : '', pvAppCls: s.pv === 'app' ? 'on' : '',
      pvWeb: () => this.setState({ pv: 'web' }), pvApp: () => this.setState({ pv: 'app' }), pvFrameCls: 'pv-frame' + (s.pv === 'app' ? ' app' : ''),
      m: m, editCrit: () => this.say('시안: 완료 조건 수정은 아직 연결되지 않았습니다'), archive: () => this.say('시안: 보관 기능은 아직 연결되지 않았습니다'),
      allArts: allArts,
      recs: D.recs.map((r) => Object.assign({}, r, { stCls: ST[r.status].c, stL: ST[r.status].l, open: () => this.open('rec', r.id) })),
      tools: D.tools.map((t) => ({ name: t.name, type: t.type, src: t.src, ver: t.ver, perm: t.perm, note: t.note,
        secL: RV[t.sec].l, secCls: RV[t.sec].c, polL: RV[t.pol].l, polCls: RV[t.pol].c, open: () => this.open('tool', t.id) })),
      hasSel: !!sel, d: d, close: () => this.setState({ sel: null }),
      isTeam: isTeam, isAppr: isAppr, isTool: isTool, isRec: isRec, isNew: isNew,
      np: s.np, onNpName: setNp('name'), onNpGoal: setNp('goal'), onNpCrit: setNp('crit'), createProject: createProject,
      hasToast: !!s.toast, toast: s.toast
    };
  }
}

const root = document.getElementById('app');
const tpl = document.getElementById('tpl').content;
const comp = new Component({ accent: '#2F3FCF', forceNarrow: false });
let queued = false;
function scheduleRender() { if (!queued) { queued = true; queueMicrotask(() => { queued = false; render(); }); } }
function render() {
  const active = document.activeElement, id = active && active.id;
  const range = id && typeof active.selectionStart === 'number' ? [active.selectionStart, active.selectionEnd] : null;
  const scrolls = [...root.querySelectorAll('.d-b, .results, .chat')].map(el => [el.className, el.scrollTop]);
  const frag = document.createDocumentFragment();
  build(tpl.childNodes, frag, comp.renderVals(), {});
  root.replaceChildren(frag);
  for (const [cls, top] of scrolls) { const el = root.getElementsByClassName(cls)[0]; if (el) el.scrollTop = top; }
  const again = id && document.getElementById(id);
  if (again) { again.focus({ preventScroll: true }); if (range) again.setSelectionRange(...range); }
}
render();
comp.componentDidMount?.();
</script>
