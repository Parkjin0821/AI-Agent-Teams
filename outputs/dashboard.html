<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AGENT HQ 대시보드</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style>
:root{--bg:#F3F2EE;--sf:#FFFFFF;--sf2:#F8F7F3;--ln:#E3E1D9;--ln2:#D2CFC5;--ink:#16161A;--ink2:#44444C;--ink3:#62626A;--side:#141519;--side2:#1F2126;--side-ink:#EDECE7;--side-mut:#A7A6A0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;word-break:keep-all}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.hq{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh}
.hq.is-narrow{grid-template-columns:minmax(0,1fr)}
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--side);color:var(--side-ink);padding:20px 14px;display:flex;flex-direction:column;gap:24px}
.is-narrow .side{display:none}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px}
.logo{width:32px;height:32px;border-radius:9px;background:#F3F2EE;color:#141519;display:grid;place-items:center;font-weight:600;font-size:12px;font-family:"IBM Plex Mono",monospace;flex:none}
.brand b{font-size:15px;letter-spacing:.04em;display:block}
.brand small{display:block;font-size:12px;color:var(--side-mut);margin-top:1px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-b{display:flex;align-items:center;gap:11px;min-height:42px;padding:0 10px;border:0;background:transparent;border-radius:9px;color:var(--side-mut);font-size:14px;font-weight:500;text-align:left;width:100%}
.nav-b:hover{background:var(--side2);color:var(--side-ink)}
.nav-b.on{background:#2B2D34;color:#fff}
.nav-b svg{width:18px;height:18px;flex:none}
.cnt{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;background:#F3A06A;color:#26140A;border-radius:6px;padding:1px 7px}
.ops{border-top:1px solid #2B2D34;padding:18px 8px 0;display:flex;flex-direction:column;gap:14px}
.ops h4{margin:0;font-size:11.5px;letter-spacing:.1em;color:var(--side-mut);font-weight:600}
.op{display:flex;flex-direction:column;gap:4px}
.op .k{font-size:12.5px;color:var(--side-mut)}
.op .v{font-size:15px;font-weight:600;color:var(--side-ink)}
.op .v em{font-style:normal;font-size:12px;color:var(--side-mut);font-weight:400;margin-left:6px}
.slots{display:flex;gap:4px;margin-top:4px}
.slots i{height:6px;flex:1;border-radius:3px;background:#8FA2FF}
.slots i.off{background:#34363E}
.side-note{margin-top:auto;font-size:12px;color:var(--side-mut);border:1px dashed #3B3D45;border-radius:10px;padding:11px 12px;line-height:1.55}
.side-note b{color:#F6CF84;font-weight:600}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px 32px;background:rgba(243,242,238,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--ln)}
.is-narrow .top{padding:10px 14px;flex-wrap:wrap}
.m-brand{display:none;align-items:center;gap:8px;font-weight:700;font-size:15px;letter-spacing:.04em}
.m-brand .logo{background:var(--ink);color:#fff;width:28px;height:28px}
.is-narrow .m-brand{display:flex}
.search{position:relative;flex:1;max-width:540px}
.is-narrow .search{order:3;flex-basis:100%;max-width:none}
.search label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.search input{width:100%;height:42px;border:1px solid var(--ln2);border-radius:10px;background:var(--sf);padding:0 12px 0 38px;font-size:14px}
.search input::placeholder{color:#76767D}
.search svg{position:absolute;left:12px;top:12px;width:18px;height:18px;color:var(--ink3)}
.results{position:absolute;top:48px;left:0;right:0;background:var(--sf);border:1px solid var(--ln2);border-radius:12px;box-shadow:0 14px 36px rgba(20,20,25,.14);padding:6px;max-height:380px;overflow:auto;z-index:30}
.res{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;border:0;background:none;text-align:left;padding:10px;border-radius:8px;min-height:48px}
.res:hover{background:var(--sf2)}
.res b{font-weight:600;font-size:14px;display:block}
.res small{display:block;color:var(--ink3);font-size:12.5px;margin-top:2px}
.res-empty{padding:14px;font-size:13.5px;color:var(--ink3)}
.kind{font-size:11.5px;color:var(--ink2);border:1px solid var(--ln2);border-radius:6px;padding:2px 7px;white-space:nowrap;flex:none}
.sample{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:#6E4300;background:#FBEFD2;border:1px solid #ECD49A;padding:6px 11px;border-radius:999px;white-space:nowrap}
.sample i{width:6px;height:6px;border-radius:50%;background:#B7791F}
.me{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600}
.av{width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:600}
.mnav{display:none;gap:6px;overflow-x:auto;padding:10px 14px;border-bottom:1px solid var(--ln);background:var(--bg)}
.is-narrow .mnav{display:flex}
.chip{flex:none;border:1px solid var(--ln2);background:var(--sf);border-radius:999px;padding:0 14px;min-height:40px;font-size:13.5px;font-weight:500}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.wrap{width:100%;max-width:1320px;margin:0 auto;padding:30px 32px 72px;display:flex;flex-direction:column;gap:30px}
.is-narrow .wrap{padding:18px 14px 56px;gap:24px}
.ph h1{margin:0;font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.3}
.is-narrow .ph h1{font-size:23px}
.ph h1 em{font-style:normal;color:#B4410E}
.ph p{margin:8px 0 0;color:var(--ink2);font-size:14.5px;line-height:1.55}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.sec-h h2{margin:0;font-size:18px;font-weight:700}
.sec-h .aside{font-size:13px;color:var(--ink3)}
.ex{display:inline-block;font-size:11px;font-weight:600;color:#6E4300;background:#FBEFD2;border-radius:4px;padding:2px 6px;margin-left:8px;vertical-align:3px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--ln);border:1px solid var(--ln);border-radius:14px;overflow:hidden}
.is-narrow .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
.stat{background:var(--sf);padding:16px 18px;display:flex;flex-direction:column;gap:3px;min-width:0}
.stat .k{font-size:13px;color:var(--ink2);font-weight:500}
.stat .v{font-family:"IBM Plex Mono",monospace;font-size:34px;font-weight:600;letter-spacing:-.03em;line-height:1.15}
.is-narrow .stat .v{font-size:28px}
.stat .v small{font-size:17px;color:var(--ink3);font-weight:500}
.stat .s{font-size:12.5px;color:var(--ink3);line-height:1.45}
.stat.hot .v{color:#B4410E}
.opsm{display:none;gap:8px;flex-wrap:wrap}
.is-narrow .opsm{display:flex}
.opsm span{font-size:12.5px;background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:6px 10px;color:var(--ink2)}
.opsm b{color:var(--ink)}
.duo{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;align-items:start}
.is-narrow .duo,.is-mid .duo{grid-template-columns:minmax(0,1fr)}
.panel{background:var(--sf);border:1px solid var(--ln);border-radius:14px;min-width:0}
.pn-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--ln);flex-wrap:wrap}
.pn-h h2{margin:0;font-size:17px;font-weight:700;display:flex;align-items:center;gap:10px}
.big{font-family:"IBM Plex Mono",monospace;font-size:15px;font-weight:600;background:#B4410E;color:#fff;border-radius:7px;padding:1px 8px}
.big.zero{background:#17803D}
.pn-h .aside{font-size:12.5px;color:var(--ink3)}
.inb{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;padding:15px 20px;border-bottom:1px solid var(--ln)}
.inb:last-child{border-bottom:0}
.is-narrow .inb{padding:14px 16px}
.ty{font-size:12px;font-weight:700;border-radius:6px;padding:4px 0;text-align:center;align-self:start;margin-top:1px}
.ty-ap{background:#E8EAFB;color:#2531A8}
.ty-ch{background:#F0E9FB;color:#5F23B0}
.ty-inc{background:#FBE3E0;color:#A51F14}
.inb .t{font-weight:600;font-size:14.5px;line-height:1.45;background:none;border:0;padding:0;text-align:left}
.inb .t:hover{text-decoration:underline;text-underline-offset:3px}
.inb .d{font-size:13px;color:var(--ink2);margin-top:3px;line-height:1.5}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.btn{min-height:38px;padding:0 13px;border-radius:8px;border:1px solid var(--ln2);background:var(--sf);font-size:13px;font-weight:600;white-space:nowrap}
.is-narrow .btn{min-height:44px}
.btn:hover{background:var(--sf2)}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.pri:hover{background:#2C2C33}
.btn.acc{background:var(--acc);color:#fff;border-color:var(--acc)}
.resolved{font-size:13px;color:#166B34;font-weight:600;margin-top:8px;display:flex;align-items:center;gap:6px}
.usage{padding:16px 20px 18px;display:flex;flex-direction:column;gap:18px}
.is-narrow .usage{padding:14px 16px}
.acct{display:flex;flex-direction:column;gap:10px}
.acct-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.acct-h b{font-size:15px;font-weight:700}
.lbl{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--sf2);border:1px solid var(--ln2);color:var(--ink2)}
.meters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.is-narrow .meters{grid-template-columns:minmax(0,1fr)}
.meter{border:1px solid var(--ln);border-radius:11px;padding:12px 13px;min-width:0}
.meter.hit{border-color:#E4ADA5;background:#FDF3F1}
.m-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.m-top .k{font-size:12.5px;color:var(--ink2);font-weight:600}
.m-v{font-family:"IBM Plex Mono",monospace;font-size:26px;font-weight:600;letter-spacing:-.02em}
.m-v.na{font-family:"IBM Plex Sans KR",sans-serif;font-size:15px;color:var(--ink3)}
.bar{position:relative;height:8px;background:#ECEAE3;border-radius:99px;margin:8px 0 7px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--ink)}
.meter.hit .bar i{background:#B42318}
.bar .th{position:absolute;top:-4px;bottom:-4px;width:2px;background:#B42318;border-radius:1px}
.m-meta{font-size:12px;color:var(--ink3);line-height:1.6}
.m-meta b{color:var(--ink2);font-weight:600}
.m-flag{display:inline-block;font-size:12px;font-weight:700;color:#fff;background:#B42318;border-radius:5px;padding:1px 7px;margin-bottom:4px}
.m-ok{display:inline-block;font-size:12px;font-weight:600;color:#166B34;margin-bottom:4px}
.swap{font-size:12.5px;color:var(--ink2);line-height:1.5}
.swap b{color:var(--ink)}
.u-note{font-size:12px;color:var(--ink3);border-top:1px dashed var(--ln2);padding-top:12px;line-height:1.6}
.prow{display:grid;grid-template-columns:minmax(0,2.1fr) minmax(0,1.5fr) 150px 112px;gap:22px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--ln);padding:16px 20px}
.prow:last-child{border-bottom:0}
.prow:hover{background:var(--sf2)}
.is-narrow .prow,.is-mid .prow{grid-template-columns:minmax(0,1fr);gap:10px}
.p-name{font-size:15.5px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.p-goal{font-size:13px;color:var(--ink2);margin-top:4px;line-height:1.5;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.p-block{font-size:12.5px;color:#8E2A1D;margin-top:6px;font-weight:500}
.cyc{font-size:11.5px;color:var(--ink3);font-weight:500;border:1px solid var(--ln2);border-radius:5px;padding:1px 6px}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.stp{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--ink3)}
.stp i{height:5px;border-radius:3px;background:#E3E1D9}
.stp.done{color:var(--ink2)}
.stp.done i{background:#5B5B63}
.stp.now{color:var(--acc);font-weight:700}
.stp.now i{background:var(--acc)}
.crit .n{font-family:"IBM Plex Mono",monospace;font-size:16px;font-weight:600}
.crit .n small{color:var(--ink3);font-size:13px}
.crit .s{font-size:12px;color:var(--ink3);margin-top:2px}
.st{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;padding:4px 10px 4px 9px;border-radius:999px;white-space:nowrap;justify-self:start}
.st::before{content:"";width:8px;height:8px;flex:none;box-sizing:border-box}
.st-run{color:#1D43C9;background:#E6EBFC}
.st-run::before{border-radius:50%;background:currentColor;box-shadow:0 0 0 3px rgba(29,67,201,.2)}
.st-review{color:#5F23B0;background:#F0E9FB}
.st-review::before{border-radius:50%;border:2px solid currentColor}
.st-approve{color:#A33A0B;background:#FCE9D9}
.st-approve::before{background:currentColor;transform:rotate(45deg);width:7px;height:7px}
.st-limit{color:#744C00;background:#F9EDCB}
.st-limit::before{background:currentColor;height:3px;width:10px;border-radius:2px}
.st-stall{color:#A51F14;background:#FBE1DD}
.st-stall::before{background:currentColor;border-radius:1px}
.st-done{color:#166B34;background:#DDF1E3}
.st-done::before{width:5px;height:9px;border:solid currentColor;border-width:0 2px 2px 0;transform:rotate(45deg) translateY(-1px)}
.legend{display:flex;gap:6px;flex-wrap:wrap}
.legend .st{font-size:11.5px;padding:2px 8px 2px 7px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(288px,1fr));gap:14px}
.tcard{display:flex;flex-direction:column;gap:12px;text-align:left;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:16px;width:100%;min-width:0}
.tcard:hover{border-color:var(--ln2);box-shadow:0 6px 18px rgba(20,20,25,.07)}
.tcard.alert{border-color:#E6B3AB}
.t-h{display:flex;justify-content:space-between;gap:8px;align-items:center}
.t-name{font-size:16px;font-weight:700}
.tool{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-family:"IBM Plex Mono",monospace;color:var(--ink2);border:1px solid var(--ln2);border-radius:6px;padding:2px 7px;background:var(--sf2);white-space:nowrap}
.tool i{width:6px;height:6px;border-radius:50%;background:var(--ink2)}
.t-task{font-size:14.5px;font-weight:500;line-height:1.5}
.kv{display:grid;grid-template-columns:58px minmax(0,1fr);gap:6px 10px;font-size:13px;margin:0;line-height:1.5}
.kv dt{color:var(--ink3)}
.kv dd{margin:0;color:var(--ink2)}
.kv dd.warn{color:#8E2A1D;font-weight:500}
.fi{display:grid;grid-template-columns:52px minmax(0,1fr);gap:14px;padding:14px 20px;border-bottom:1px solid var(--ln)}
.fi:last-child{border-bottom:0}
.is-narrow .fi{padding:13px 16px;gap:10px}
.fi .ts{font-size:12.5px;color:var(--ink3);padding-top:2px}
.fi .h{font-size:14px;font-weight:600;line-height:1.5}
.fi .by{font-size:12.5px;color:var(--ink3);font-weight:400;margin-top:2px}
.ev{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.evc{font-size:12px;font-family:"IBM Plex Mono",monospace;color:var(--ink2);background:var(--sf2);border:1px solid var(--ln);border-radius:6px;padding:3px 7px}
.evc.ok{color:#166B34;border-color:#BCE0C7;background:#F0F9F2}
.evc.wait{color:#744C00;border-color:#ECD49A;background:#FDF7E7}
.scrim{position:fixed;inset:0;background:rgba(20,20,26,.3);z-index:40;border:0;padding:0;cursor:default;width:100%}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);background:var(--sf);z-index:41;display:flex;flex-direction:column;box-shadow:-14px 0 44px rgba(20,20,25,.18)}
.d-h{padding:16px 22px 14px;display:flex;flex-direction:column;gap:10px}
.is-narrow .d-h{padding:12px 16px}
.d-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.d-kind{font-size:12.5px;color:var(--ink3);font-weight:600;display:flex;align-items:center;gap:6px}
.x{width:42px;height:42px;border-radius:9px;border:1px solid var(--ln2);background:var(--sf);display:grid;place-items:center;flex:none}
.x:hover{background:var(--sf2)}
.d-title{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em;line-height:1.35}
.d-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--ln);padding:0 14px;overflow-x:auto}
.tab{border:0;background:none;padding:0 12px;min-height:44px;font-size:14px;font-weight:500;color:var(--ink3);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:700}
.d-line{border-bottom:1px solid var(--ln)}
.d-b{flex:1;overflow:auto;padding:20px 22px 40px;display:flex;flex-direction:column;gap:24px}
.is-narrow .d-b{padding:16px 16px 40px}
.blk h3{margin:0 0 10px;font-size:13px;font-weight:700;color:var(--ink2)}
.goal{font-size:16px;line-height:1.65;font-weight:500;margin:0}
.clist{display:flex;flex-direction:column;border:1px solid var(--ln);border-radius:11px}
.ci{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;padding:12px 14px;border-bottom:1px solid var(--ln)}
.ci:last-child{border-bottom:0}
.ck{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--ln2);margin-top:2px;display:grid;place-items:center}
.ck.ok{background:#17803D;border-color:#17803D}
.ci .t{font-size:14px;font-weight:500;line-height:1.5}
.ci .e{font-size:12.5px;color:var(--ink3);margin-top:3px;font-family:"IBM Plex Mono",monospace;line-height:1.5}
.ci .e.ok{color:#166B34}
.todo{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.todo li{font-size:14px;display:flex;gap:10px;align-items:baseline;line-height:1.5}
.todo li::before{content:"";width:12px;height:12px;border:1.5px solid var(--ln2);border-radius:3px;flex:none;transform:translateY(2px)}
.callout{border-radius:11px;padding:13px 14px;font-size:13.5px;line-height:1.55;background:#FBE9E6;color:#7D2016;font-weight:500}
.callout.info{background:#EEF0FB;color:#26307E}
.callout.warn{background:#FBF1D6;color:#5E3E00}
.linkchips{display:flex;gap:6px;flex-wrap:wrap}
.lchip{border:1px solid var(--ln2);background:var(--sf);border-radius:8px;min-height:38px;padding:0 12px;font-size:13px;font-weight:600}
.lchip:hover{background:var(--sf2)}
.term-h{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink3);margin-bottom:8px;gap:8px;flex-wrap:wrap}
.term{background:#111215;color:#D8D7D1;border-radius:11px;padding:14px 16px;font-family:"IBM Plex Mono",monospace;font-size:12.5px;line-height:1.75;overflow-x:auto}
.term .ln{display:flex;gap:14px;white-space:pre}
.term .ts{color:#86857F;flex:none}
.term .cmd{color:#A7BCFF}
.term .ok{color:#83D8A0}
.term .warn{color:#F2C86F}
.term .err{color:#FF978A}
.pv-bar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--ln2);border-radius:9px;padding:2px;background:var(--sf2)}
.seg button{border:0;background:none;min-height:36px;padding:0 13px;border-radius:7px;font-size:13px;font-weight:500;color:var(--ink2)}
.seg button.on{background:var(--sf);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.pv-stage{background:#E7E5DE;border-radius:12px;padding:16px;display:flex;justify-content:center;overflow:hidden}
.pv-frame{background:#fff;border-radius:8px;border:1px solid var(--ln2);overflow:hidden;width:100%;transition:width .25s ease}
.pv-frame.app{width:290px;border-radius:24px;border-width:6px;border-color:#2A2B30}
.pv-url{height:28px;background:var(--sf2);border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:6px;padding:0 10px;font-size:11px;color:var(--ink3);font-family:"IBM Plex Mono",monospace}
.pv-url i{width:7px;height:7px;border-radius:50%;background:#D4D1C7}
.mk{padding:14px;display:flex;flex-direction:column;gap:10px}
.mk-h{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:13px}
.mk-s{height:28px;border-radius:7px;background:#F1F0EC;font-size:11px;color:#6A6A71;display:flex;align-items:center;padding:0 10px}
.mk-g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pv-frame.app .mk-g{grid-template-columns:minmax(0,1fr)}
.mk-c{border:1px solid #E6E4DD;border-radius:8px;padding:9px;display:flex;flex-direction:column;gap:5px}
.mk-c b{font-size:11.5px}
.mk-c span{height:5px;border-radius:3px;background:#E9E7E1}
.mk-c span.s{width:60%}
.mk-tag{font-size:10px;color:#2531A8;background:#E8EAFB;border-radius:4px;padding:1px 5px;align-self:flex-start}
.mk-hero{border-radius:8px;background:#1B1C21;color:#fff;padding:18px 14px;font-size:15px;font-weight:700;line-height:1.35}
.mk-hero small{display:block;font-size:10.5px;font-weight:400;color:#B9B8B2;margin-top:6px}
.empty{border:1px dashed var(--ln2);border-radius:12px;padding:26px;text-align:center;font-size:13.5px;color:var(--ink3);line-height:1.6}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.acard{display:flex;flex-direction:column;text-align:left;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:0;overflow:hidden;width:100%}
.acard:hover{border-color:var(--ln2);box-shadow:0 6px 18px rgba(20,20,25,.07)}
.thumb{height:150px;background:#EDEBE5;display:flex;align-items:center;justify-content:center;padding:18px;border-bottom:1px solid var(--ln)}
.a-body{padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.a-name{font-size:15.5px;font-weight:700}
.a-meta{font-size:12.5px;color:var(--ink3);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.vtag{font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;color:var(--ink);background:var(--sf2);border:1px solid var(--ln2);border-radius:5px;padding:1px 6px}
.doc{width:62%;height:100%;background:#fff;border-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:14px 12px;display:flex;flex-direction:column;gap:6px}
.doc i{height:5px;border-radius:3px;background:#E3E1DA}
.doc i.h{height:8px;width:70%;background:#3A3A42}
.doc i.s{width:55%}
.slide{width:88%;aspect-ratio:16/9;background:#18191E;border-radius:4px;padding:12px;display:flex;flex-direction:column;justify-content:space-between;color:#fff}
.slide b{font-size:12px}
.slide .bars{display:flex;align-items:flex-end;gap:5px;height:40%}
.slide .bars i{flex:1;background:#8FA2FF;border-radius:2px 2px 0 0}
.dsn{width:88%;height:100%;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dsn div{background:#fff;border-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:8px;display:flex;flex-direction:column;gap:5px}
.dsn i{height:5px;border-radius:3px;background:#E3E1DA}
.dsn i.blk{height:34%;background:#2B2C32}
.dsn .gr{display:grid;grid-template-columns:1fr 1fr;gap:4px;flex:1}
.dsn .gr i{height:auto;background:#D9D6CD}
.big-pv{background:#EDEBE5;border-radius:12px;padding:20px;display:flex;justify-content:center}
.docpv{background:#fff;border-radius:6px;box-shadow:0 2px 10px rgba(0,0,0,.08);padding:22px;width:100%;max-width:440px;display:flex;flex-direction:column;gap:10px}
.docpv h4{margin:0;font-size:17px}
.docpv p{margin:0;font-size:13.5px;line-height:1.6;color:var(--ink2)}
.docpv .pvmeta{font-size:12px;color:var(--ink3);font-family:"IBM Plex Mono",monospace}
.slidepv{background:#18191E;color:#fff;border-radius:6px;width:100%;max-width:460px;aspect-ratio:16/9;padding:18px;display:flex;flex-direction:column;justify-content:space-between}
.slidepv h4{margin:0;font-size:16px}
.slidepv p{margin:0;font-size:12px;color:#C9C8C2;line-height:1.5}
.slidepv .bars{display:flex;align-items:flex-end;gap:8px;height:36%}
.slidepv .bars i{flex:1;background:#8FA2FF;border-radius:2px 2px 0 0}
.dsnpv{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.dsnpv figure{margin:0;display:flex;flex-direction:column;gap:6px}
.dsnpv figcaption{font-size:12.5px;font-weight:600;color:var(--ink2)}
.dsnpv .fr{background:#fff;border-radius:6px;box-shadow:0 2px 10px rgba(0,0,0,.08);aspect-ratio:3/4;padding:10px;display:flex;flex-direction:column;gap:6px}
.dsnpv .fr i{height:6px;border-radius:3px;background:#E3E1DA}
.dsnpv .fr i.blk{height:40%;background:#2B2C32}
.dsnpv .fr .gr{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:5px}
.dsnpv .fr .gr i{height:auto;background:#D9D6CD}
.vlist{border:1px solid var(--ln);border-radius:11px}
.vi{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--ln)}
.vi:last-child{border-bottom:0}
.vi.cur{background:#F4F5FD}
.vi .vn{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:14px}
.vi .vt{font-size:13.5px;font-weight:500;line-height:1.45}
.vi .vs{font-size:12px;color:var(--ink3);margin-top:2px}
.curb{font-size:12px;font-weight:700;color:var(--acc)}
.form{display:flex;flex-direction:column;gap:8px}
.form label{font-size:13px;font-weight:600;color:var(--ink2)}
.form textarea{width:100%;min-height:84px;border:1px solid var(--ln2);border-radius:10px;padding:10px 12px;font-size:14px;resize:vertical;background:var(--sf);line-height:1.5}
.form-row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.form-row small{font-size:12px;color:var(--ink3)}
.reqs{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.req{display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-size:13.5px;border:1px solid var(--ln);border-radius:9px;padding:10px 12px}
.req small{font-size:12px;color:var(--ink3);white-space:nowrap}
.rtab{background:var(--sf);border:1px solid var(--ln);border-radius:14px;overflow:hidden}
.rrow{display:grid;grid-template-columns:minmax(0,1.3fr) 76px minmax(0,1.2fr) 70px minmax(0,1.5fr) 92px 92px;gap:14px;align-items:center;padding:13px 18px;border:0;border-bottom:1px solid var(--ln);width:100%;text-align:left;background:none;font-size:13.5px}
.rrow:last-child{border-bottom:0}
button.rrow:hover{background:var(--sf2)}
.rhead{font-size:12px;font-weight:600;color:var(--ink3);background:var(--sf2)}
.is-narrow .rhead,.is-mid .rhead{display:none}
.is-narrow .rrow,.is-mid .rrow{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 14px}
.cl{display:none;font-size:11.5px;color:var(--ink3);margin-bottom:2px}
.is-narrow .cl,.is-mid .cl{display:block}
.r-name{font-weight:700;font-family:"IBM Plex Mono",monospace;font-size:14px}
.is-narrow .r-name,.is-mid .r-name{grid-column:1 / -1}
.r-sub{font-size:12px;color:var(--ink3);font-family:"IBM Plex Sans KR",sans-serif;font-weight:400;margin-top:2px}
.rv{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:3px 8px;white-space:nowrap}
.rv-pass{background:#DDF1E3;color:#166B34}
.rv-cond{background:#F9EDCB;color:#744C00}
.rv-prog{background:#F0E9FB;color:#5F23B0}
.rv-wait{background:#EDEBE5;color:#4A4A52}
.rv-rej{background:#FBE1DD;color:#A51F14}
.rlist{display:flex;flex-direction:column;gap:12px}
.rcard{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.6fr) minmax(0,1fr) minmax(0,1.4fr);gap:20px;align-items:start;text-align:left;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:18px 20px;width:100%}
.rcard:hover{border-color:var(--ln2);box-shadow:0 6px 18px rgba(20,20,25,.07)}
.is-narrow .rcard,.is-mid .rcard{grid-template-columns:minmax(0,1fr);gap:12px}
.rc-k{font-size:12px;color:var(--ink3);font-weight:600;margin-bottom:4px}
.rc-v{font-size:14px;line-height:1.5}
.rc-next{font-family:"IBM Plex Mono",monospace;font-size:18px;font-weight:600}
.rc-name{font-size:16px;font-weight:700;margin-bottom:6px}
.rules{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.is-narrow .rules,.is-mid .rules{grid-template-columns:minmax(0,1fr)}
.rule{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:14px 16px;font-size:13.5px;line-height:1.6;color:var(--ink2)}
.rule b{display:block;color:var(--ink);font-size:14px;margin-bottom:4px}
.utab{background:var(--sf);border:1px solid var(--ln);border-radius:14px;overflow:hidden}
.urow{display:grid;grid-template-columns:minmax(0,1fr) 130px minmax(0,2fr) 80px;gap:14px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--ln);font-size:13.5px}
.urow:last-child{border-bottom:0}
.is-narrow .urow{grid-template-columns:minmax(0,1fr) auto;gap:6px 12px}
.is-narrow .urow .ubar{grid-column:1 / -1}
.urow.head{font-size:12px;color:var(--ink3);font-weight:600;background:var(--sf2)}
.is-narrow .urow.head{display:none}
.ubar{height:6px;background:#ECEAE3;border-radius:3px}
.ubar i{display:block;height:100%;border-radius:3px;background:#6E6E76}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:11px;font-size:13.5px;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100% - 32px);line-height:1.5}
.asg{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink3);margin-top:-6px}
.mdl-unk{color:#744C00;font-weight:600}
.mset{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.mset .callout{align-self:stretch}
.mkv{grid-template-columns:84px minmax(0,1fr);align-self:stretch}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div class="{{rootCls}}" style="--acc: {{accent}}">

<aside class="side" aria-label="주 메뉴">
  <div class="brand"><span class="logo">HQ</span><span><b>AGENT HQ</b><small>대장 전용 작업 공간</small></span></div>
  <nav class="nav">
    <sc-for list="{{navItems}}" as="n" hint-placeholder-count="5">
      <button class="{{n.cls}}" onClick="{{n.go}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{n.icon}}"></path></svg><span>{{n.l}}</span><sc-if value="{{n.hasCnt}}" hint-placeholder-val="{{ false }}"><span class="cnt">{{n.cnt}}</span></sc-if></button>
    </sc-for>
  </nav>
  <div class="ops">
    <h4>운영 규칙</h4>
    <div class="op"><span class="k">동시 AI 작업</span><span class="v mono">{{running}} / 2<em>시작값 2</em></span><div class="slots"><i></i><i></i><i class="off"></i><i class="off"></i></div></div>
    <div class="op"><span class="k">조사 주기</span><span class="v">6시간마다<em>다음 18:00</em></span></div>
    <div class="op"><span class="k">개선 점검</span><span class="v">하루 1회<em>다음 09-29 03:00</em></span></div>
  </div>
  <div class="side-note"><b>시안용 예시 데이터</b><br>진행률·사용량·활동은 모두 가상입니다. 실제 계정이나 에이전트와 연결되어 있지 않습니다.</div>
</aside>

<div class="main">
  <header class="top">
    <div class="m-brand"><span class="logo">HQ</span>AGENT HQ</div>
    <div class="search">
      <label for="hq-search">프로젝트·팀·결과물·도구 검색</label>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <input id="hq-search" type="search" placeholder="프로젝트, 팀, 결과물, 스킬·MCP 검색" value="{{q}}" onChange="{{onQ}}" autocomplete="off">
      <sc-if value="{{hasQ}}" hint-placeholder-val="{{ false }}">
        <div class="results">
          <sc-for list="{{results}}" as="r" hint-placeholder-count="3">
            <button class="res" onClick="{{r.open}}"><span><b>{{r.label}}</b><small>{{r.sub}}</small></span><span class="kind">{{r.kind}}</span></button>
          </sc-for>
          <sc-if value="{{noResults}}" hint-placeholder-val="{{ false }}"><div class="res-empty">‘{{q}}’와 일치하는 항목이 없습니다.</div></sc-if>
        </div>
      </sc-if>
    </div>
    <span class="sample"><i></i>시안용 예시 데이터</span>
    <div class="me"><span class="av">대</span><span>대장</span></div>
  </header>
  <nav class="mnav" aria-label="보기 전환">
    <sc-for list="{{navItems}}" as="n" hint-placeholder-count="5"><button class="{{n.chip}}" onClick="{{n.go}}">{{n.l}}</button></sc-for>
  </nav>

  <div class="wrap">

<!-- ============ 개요 ============ -->
<sc-if value="{{vOverview}}" hint-placeholder-val="{{ true }}">
    <div class="ph">
      <h1>대장, 확인할 항목이 <em>{{openCount}}건</em> 있습니다</h1>
      <p>9월 28일 (월) 14:32 기준 예시 시나리오 · 목표 달성 여부는 검증 근거가 붙은 완료 조건으로만 판단합니다.</p>
    </div>
    <div class="stats">
      <div class="stat"><span class="k">실행 중 AI 작업</span><span class="v">{{running}}<small> / 2 슬롯</small></span><span class="s">개발팀·검증팀 · 모두 Codex</span></div>
      <div class="stat hot"><span class="k">대장 확인 대기</span><span class="v">{{openCount}}</span><span class="s">승인 · 선택 · 장애</span></div>
      <div class="stat"><span class="k">한도 대기 팀</span><span class="v">{{limitTeams}}</span><span class="s">계정 한도 1 · 동시 슬롯 1</span></div>
      <div class="stat"><span class="k">검증된 완료 조건</span><span class="v">{{critOk}}<small> / {{critAll}}</small></span><span class="s">근거가 첨부된 조건만 집계</span></div>
    </div>
    <div class="opsm"><span>동시 작업 <b>{{running}}/2</b></span><span>조사 <b>6시간마다</b></span><span>개선 점검 <b>하루 1회</b></span></div>

    <div class="duo">
      <section class="panel" aria-labelledby="inbox-h">
        <div class="pn-h"><h2 id="inbox-h">대장 확인함 <span class="{{openCls}}">{{openCount}}</span></h2><span class="aside">처리 버튼은 시안 동작만 합니다</span></div>
        <sc-for list="{{approvals}}" as="a" hint-placeholder-count="4">
          <div class="inb">
            <span class="{{a.tyCls}}">{{a.ty}}</span>
            <div>
              <button class="t" onClick="{{a.open}}">{{a.title}}</button>
              <div class="d">{{a.brief}}</div>
              <sc-if value="{{a.isOpen}}" hint-placeholder-val="{{ true }}">
                <div class="acts"><sc-for list="{{a.acts}}" as="x" hint-placeholder-count="2"><button class="{{x.cls}}" onClick="{{x.go}}">{{x.l}}</button></sc-for><button class="btn" onClick="{{a.open}}">자세히</button></div>
              </sc-if>
              <sc-if value="{{a.isDone}}" hint-placeholder-val="{{ false }}"><div class="resolved"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M3.5 8.5l3 3 6-7"></path></svg>{{a.resText}} · 시안 처리</div></sc-if>
            </div>
          </div>
        </sc-for>
      </section>

      <section class="panel" aria-labelledby="use-h">
        <div class="pn-h"><h2 id="use-h">계정 사용량 <span class="ex">예시</span></h2><button class="btn" onClick="{{goUsage}}">상세</button></div>
        <div class="usage">
          <sc-for list="{{accounts}}" as="ac" hint-placeholder-count="2">
            <div class="acct">
              <div class="acct-h"><b>{{ac.name}}</b><span class="lbl">{{ac.lbl}}</span></div>
              <div class="meters">
                <sc-for list="{{ac.meters}}" as="m" hint-placeholder-count="2">
                  <div class="{{m.cls}}">
                    <div class="m-top"><span class="k">{{m.k}}</span><span class="{{m.vCls}}">{{m.vTxt}}</span></div>
                    <div class="bar"><i style="width: {{m.pct}}%"></i><span class="th" style="left: {{m.th}}%"></span></div>
                    <sc-if value="{{m.hit}}" hint-placeholder-val="{{ false }}"><span class="m-flag">중단 기준 도달</span></sc-if>
                    <sc-if value="{{m.safe}}" hint-placeholder-val="{{ true }}"><span class="m-ok">기준 이내</span></sc-if>
                    <div class="m-meta">{{m.rule}}<br>초기화 <b>{{m.reset}}</b></div>
                  </div>
                </sc-for>
              </div>
              <div class="swap">조회 {{ac.checked}} · <b>{{ac.swap}}</b></div>
            </div>
          </sc-for>
          <div class="u-note">빨간 눈금 = 중단 기준. Claude는 사용률(높을수록 소진), Codex는 잔여율(낮을수록 소진)로 표시합니다. 계정 전체 한도이며 팀별 작업 사용량과는 별개입니다.</div>
        </div>
      </section>
    </div>

    <section>
      <div class="sec-h"><h2>프로젝트<span class="ex">예시</span></h2><span class="aside">조사 → 실행 → 검증 → 개선을 반복 · 행을 누르면 상세</span></div>
      <div class="panel">
        <sc-for list="{{projects}}" as="p" hint-placeholder-count="4">
          <button class="prow" onClick="{{p.open}}">
            <div>
              <div class="p-name">{{p.name}} <span class="cyc">{{p.cycle}}</span></div>
              <div class="p-goal">{{p.goal}}</div>
              <sc-if value="{{p.hasBlock}}" hint-placeholder-val="{{ false }}"><div class="p-block">막힘 · {{p.block}}</div></sc-if>
            </div>
            <div class="steps"><sc-for list="{{p.stages}}" as="sg" hint-placeholder-count="4"><div class="{{sg.cls}}"><i></i>{{sg.l}}</div></sc-for></div>
            <div class="crit"><div class="n">{{p.ok}}<small> / {{p.all}} 검증</small></div><div class="s">남은 작업 {{p.left}}개</div></div>
            <span class="{{p.stCls}}">{{p.stL}}</span>
          </button>
        </sc-for>
      </div>
    </section>

    <section>
      <div class="sec-h"><h2>팀 현황<span class="ex">예시</span></h2>
        <div class="legend"><sc-for list="{{legend}}" as="lg" hint-placeholder-count="6"><span class="{{lg.c}}">{{lg.l}}</span></sc-for></div>
      </div>
      <div class="tgrid">
        <sc-for list="{{teams}}" as="t" hint-placeholder-count="7">
          <button class="{{t.cls}}" onClick="{{t.open}}">
            <div class="t-h"><span class="t-name">{{t.name}}</span><span class="{{t.stCls}}">{{t.stL}}</span></div>
            <div class="asg">{{t.assign}}</div>
            <div class="t-task">{{t.task}}</div>
            <dl class="kv">

            <sc-if value="{{ar.isSlide}}" hint-placeholder-val="{{ false }}"><div class="slide"><b>{{ar.head}}</b><div class="bars"><i style="height:40%"></i><i style="height:70%"></i><i style="height:55%"></i><i style="height:90%"></i></div></div></sc-if>
            <sc-if value="{{ar.isDesign}}" hint-placeholder-val="{{ false }}"><div class="dsn"><div><i class="blk"></i><i></i><i></i></div><div><div class="gr"><i></i><i></i><i></i><i></i></div></div></div></sc-if>
          </div>

<!-- ============ 반복 목표 ============ -->
<sc-if value="{{vRecurring}}" hint-placeholder-val="{{ false }}">
    <div class="ph"><h1>반복 목표</h1><p>주기마다 조사 → 실행 → 검증을 돌리는 목표입니다. 대기 중이면 이유를 함께 표시합니다.</p></div>

      <sc-for list="{{recs}}" as="rc" hint-placeholder-count="3">
        <button class="rcard" onClick="{{rc.open}}">
          <div><div class="rc-name">{{rc.name}}</div><span class="{{rc.stCls}}">{{rc.stL}}</span><div class="rc-v" style="margin-top: 8px; color: #62626A; font-size: 13px">{{rc.cadence}}</div></div>
          <div><div class="rc-k">이번 주기 결과 · {{rc.at}}</div><div class="rc-v">{{rc.result}}</div></div>
          <div><div class="rc-k">다음 실행</div><div class="rc-next">{{rc.next}}</div></div>
          <div><div class="rc-k">대기 이유</div><div class="rc-v">{{rc.wait}}</div></div>
        </button>
      </sc-for>
    </div>
</sc-if>

<!-- ============ 레지스트리 ============ -->
<sc-if value="{{vRegistry}}" hint-placeholder-val="{{ false }}">
    <div class="ph"><h1>스킬 · 플러그인 · MCP</h1><p>팀이 쓰는 확장 도구의 출처·버전·권한과 보안팀·정책팀 검토 상태입니다. 이름과 버전은 예시입니다.</p></div>
    <div class="rtab">
      <div class="rrow rhead"><span>이름</span><span>유형</span><span>출처</span><span>버전</span><span>권한</span><span>보안 검토</span><span>정책 검토</span></div>
      <sc-for list="{{tools}}" as="tl" hint-placeholder-count="6">
        <button class="rrow" onClick="{{tl.open}}">
          <span class="r-name">{{tl.name}}<div class="r-sub">{{tl.note}}</div></span>
          <span><span class="cl">유형</span>{{tl.type}}</span>
          <span><span class="cl">출처</span>{{tl.src}}</span>
          <span class="mono"><span class="cl">버전</span>{{tl.ver}}</span>
          <span><span class="cl">권한</span>{{tl.perm}}</span>
          <span><span class="cl">보안 검토</span><span class="{{tl.secCls}}">{{tl.secL}}</span></span>
          <span><span class="cl">정책 검토</span><span class="{{tl.polCls}}">{{tl.polL}}</span></span>
        </button>
      </sc-for>
    </div>
</sc-if>

<!-- ============ 사용량 ============ -->
<sc-if value="{{vUsage}}" hint-placeholder-val="{{ false }}">
    <div class="ph"><h1>사용량</h1><p>계정 한도(Claude·Codex 각각 5시간·주간)와 팀별 작업 사용량을 분리해 보여줍니다. 모든 값은 시안용 예시입니다.</p></div>
    <div class="duo">
      <sc-for list="{{accounts}}" as="ac" hint-placeholder-count="2">
        <section class="panel">
          <div class="pn-h"><h2>{{ac.name}} 계정 한도</h2><span class="lbl">{{ac.lbl}}</span></div>
          <div class="usage">
            <div class="meters">
              <sc-for list="{{ac.meters}}" as="m" hint-placeholder-count="2">
                <div class="{{m.cls}}">
                  <div class="m-top"><span class="k">{{m.k}}</span><span class="{{m.vCls}}">{{m.vTxt}}</span></div>
                  <div class="bar"><i style="width: {{m.pct}}%"></i><span class="th" style="left: {{m.th}}%"></span></div>
                  <sc-if value="{{m.hit}}" hint-placeholder-val="{{ false }}"><span class="m-flag">중단 기준 도달</span></sc-if>
                  <sc-if value="{{m.safe}}" hint-placeholder-val="{{ true }}"><span class="m-ok">기준 이내</span></sc-if>
                  <div class="m-meta">{{m.rule}}<br>초기화 <b>{{m.reset}}</b></div>
                </div>
              </sc-for>
            </div>
            <div class="swap">조회 시각 <b>{{ac.checked}}</b></div>
            <div class="swap">교대 가능 여부 · <b>{{ac.swap}}</b></div>
          </div>
        </section>
      </sc-for>
    </div>
    <div class="rules">
      <div class="rule"><b>Codex · 잔여율 기준</b>5시간 잔여 3% 미만, 또는 주간 잔여 10% 이하이면 새 작업을 멈춥니다.</div>
      <div class="rule"><b>Claude · 사용률 기준</b>같은 기준을 사용률로 환산: 5시간 97% 초과, 주간 90% 이상이면 중단합니다.</div>
      <div class="rule"><b>값이 없을 때</b>제공되지 않는 값은 ‘확인 불가’로 표시하고, 추정하지 않습니다.</div>
    </div>
    <section>
      <div class="sec-h"><h2>팀별 작업 사용량<span class="ex">예시 추정치</span></h2><span class="aside">이번 주 작업 시간 · 계정 한도 비율이 아님</span></div>
      <div class="utab">
        <div class="urow head"><span>팀</span><span>실행 도구</span><span>작업 시간 비중</span><span>시간</span></div>
        <sc-for list="{{teamUse}}" as="u" hint-placeholder-count="7">
          <div class="urow"><span style="font-weight: 600">{{u.name}}</span><span class="tool"><i></i>{{u.tool}}</span><div class="ubar"><i style="width: {{u.pct}}%"></i></div><span class="mono">{{u.h}}h</span></div>
        </sc-for>
      </div>
    </section>
</sc-if>

  </div>
</div>

<!-- ============ 상세 패널 ============ -->
<sc-if value="{{hasSel}}" hint-placeholder-val="{{ false }}">
  <button class="scrim" aria-label="상세 패널 닫기" onClick="{{close}}"></button>
  <aside class="drawer" aria-label="상세 패널">
    <div class="d-h">
      <div class="d-top"><span class="d-kind">{{d.kind}}<span class="ex" style="margin-left: 2px">예시</span></span><button class="x" aria-label="닫기" onClick="{{close}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div>
      <h2 class="d-title">{{d.title}}</h2>
      <div class="d-meta"><sc-if value="{{d.hasSt}}" hint-placeholder-val="{{ true }}"><span class="{{d.stCls}}">{{d.stL}}</span></sc-if><sc-if value="{{d.hasTool}}" hint-placeholder-val="{{ false }}"><span class="tool"><i></i>{{d.tool}}</span></sc-if></div>
    </div>
    <sc-if value="{{d.hasTabs}}" hint-placeholder-val="{{ true }}">
      <div class="tabs" role="tablist"><sc-for list="{{d.tabs}}" as="tb" hint-placeholder-count="3"><button class="{{tb.cls}}" onClick="{{tb.go}}">{{tb.l}}</button></sc-for></div>
    </sc-if>
    <sc-if value="{{d.noTabs}}" hint-placeholder-val="{{ false }}"><div class="d-line"></div></sc-if>
    <div class="d-b">

      <!-- 프로젝트 개요 -->
      <sc-if value="{{isPOver}}" hint-placeholder-val="{{ false }}">
        <div class="blk"><h3>목표</h3><p class="goal">{{d.goal}}</p></div>
        <sc-if value="{{d.hasBlock}}" hint-placeholder-val="{{ false }}"><div class="callout warn">막힌 이유 · {{d.block}}</div></sc-if>
        <div class="blk"><h3>진행 단계 · {{d.cycle}}</h3><div class="steps"><sc-for list="{{d.stages}}" as="sg" hint-placeholder-count="4"><div class="{{sg.cls}}"><i></i>{{sg.l}}</div></sc-for></div></div>
        <div class="blk"><h3>모델 설정 <span class="ex">시안 · 실제 실행과 연결 안 됨</span></h3>
          <div class="mset">
            <div class="seg" role="group" aria-label="프로젝트 기본 모델 정책"><button class="{{m.autoCls}}" aria-pressed="{{m.isAuto}}" onClick="{{m.setAuto}}">자동 선택</button><button class="{{m.pinCls}}" aria-pressed="{{m.isPin}}" onClick="{{m.setPin}}">특정 모델 고정</button></div>
            <sc-if value="{{m.isAuto}}"><div class="callout info">승인된 기본 모델이 있으면 그 모델을, 없으면 실행 도구의 기본 모델을 씁니다. 지금은 승인된 기본 모델이 없어 모델은 ‘확인 필요’입니다.</div></sc-if>
            <sc-if value="{{m.isPin}}">
              <div class="callout warn">고정할 모델 · 확인 필요. 공식 지원과 계정 사용 가능 여부를 확인하기 전에는 고를 수 없습니다. 고정 모델을 쓸 수 없으면 다른 모델로 바꾸지 않고 대기합니다.</div>
              <button class="{{m.fbCls}}" aria-pressed="{{m.fb}}" onClick="{{m.toggleFb}}">대체 모델 허용 · {{m.fbL}}</button>
            </sc-if>
            <dl class="kv mkv"><dt>작업별 예외</dt><dd>없음 · 모든 작업이 기본 정책을 따름</dd><dt>실행 중 모델</dt><dd class="mdl-unk">확인 필요 · 실행 도구의 보고가 없음</dd><dt>다음 회차</dt><dd>{{m.next}}</dd></dl>
            <div class="m-meta">설정 변경은 체크포인트 저장 후 다음 회차부터 적용됩니다. 설정만 바꿨다고 실행 중 모델이 바뀐 것으로 표시하지 않습니다.</div>
          </div>
        </div>
        <div class="blk"><h3>완료 조건 · 검증 근거 ({{d.ok}}/{{d.all}})</h3>
          <div class="clist"><sc-for list="{{d.crit}}" as="c" hint-placeholder-count="4">
            <div class="ci"><span class="{{c.ckCls}}"><sc-if value="{{c.ok}}" hint-placeholder-val="{{ true }}"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="2.6"><path d="M3.5 8.5l3 3 6-7"></path></svg></sc-if></span><div><div class="t">{{c.t}}</div><div class="{{c.eCls}}">{{c.e}}</div></div></div>
          </sc-for></div>
        </div>
        <div class="blk"><h3>남은 작업</h3><ul class="todo"><sc-for list="{{d.remaining}}" as="rm" hint-placeholder-count="3"><li>{{rm.t}}</li></sc-for></ul></div>
        <div class="blk"><h3>참여 팀</h3><div class="linkchips"><sc-for list="{{d.teamLinks}}" as="tl" hint-placeholder-count="2"><button class="lchip" onClick="{{tl.open}}">{{tl.l}}</button></sc-for></div></div>
      </sc-if>

      <!-- 팀 개요 -->
      <sc-if value="{{isTOver}}" hint-placeholder-val="{{ false }}">
        <div class="blk"><h3>현재 작업</h3><p class="goal">{{d.task}}</p></div>
        <div class="{{d.blockCallout}}">막힌 이유 · {{d.block}}</div>
        <div class="blk"><h3>다음 행동</h3><p class="goal" style="font-size: 15px">{{d.next}}</p></div>
        <div class="blk"><h3>실행 도구와 팀의 구분</h3><div class="callout info">{{d.assign}} — {{d.name}}은(는) 역할 단위의 팀, {{d.tool}}은(는) 실행 도구, 모델은 그 도구가 실행하는 AI 모델입니다. 모델은 공식 지원과 이 계정의 사용 가능 여부를 확인하기 전까지 ‘확인 필요’로 표시하며, 임의의 모델 목록을 만들지 않습니다.</div></div>
        <div class="blk"><h3>이번 주 팀 작업 사용량 (예시 추정치)</h3><div class="rc-v"><span class="mono" style="font-size: 20px; font-weight: 600">{{d.hours}}h</span> · 계정 한도 비율과 별개로 집계</div></div>
        <sc-if value="{{d.hasProj}}" hint-placeholder-val="{{ true }}"><div class="blk"><h3>연결된 프로젝트</h3><div class="linkchips"><button class="lchip" onClick="{{d.openProj}}">{{d.projName}}</button></div></div></sc-if>
      </sc-if>

      <!-- 터미널 -->
      <sc-if value="{{isTerm}}" hint-placeholder-val="{{ false }}">
        <div>
          <div class="term-h"><span>실행 로그 · {{d.termLabel}}</span><span>예시 로그 · 실제 세션 아님</span></div>
          <div class="term"><sc-for list="{{d.log}}" as="ln" hint-placeholder-count="5"><div class="ln"><span class="ts">{{ln.ts}}</span><span class="{{ln.c}}">{{ln.tx}}</span></div></sc-for></div>
        </div>
      </sc-if>

      <!-- 미리보기 -->
      <sc-if value="{{isPrev}}" hint-placeholder-val="{{ false }}">
        <sc-if value="{{d.pvNone}}" hint-placeholder-val="{{ false }}"><div class="empty">이 작업은 웹·앱 결과물이 없습니다.<br>문서·슬라이드 결과물은 ‘결과물’에서 확인하세요.</div></sc-if>
        <sc-if value="{{d.pvAny}}" hint-placeholder-val="{{ true }}">
          <div>
            <div class="pv-bar"><div class="seg" role="group" aria-label="미리보기 크기"><button class="{{pvWebCls}}" onClick="{{pvWeb}}">웹</button><button class="{{pvAppCls}}" onClick="{{pvApp}}">앱 (390)</button></div><span style="font-size: 12px; color: #62626A">스테이징 미리보기 · 예시 화면</span></div>
            <div class="pv-stage">
              <div class="{{pvFrameCls}}">
                <div class="pv-url"><i></i><i></i><i></i>{{d.pvUrl}}</div>
                <sc-if value="{{d.pvHub}}" hint-placeholder-val="{{ true }}">
                  <div class="mk">
                    <div class="mk-h"><span>리서치 허브</span><span style="font-weight: 400; font-size: 11px; color: #6A6A71">주제 12 · 자료 318</span></div>
                    <div class="mk-s">‘에이전트 평가’ 관련 자료 찾기</div>
                    <div class="mk-g">
                      <div class="mk-c"><span class="mk-tag">요약 완료</span><b>에이전트 평가 지표 정리</b><span></span><span class="s"></span></div>
                      <div class="mk-c"><span class="mk-tag">연결 4</span><b>도구 호출 실패 사례</b><span></span><span class="s"></span></div>
                      <div class="mk-c"><span class="mk-tag">요약 완료</span><b>장기 작업 메모리 설계</b><span></span><span class="s"></span></div>
                      <div class="mk-c"><span class="mk-tag">검토 필요</span><b>PDF 표 추출 정확도</b><span></span><span class="s"></span></div>
                    </div>
                  </div>
                </sc-if>
                <sc-if value="{{d.pvPort}}" hint-placeholder-val="{{ false }}">
                  <div class="mk">
                    <div class="mk-h"><span>[이름] 포트폴리오</span><span style="font-weight: 400; font-size: 11px; color: #6A6A71">작업 · 소개 · 연락</span></div>
                    <div class="mk-hero">생각을 제품으로 옮기는 일<small>A안 · 편집형 레이아웃</small></div>
                    <div class="mk-g"><div class="mk-c"><b>프로젝트 1</b><span></span><span class="s"></span></div><div class="mk-c"><b>프로젝트 2</b><span></span><span class="s"></span></div></div>
                  </div>
                </sc-if>
              </div>
            </div>
          </div>
        </sc-if>
      </sc-if>

      <!-- 결과물 -->
      <sc-if value="{{isArt}}" hint-placeholder-val="{{ false }}">
        <div class="blk"><h3>현재 버전 미리보기 · {{d.cur}}</h3>
          <div class="big-pv">
            <sc-if value="{{d.isDoc}}" hint-placeholder-val="{{ true }}"><div class="docpv"><div class="pvmeta">{{d.cur}} · {{d.vDate}}</div><h4>{{d.head}}</h4><sc-for list="{{d.lines}}" as="li" hint-placeholder-count="3"><p>{{li.t}}</p></sc-for></div></sc-if>
            <sc-if value="{{d.isSlide}}" hint-placeholder-val="{{ false }}"><div class="slidepv"><div><h4>{{d.head}}</h4><sc-for list="{{d.lines}}" as="li" hint-placeholder-count="2"><p>{{li.t}}</p></sc-for></div><div class="bars"><i style="height:40%"></i><i style="height:70%"></i><i style="height:55%"></i><i style="height:90%"></i><i style="height:65%"></i></div></div></sc-if>
            <sc-if value="{{d.isDesign}}" hint-placeholder-val="{{ false }}"><div class="dsnpv"><figure><div class="fr"><i class="blk"></i><i></i><i style="width: 60%"></i></div><figcaption>A · 편집형</figcaption></figure><figure><div class="fr"><div class="gr"><i></i><i></i><i></i><i></i></div><i style="width: 70%"></i></div><figcaption>B · 그리드형</figcaption></figure></div></sc-if>
          </div>
        </div>
        <div class="blk"><h3>수정 요청</h3>
          <div class="form">
            <label for="req-in">{{d.team}}에 보낼 요청</label>
            <textarea id="req-in" placeholder="예: 3장 수치에 출처 링크를 붙여줘" value="{{draft}}" onChange="{{onDraft}}"></textarea>
            <div class="form-row"><small>요청은 담당 팀 대기열에 ‘검토 대기’로 들어갑니다 (시안)</small><button class="btn pri" onClick="{{submitReq}}">요청 보내기</button></div>
          </div>
          <div class="reqs"><sc-for list="{{d.reqs}}" as="rq" hint-placeholder-count="1"><div class="req"><span>{{rq.t}}</span><small>{{rq.st}}</small></div></sc-for></div>
        </div>
        <div class="blk"><h3>버전 기록</h3>
          <div class="vlist"><sc-for list="{{d.versions}}" as="v" hint-placeholder-count="3">
            <div class="{{v.cls}}"><span class="vn">{{v.id}}</span><div><div class="vt">{{v.note}}</div><div class="vs">{{v.date}} · {{v.by}}</div></div>
              <sc-if value="{{v.isCur}}" hint-placeholder-val="{{ false }}"><span class="curb">현재</span></sc-if>
              <sc-if value="{{v.canRevert}}" hint-placeholder-val="{{ true }}"><button class="btn" onClick="{{v.revert}}">되돌리기</button></sc-if>
            </div>
          </sc-for></div>
        </div>

class DCLogic {
  constructor(props) { this.props = props; this.state = {}; }
  setState(patch) {
    Object.assign(this.state, typeof patch === 'function' ? patch(this.state, this.props) : patch);
    scheduleRender();
  }
}
const HOLE = /\{\{\s*([\w.$]+)\s*\}\}/g;
function lookup(path, vals, scope) {
  const [head, ...rest] = path.split('.');
  let v = Object.hasOwn(scope, head) ? scope[head] : vals[head];
  for (const k of rest) v = v == null ? undefined : v[k];
  return v;
}
const interp = (s, vals, scope) => s.replace(HOLE, (_, p) => { const v = lookup(p, vals, scope); return v == null ? '' : String(v); });

function build(nodes, parent, vals, scope) {
  for (const node of nodes) {
    if (node.nodeType === 3) { parent.appendChild(document.createTextNode(interp(node.data, vals, scope))); continue; }
    if (node.nodeType !== 1) continue;
    if (node.localName === 'sc-if') { if (exact(node.getAttribute('value'), vals, scope)) build(node.childNodes, parent, vals, scope); continue; }
    if (node.localName === 'sc-for') {
      const as = node.getAttribute('as');
      for (const item of exact(node.getAttribute('list'), vals, scope) || []) build(node.childNodes, parent, vals, { ...scope, [as]: item });
      continue;
    }
    const el = node.cloneNode(false);
    for (const { name, value } of [...node.attributes]) {
      if (name.startsWith('hint-')) { el.removeAttribute(name); continue; }
      if (name.startsWith('on')) {
        el.removeAttribute(name);
        const fn = exact(value, vals, scope), type = name.slice(2);
        if (typeof fn !== 'function') continue;
        if (type === 'change') {
          // Re-rendering mid-composition would break Hangul input, so wait for compositionend.
          el.addEventListener('input', e => { if (!e.isComposing) fn(e); });
          el.addEventListener('compositionend', fn);
        } else el.addEventListener(type, fn);
        continue;
      }
      if (value.includes('{{')) {
        const v = interp(value, vals, scope);
        el.setAttribute(name, v);
        if (name === 'value') el.value = v;
      }
    }
    build(node.childNodes, el, vals, scope);
    parent.appendChild(el);
  }
}

    const feed = D.feed;

    const arts = D.arts.map((a) => ({ name: a.name, type: a.type, team: a.team, cur: s.cur[a.id], reqN: (s.reqs[a.id] || []).length,
      isDoc: a.kind === 'doc', isSlide: a.kind === 'slide', isDesign: a.kind === 'design',
      head: (a.versions.find((v) => v.id === s.cur[a.id]) || a.versions[0]).head, open: openF('art', a.id) }));

    const tools = D.tools.map((t) => ({ name: t.name, type: t.type, src: t.src, ver: t.ver, perm: t.perm, note: t.note,
      secL: RV[t.sec].l, secCls: RV[t.sec].c, polL: RV[t.pol].l, polCls: RV[t.pol].c, open: openF('tool', t.id) }));
    const pendingTools = D.tools.filter((t) => t.sec === 'prog' || t.pol === 'wait').length;

    const recs = D.recs.map((r) => Object.assign({}, r, { stCls: ST[r.status].c, stL: ST[r.status].l, open: openF('rec', r.id) }));

    const maxH = Math.max.apply(null, D.teams.map((t) => t.hours));
    const teamUse = D.teams.map((t) => ({ name: t.name, tool: t.tool, h: t.hours.toFixed(1), pct: Math.round(t.hours / maxH * 100) }));

    const views = [
      { id: 'overview', l: '개요', icon: 'M4 5h7v6H4zM13 5h7v4h-7zM13 11h7v8h-7zM4 13h7v6H4z', cnt: openCount },
      { id: 'artifacts', l: '결과물', icon: 'M7 3h7l5 5v13H7zM14 3v5h5', cnt: 0 },
      { id: 'recurring', l: '반복 목표', icon: 'M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3M18 3v4h-4M6 21v-4h4', cnt: 0 },
      { id: 'registry', l: '스킬·플러그인·MCP', icon: 'M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z', cnt: pendingTools },
      { id: 'usage', l: '사용량', icon: 'M5 20V11M11 20V5M17 20v-8M3 20h18', cnt: 0 }
    ];
    const navItems = views.map((v) => ({ l: v.l, icon: v.icon, cnt: v.cnt, hasCnt: v.cnt > 0,
      cls: 'nav-b' + (s.view === v.id ? ' on' : ''), chip: 'chip' + (s.view === v.id ? ' on' : ''),
      go: () => { this.setState({ view: v.id, sel: null, q: '' }); if (typeof window !== 'undefined') window.scrollTo(0, 0); } }));

    // 검색
    const q = s.q.trim().toLowerCase();
    let results = [];
    if (q) {
      const has = (...xs) => xs.some((x) => (x || '').toLowerCase().indexOf(q) >= 0);
      D.projects.forEach((p) => { if (has(p.name, p.goal)) results.push({ label: p.name, sub: ST[p.status].l + ' · ' + p.goal, kind: '프로젝트', open: openF('project', p.id) }); });
      D.teams.forEach((t) => { if (has(t.name, t.task, t.tool)) results.push({ label: t.name, sub: t.tool + ' · ' + t.task, kind: '팀', open: openF('team', t.id) }); });
      D.arts.forEach((a) => { if (has(a.name, a.type)) results.push({ label: a.name, sub: a.type + ' · ' + s.cur[a.id], kind: '결과물', open: openF('art', a.id) }); });
      D.tools.forEach((t) => { if (has(t.name, t.type, t.src)) results.push({ label: t.name, sub: t.type + ' · ' + t.src, kind: '도구', open: openF('tool', t.id) }); });
      D.recs.forEach((r) => { if (has(r.name)) results.push({ label: r.name, sub: r.cadence, kind: '반복 목표', open: openF('rec', r.id) }); });
      D.approvals.forEach((a) => { if (has(a.title, a.brief)) results.push({ label: a.title, sub: a.ty + ' · ' + a.brief, kind: '확인 항목', open: openF('appr', a.id) }); });
      results = results.slice(0, 10);
    }

    // 상세 패널
    const sel = s.sel;
    let d = { kind: '', title: '', hasSt: false, hasTool: false, hasTabs: false, noTabs: true, tabs: [] };
    const tab = s.tab;
    const mkTabs = (list) => list.map((x) => ({ l: x[1], cls: 'tab' + (tab === x[0] ? ' on' : ''), go: () => this.setState({ tab: x[0] }) }));
    const logOf = (key) => (D.logs[key] || []).map((ln) => ({ ts: ln.ts, tx: ln.tx, c: ln.c }));
    let isPOver = false, isTOver = false, isTerm = false, isPrev = false, isArt = false, isTool = false, isAppr = false, isRec = false;
    if (sel) {
      if (sel.kind === 'project') {
        const p = projById[sel.id];
        const ok = p.crit.filter((c) => c.ok).length;
        d = { kind: '프로젝트', title: p.name, hasSt: true, stCls: ST[p.status].c, stL: ST[p.status].l, hasTool: false,
          hasTabs: true, noTabs: false, tabs: mkTabs([['overview', '개요'], ['term', '터미널·로그'], ['prev', '웹/앱 미리보기']]),
          goal: p.goal, block: p.block, hasBlock: !!p.block, cycle: p.cycle, stages: mkStages(p), ok: ok, all: p.crit.length,
          crit: p.crit.map((c) => ({ t: c.t, e: c.e, ok: c.ok, ckCls: 'ck' + (c.ok ? ' ok' : ''), eCls: 'e' + (c.ok ? ' ok' : '') })),
          remaining: p.remaining.length ? p.remaining.map((t) => ({ t: t })) : [{ t: '남은 작업 없음 · 모든 조건 검증 완료' }],
          teamLinks: p.teams.map((id) => ({ l: teamById[id].name, open: openF('team', id) })),
          termLabel: p.name, log: logOf(p.id),
          pvNone: p.pv === 'none', pvAny: p.pv !== 'none', pvHub: p.pv === 'hub', pvPort: p.pv === 'port', pvUrl: p.url || '' };
        isPOver = tab === 'overview'; isTerm = tab === 'term'; isPrev = tab === 'prev';
      } else if (sel.kind === 'team') {
        const t = teamById[sel.id];
        const p = t.proj ? projById[t.proj] : null;
        const pv = p ? p.pv : 'none';
        d = { kind: '팀', title: t.name, name: t.name, hasSt: true, stCls: ST[t.status].c, stL: ST[t.status].l, hasTool: true, tool: t.tool, assign: assignOf(t),
          hasTabs: true, noTabs: false, tabs: mkTabs([['overview', '개요'], ['term', '터미널·로그'], ['prev', '웹/앱 미리보기']]),
          task: t.task, block: t.block, next: t.next, blockCallout: t.block === '없음' ? 'callout info' : (t.status === 'stall' ? 'callout' : 'callout warn'),
          hours: t.hours.toFixed(1), hasProj: !!p, projName: p ? p.name : '', openProj: p ? openF('project', p.id) : null,
          termLabel: t.name + ' · ' + t.tool, log: logOf(t.log),
          pvNone: pv === 'none', pvAny: pv !== 'none', pvHub: pv === 'hub', pvPort: pv === 'port', pvUrl: p && p.url ? p.url : '' };
        isTOver = tab === 'overview'; isTerm = tab === 'term'; isPrev = tab === 'prev';
      } else if (sel.kind === 'art') {
        const a = D.arts.find((x) => x.id === sel.id);
        const cur = s.cur[a.id];
        const cv = a.versions.find((v) => v.id === cur) || a.versions[0];
        d = { kind: '결과물 · ' + a.type, title: a.name, hasSt: false, hasTool: false, hasTabs: false, noTabs: true, tabs: [],
          team: a.team, cur: cur, vDate: cv.date, head: cv.head, lines: cv.lines.map((t) => ({ t: t })),
          isDoc: a.kind === 'doc', isSlide: a.kind === 'slide', isDesign: a.kind === 'design',
          reqs: (s.reqs[a.id] || []).slice().reverse(),
          versions: a.versions.map((v) => ({ id: v.id, date: v.date, by: v.by, note: v.note, isCur: v.id === cur, canRevert: v.id !== cur,
            cls: 'vi' + (v.id === cur ? ' cur' : ''),
            revert: () => { const c = Object.assign({}, s.cur); c[a.id] = v.id; this.setState({ cur: c }); this.say(v.id + ' 내용으로 되돌렸습니다 · 이후 버전 기록은 보존 (시안)'); } })) };
        isArt = true;
      } else if (sel.kind === 'tool') {
        const t = D.tools.find((x) => x.id === sel.id);
        d = { kind: '도구 · ' + t.type, title: t.name, hasSt: false, hasTool: false, hasTabs: false, noTabs: true, tabs: [],
          type: t.type, src: t.src, ver: t.ver, perm: t.perm, used: t.used,
          secL: RV[t.sec].l, secCls: RV[t.sec].c, polL: RV[t.pol].l, polCls: RV[t.pol].c, secChecks: t.secChecks, polChecks: t.polChecks };
        isTool = true;
      } else if (sel.kind === 'appr') {
        const a = approvals.find((x) => x.id === sel.id);
        d = { kind: '대장 확인 · ' + a.ty, title: a.title, hasSt: false, hasTool: false, hasTabs: false, noTabs: true, tabs: [],
          body: a.body, ev: a.ev, impact: a.impact, acts: a.acts, isOpen: a.isOpen, isDone: a.isDone, resText: a.resText };
        isAppr = true;
      } else if (sel.kind === 'rec') {
        const r = D.recs.find((x) => x.id === sel.id);
        d = { kind: '반복 목표', title: r.name, hasSt: true, stCls: ST[r.status].c, stL: ST[r.status].l, hasTool: false, hasTabs: false, noTabs: true, tabs: [],
          cadence: r.cadence, next: r.next, wait: r.wait, team: r.team, at: r.at, result: r.result,
          history: r.history.map((h) => ({ at: h.at, r: h.r, stCls: ST[h.s].c, stL: ST[h.s].l })) };
        isRec = true;
      }
    }

    // 프로젝트 모델 설정 (시안): 화면 상태만 바뀌고 엔진에는 연결되지 않는다.
    const mp = Object.assign({ mode: 'auto', fb: false }, sel && sel.kind === 'project' ? s.mpol[sel.id] : null);
    const setMp = (patch) => () => {
      const all = Object.assign({}, this.state.mpol);
      all[sel.id] = Object.assign({ mode: 'auto', fb: false }, all[sel.id], patch);
      this.setState({ mpol: all });
      this.say('시안: 설정 화면만 바뀌었습니다. 실제 실행에는 반영되지 않습니다.');
    };
    const modelSetting = {
      isAuto: mp.mode === 'auto', isPin: mp.mode === 'pinned', fb: mp.fb, fbL: mp.fb ? '켜짐' : '꺼짐',
      autoCls: mp.mode === 'auto' ? 'on' : '', pinCls: mp.mode === 'pinned' ? 'on' : '', fbCls: 'btn' + (mp.fb ? ' pri' : ''),
      setAuto: setMp({ mode: 'auto' }), setPin: setMp({ mode: 'pinned' }), toggleFb: setMp({ fb: !mp.fb }),
      next: mp.mode === 'auto' ? '실행 도구 기본 모델 · 확인 필요'
        : mp.fb ? '고정 모델 사용 불가 → 대체 허용으로 실행 도구 기본 모델 (확인 필요)' : '고정 모델 사용 불가 → 대기 (자동 교체 안 함)'
    };

    const submitReq = () => {
      if (!sel || sel.kind !== 'art') return;
      const t = s.draft.trim();
      if (!t) { this.say('수정 요청 내용을 입력해 주세요'); return; }
      const r = Object.assign({}, s.reqs); r[sel.id] = (r[sel.id] || []).concat([{ t: t, st: '검토 대기 · 방금' }]);
      this.setState({ reqs: r, draft: '' });
      this.say('수정 요청을 담당 팀 대기열에 추가했습니다 (시안)');
    };

    return {
      rootCls: 'hq' + (narrow ? ' is-narrow' : '') + (mid ? ' is-mid' : ''),
      accent: this.props.accent || '#2F3FCF',
      navItems: navItems, running: running, limitTeams: limitTeams, openCount: openCount,
      openCls: 'big' + (openCount === 0 ? ' zero' : ''),
      critOk: critOk, critAll: critAll,
      q: s.q, hasQ: q.length > 0, results: results, noResults: q.length > 0 && results.length === 0,
      onQ: (e) => this.setState({ q: e.target.value }),
      vOverview: s.view === 'overview', vArtifacts: s.view === 'artifacts', vRecurring: s.view === 'recurring', vRegistry: s.view === 'registry', vUsage: s.view === 'usage',
      approvals: approvals, accounts: accounts, projects: projects, teams: teams, legend: legend, feed: feed,
      arts: arts, tools: tools, recs: recs, teamUse: teamUse,
      goUsage: () => this.setState({ view: 'usage', sel: null }),
      hasSel: !!sel, d: d, close: () => this.setState({ sel: null }),
      isPOver: isPOver, isTOver: isTOver, isTerm: isTerm, isPrev: isPrev, isArt: isArt, isTool: isTool, isAppr: isAppr, isRec: isRec,
      pvWebCls: s.pv === 'web' ? 'on' : '', pvAppCls: s.pv === 'app' ? 'on' : '',
      pvWeb: () => this.setState({ pv: 'web' }), pvApp: () => this.setState({ pv: 'app' }),
      pvFrameCls: 'pv-frame' + (s.pv === 'app' ? ' app' : ''),
      m: modelSetting,
      draft: s.draft, onDraft: (e) => this.setState({ draft: e.target.value }), submitReq: submitReq,
      hasToast: !!s.toast, toast: s.toast
    };
  }
}

const root = document.getElementById('app');
const tpl = document.getElementById('tpl').content;
const comp = new Component({ accent: '#2F3FCF', forceNarrow: false });
let queued = false;
function scheduleRender() { if (!queued) { queued = true; queueMicrotask(() => { queued = false; render(); }); } }
function render() {
  const active = document.activeElement, id = active && active.id;
  const range = id && typeof active.selectionStart === 'number' ? [active.selectionStart, active.selectionEnd] : null;
  const scrolls = [...root.querySelectorAll('.d-b, .results')].map(el => [el.className, el.scrollTop]);
  const frag = document.createDocumentFragment();
  build(tpl.childNodes, frag, comp.renderVals(), {});
  root.replaceChildren(frag);
  for (const [cls, top] of scrolls) { const el = root.getElementsByClassName(cls)[0]; if (el) el.scrollTop = top; }
  const again = id && document.getElementById(id);
  if (again) { again.focus({ preventScroll: true }); if (range) again.setSelectionRange(...range); }
}
render();
comp.componentDidMount?.();
</script>
</body>
</html>
