# AGENT HQ 원격 검증 (docs/codex-격리-복원.md 19절). 보호 파일 — 바꾸려면 대장 서명 승인이 필요하다.
# main 보호 규칙에서 이 작업(guard)을 필수 검사로 지정하면, 실패한 변경은 병합되지 않는다.
name: architecture-guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  guard:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: 저장소 받기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Node 준비
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'

      - name: 아키텍처 가드 (헌장·멀티 모델 구조·보호 파일·서명 승인)
        run: node scripts/아키텍처-검사.mjs

      - name: 원격 검증 (보호 정책 무결성·CI 우회 경로·서명·변경 해시)
        run: node scripts/원격-검증.mjs

      - name: 공개 전 검사 (이번 변경이 들이는 파일의 비밀정보·민감 파일)
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then BASE="${{ github.event.pull_request.base.sha }}"; else BASE="${{ github.event.before }}"; fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then BASE="$(git rev-list --max-parents=0 HEAD | tail -n 1)"; fi
          node scripts/공개전-검사.mjs --range "$BASE..${{ github.sha }}"

      - name: 전체 시험 (package.json 의 스크립트를 거치지 않고 직접)
        run: node --test "test/**/*.test.js"
        env:
          CI: '1'
